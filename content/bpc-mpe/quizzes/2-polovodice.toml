text = '''
Germanium obsahuje 0,0100 atomových % antimonu; při 20,0 °C jsou všechny atomy antimonu ionizované. V 1,00 m³ germania je $4{,}506\cdot10^{28}$ atomů. Jaká je koncentrace elektronů $n_n$?
'''
value = 4.506e24
tolerance = 0.045e24
unit = 'm⁻³'
explanation = '''
Antimon je z 5. skupiny, v germaniu je donor: každý ionizovaný atom dá jeden volný elektron. Vlastní elektrony ($2{,}33\cdot10^{19}$) jsou proti tomu zanedbatelné.

$$n_n \approx N_{Sb} = \frac{0{,}01}{100}\cdot N_{Ge} = 1\cdot10^{-4}\cdot4{,}506\cdot10^{28} = 4{,}506\cdot10^{24}\ \mathrm{m^{-3}}$$
'''

[[question]]
id = 'PV-23'
kind = 'numeric'
topic = 'Příměsový polovodič'
source = 'Zadání, příklad 5'
tags = ['zadani']
text = '''
Germanium s 0,0100 at. % antimonu (všechen ionizovaný) při 20,0 °C; $N_{Ge} = 4{,}506\cdot10^{28}\ \mathrm{m^{-3}}$, vlastní koncentrace $n_i = 2{,}33\cdot10^{19}\ \mathrm{m^{-3}}$. Jaká je koncentrace děr $p_n$?
'''
value = 1.205e14
tolerance = 0.015e14
unit = 'm⁻³'
explanation = '''
$n_n = 1\cdot10^{-4}\cdot4{,}506\cdot10^{28} = 4{,}506\cdot10^{24}\ \mathrm{m^{-3}}$. Zákon působících hmot platí i v příměsovém polovodiči, $n_i^2 = n_n\cdot p_n$:

$$p_n = \frac{n_i^2}{n_n} = \frac{(2{,}33\cdot10^{19})^2}{4{,}506\cdot10^{24}} = 1{,}205\cdot10^{14}\ \mathrm{m^{-3}}$$

**Jak to říct:** „Součin n·p závisí jen na materiálu a teplotě. Když donory zvýší koncentraci elektronů, díry se se stejným poměrem sníží.“
'''

[[question]]
id = 'PV-24'
kind = 'numeric'
topic = 'Příměsový polovodič'
source = 'Zadání, příklad 5'
tags = ['zadani']
text = '''
Germanium s 0,0100 at. % antimonu (všechen ionizovaný) při 20,0 °C; $N_{Ge} = 4{,}506\cdot10^{28}\ \mathrm{m^{-3}}$, $n_i = 2{,}33\cdot10^{19}\ \mathrm{m^{-3}}$, $\mu_n = 0{,}39$, $\mu_p = 0{,}19\ \mathrm{m^2V^{-1}s^{-1}}$. Jaká je konduktivita polovodiče?
'''
value = 2.815e5
tolerance = 0.03e5
unit = 'S·m⁻¹'
explanation = '''
$n_n = 4{,}506\cdot10^{24}\ \mathrm{m^{-3}}$, $p_n = \dfrac{n_i^2}{n_n} = 1{,}205\cdot10^{14}\ \mathrm{m^{-3}}$.

$$\gamma = q\,(n_n\mu_n + p_n\mu_p) = 1{,}602\cdot10^{-19}\cdot(4{,}506\cdot10^{24}\cdot0{,}39 + 1{,}205\cdot10^{14}\cdot0{,}19) = 2{,}815\cdot10^{5}\ \mathrm{S\cdot m^{-1}}$$

Člen děr ($2{,}3\cdot10^{13}$) je proti členu elektronů ($1{,}76\cdot10^{24}$) zanedbatelný.
'''

