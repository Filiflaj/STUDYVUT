  'Posouvá se do valenčního pásu, polovodič se stane vodičem typu P.',
]
answer = 2
explanation = '''
$$W_F = W_V + \frac12 W_g + \frac34 kT\ln\frac{m_p^*}{m_n^*}$$

Při $m_p^* < m_n^*$ je logaritmus záporný a člen roste s $T$: hladina klesá k valenčnímu pásu, ale jen o tisíciny až setiny eV (0,555 eV při 0 K, 0,542 eV při 500 K).
'''
notes = [
  'Uprostřed je jen při 0 K nebo při stejných efektivních hmotnostech. $n = p$ platí, ale hustoty stavů $N_C$ a $N_V$ se liší.',
