tags = ['zadani']
text = '''
Germanium má krystalovou strukturu diamantu, hrana jeho elementární buňky je $5{,}62\cdot10^{-10}$ m. Kolik atomů germania je v 1,00 m³ při 20 °C?
'''
value = 4.507e28
tolerance = 0.05e28
unit = 'm⁻³'
explanation = '''
Struktura diamantu: 8 atomů v buňce.

$$N_{Ge} = \frac{V\cdot N_E}{V_E} = \frac{1\cdot8}{(5{,}62\cdot10^{-10})^3} = 4{,}507\cdot10^{28}\ \mathrm{m^{-3}}$$

Tuto hodnotu ($4{,}506\cdot10^{28}$) zadání používá v příkladech 5 a 6.
'''

# ---------- Zadání, příklad 2: vlastní koncentrace z rezistivity

[[question]]
id = 'PV-03'
kind = 'numeric'
topic = 'Vlastní polovodič'
source = 'Zadání, příklad 2'
tags = ['zadani']
text = '''
Rezistivita čistého germania je při 20,0 °C rovna 0,470 Ω·m. Pohyblivost elektronů je 0,39 m²·V⁻¹·s⁻¹, děr 0,19 m²·V⁻¹·s⁻¹. Jaká je koncentrace nosičů (elektronů a stejně tak děr) ve vlastním germaniu?
'''
value = 2.29e19
tolerance = 0.03e19
unit = 'm⁻³'
explanation = '''
Ve vlastním polovodiči vedou elektrony i díry a $n = p = n_i$:

$$\gamma = n_i\cdot q\cdot(\mu_n + \mu_p) \qquad \rho = \frac{1}{\gamma} \quad\Rightarrow\quad n_i = \frac{1}{\rho\cdot q\cdot(\mu_n + \mu_p)}$$

$$n_{i,Ge} = \frac{1}{0{,}470\cdot1{,}602\cdot10^{-19}\cdot(0{,}39 + 0{,}19)} = 2{,}29\cdot10^{19}\ \mathrm{m^{-3}}$$

V sešitu je dosazeno $q = 1{,}6\cdot10^{-19}$ C a zapsán výsledek $2{,}28\cdot10^{19}$; s $1{,}602\cdot10^{-19}$ C ze zadání vychází $2{,}29\cdot10^{19}$. Obojí se uznává.

**Jak to říct:** „Rezistivita je převrácená konduktivita a ve vlastním polovodiči vedou oba druhy nosičů se stejnou koncentrací n_i.“
'''

[[question]]
