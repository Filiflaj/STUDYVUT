$$n_{i,Si} = \frac{1}{\rho\cdot q\cdot(\mu_n + \mu_p)} = \frac{1}{2\,350\cdot1{,}602\cdot10^{-19}\cdot(0{,}135 + 0{,}048)} = 1{,}45\cdot10^{16}\ \mathrm{m^{-3}}$$

Křemík má proti germaniu o tři řády méně nosičů, a proto o tolik větší rezistivitu.
'''

# ---------- Zadání, příklad 3: vlastní Si a Ge při 20, 100 a 200 °C

[[question]]
id = 'PV-05'
kind = 'numeric'
topic = 'Vlastní polovodič'
source = 'Zadání, příklad 3'
tags = ['zadani']
text = '''
Křemík s vlastní vodivostí: $W_g = 1{,}11$ eV, $N_C = 2{,}8\cdot10^{25}\ \mathrm{m^{-3}}$, $N_V = 1{,}04\cdot10^{25}\ \mathrm{m^{-3}}$. Jaká je koncentrace elektronů (a stejně tak děr) při **20,0 °C**?
'''
value = 4.87e15
tolerance = 0.07e15
unit = 'm⁻³'
explanation = '''
Koncentrace elektronů a děr: $n = N_C\, e^{-\frac{W_C - W_F}{kT}}$, $p = N_V\, e^{-\frac{W_F - W_V}{kT}}$. Ve vlastním polovodiči leží Fermiho hladina uprostřed zakázaného pásu, $W_C - W_F = W_F - W_V = \frac12 W_g$, a z $n_i^2 = n\cdot p$:

$$n_i^2 = N_C N_V\, e^{-\frac{W_g}{kT}} \quad\Rightarrow\quad n_i = \sqrt{N_C N_V}\cdot e^{-\frac{W_g}{2kT}}$$

$T = 293{,}15$ K, $W_g = 1{,}11\cdot1{,}602\cdot10^{-19} = 1{,}778\cdot10^{-19}$ J:

$$n_i = \sqrt{2{,}8\cdot10^{25}\cdot1{,}04\cdot10^{25}}\cdot e^{-\frac{1{,}778\cdot10^{-19}}{2\cdot1{,}38\cdot10^{-23}\cdot293{,}15}} = 1{,}706\cdot10^{25}\cdot e^{-21{,}98} = 4{,}87\cdot10^{15}\ \mathrm{m^{-3}}$$

**Jak to říct:** „Ve vlastním polovodiči je n = p, Fermiho hladina je uprostřed zakázaného pásu, proto v exponentu vystupuje polovina šířky pásu.“
'''

