# ---------- Zadání, příklad 1: koncentrace atomů Si a Ge

[[question]]
id = 'PV-01'
kind = 'numeric'
topic = 'Koncentrace atomů'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Křemík má krystalovou strukturu diamantu, hrana jeho elementární buňky je $5{,}43\cdot10^{-10}$ m. Kolik atomů křemíku je v 1,00 m³ při 20,0 °C?
'''
value = 4.997e28
tolerance = 0.05e28
unit = 'm⁻³'
explanation = '''
Struktura diamantu: $N_E = 8\cdot\frac18 + 6\cdot\frac12 + 4 = 8$ atomů v buňce o objemu $V_E = a^3$. Koncentrace v buňce je stejná jako v celém krystalu:

$$\frac{N}{V} = \frac{N_E}{V_E} \quad\Rightarrow\quad N_{Si} = \frac{V\cdot N_E}{V_E} = \frac{1\cdot8}{(5{,}43\cdot10^{-10})^3} = 4{,}997\cdot10^{28} \doteq 5\cdot10^{28}\ \mathrm{m^{-3}}$$

**Jak to říct:** „V jedné buňce je 8 atomů v objemu a³; kolikrát se buňka vejde do metru krychlového, tolikrát víc je tam atomů.“
'''

[[question]]
