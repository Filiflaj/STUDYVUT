# ---------- Zadání, příklad 4: Fermiho hladina ve vlastním křemíku

[[question]]
id = 'PV-17'
kind = 'numeric'
topic = 'Fermiho hladina'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
Vlastní křemík, $W_g = 1{,}11$ eV, poměr efektivních hmotností děr a elektronů $m_p^*/m_n^* = 0{,}67$. Kde leží Fermiho hladina při **0 K**? Udejte $W_F - W_V$.
'''
value = 0.555
tolerance = 0.001
unit = 'eV'
explanation = '''
Z rovnosti $n = p$ ve vlastním polovodiči:

$$W_F = \frac12(W_C + W_V) + \frac12 kT\ln\frac{N_V}{N_C}$$

Po dosazení $N_C = 2\left(\frac{2\pi m_n^* kT}{h^2}\right)^{3/2}$, $N_V = 2\left(\frac{2\pi m_p^* kT}{h^2}\right)^{3/2}$ a $W_C = W_V + W_g$ se všechno kromě poměru hmotností zkrátí:

$$W_F = W_V + \frac12 W_g + \frac34 kT\ln\frac{m_p^*}{m_n^*}$$

Při $T = 0$ je druhý člen nulový:

$$W_F = W_V + \frac12\cdot1{,}11\cdot1{,}602\cdot10^{-19} = W_V + 8{,}89\cdot10^{-20}\ \mathrm{J} = W_V + 0{,}555\ \mathrm{eV}$$

**Jak to říct:** „Při nule leží Fermiho hladina přesně uprostřed zakázaného pásu; s teplotou se posouvá podle poměru efektivních hmotností.“
'''

[[question]]
id = 'PV-18'
kind = 'numeric'
topic = 'Fermiho hladina'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
Vlastní křemík, $W_g = 1{,}11$ eV, $m_p^*/m_n^* = 0{,}67$. Kde leží Fermiho hladina při **100 K**? Udejte $W_F - W_V$ na tři desetinná místa.
'''
value = 0.5524
tolerance = 0.001
unit = 'eV'
explanation = '''
$$W_F = W_V + \frac12 W_g + \frac34 kT\ln\frac{m_p^*}{m_n^*}$$

$$W_F - W_V = 8{,}891\cdot10^{-20} + \frac34\cdot1{,}38\cdot10^{-23}\cdot100\cdot\ln0{,}67 = 8{,}891\cdot10^{-20} - 4{,}14\cdot10^{-22} = 8{,}85\cdot10^{-20}\ \mathrm{J}$$

$$\frac{8{,}85\cdot10^{-20}}{1{,}602\cdot10^{-19}} = 0{,}552\ \mathrm{eV}$$

$\ln 0{,}67 < 0$, proto hladina s teplotou klesá k valenčnímu pásu. Rozdíly mezi teplotami jsou jen tisíciny eV, proto se tu uznává jen ±0,001 eV.
'''

