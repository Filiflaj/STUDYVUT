tolerance = 0.08
unit = 'A'
explanation = '''
$$I = n\cdot q\cdot S\cdot v_D = 8{,}5\cdot10^{28}\cdot1{,}602\cdot10^{-19}\cdot2{,}5\cdot10^{-6}\cdot2\cdot10^{-4} = 6{,}81\ \mathrm{A}$$
'''

[[question]]
id = 'VO-18'
kind = 'numeric'
topic = 'Rezistivita'
source = 'Obměna příkladu 2'
tags = ['obmena']
text = '''
**Obměna příkladu 2.** Hliníkový vodič o délce 20,0 m a průřezu 0,500 mm² má při 20 °C odpor 1,12 Ω. Jaká je rezistivita hliníku?
'''
value = 2.80e-8
tolerance = 0.03e-8
unit = 'Ω·m'
explanation = '''
$$\rho = \frac{R\cdot S}{l} = \frac{1{,}12\cdot0{,}5\cdot10^{-6}}{20} = 2{,}80\cdot10^{-8}\ \Omega\cdot\mathrm{m} = 0{,}028\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}}$$
