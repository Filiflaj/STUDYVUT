text = '''
**Obměna příkladu 1.** Vodič má průřez 2,50 mm², koncentrace volných elektronů je $8{,}50\cdot10^{28}\ \mathrm{m^{-3}}$ a jejich střední driftová rychlost $2{,}00\cdot10^{-4}\ \mathrm{m\cdot s^{-1}}$. Jaký proud vodičem prochází?
'''
