text = '''
**Obměna příkladu 6.** Výstupní potenciál elektronů z mědi je 4,29 V, z hliníku 4,08 V. Koncentrace volných elektronů je v mědi $8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$, v hliníku $18{,}1\cdot10^{28}\ \mathrm{m^{-3}}$. Jak velké je dotykové napětí při 20,0 °C?
'''
value = 0.2293
tolerance = 0.003
unit = 'V'
explanation = '''
Kov 1 = hliník, kov 2 = měď:

$$U_{12} = U_2 - U_1 + \frac{kT}{q}\ln\frac{n_1}{n_2} = 4{,}29 - 4{,}08 + 0{,}02525\cdot\ln\frac{18{,}1\cdot10^{28}}{8{,}42\cdot10^{28}} = 0{,}21 + 0{,}0193 = 0{,}229\ \mathrm{V}$$

Hliník má menší výstupní potenciál **i** víc volných elektronů: oba vlivy ho nabíjejí kladně a sečtou se (u dvojice Cu–Ta šly proti sobě).
'''

