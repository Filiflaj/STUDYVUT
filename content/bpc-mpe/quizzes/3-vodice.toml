Koncentrace volných elektronů = koncentrace atomů ($\frac{m}{N} = \frac{M}{N_A}$):

$$n = \frac{\rho_m\cdot V\cdot N_A}{M} = \frac{8\,890\cdot1\cdot6{,}022\cdot10^{26}}{63{,}57} = 8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$$

$$\mu = \frac{1}{n\cdot q\cdot\rho} = \frac{1}{8{,}42\cdot10^{28}\cdot1{,}602\cdot10^{-19}\cdot1{,}724\cdot10^{-8}} = 4{,}3\cdot10^{-3}\ \mathrm{m^2V^{-1}s^{-1}}$$

V sešitu je u výsledku jednotka zapsaná jako „m³V⁻¹m⁻¹“, správně $\mathrm{m^2V^{-1}s^{-1}}$.
