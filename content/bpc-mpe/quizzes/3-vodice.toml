# ---------- Zadání, příklad 1: proud z koncentrace a driftové rychlosti

[[question]]
id = 'VO-01'
kind = 'numeric'
topic = 'Proud a driftová rychlost'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Kovový vodič má průřez 1,00 mm². Koncentrace volných elektronů je $5{,}00\cdot10^{28}\ \mathrm{m^{-3}}$, jejich střední driftová rychlost $1{,}50\cdot10^{-4}\ \mathrm{m\cdot s^{-1}}$. Jaký proud vodičem prochází?
'''
value = 1.20
tolerance = 0.02
unit = 'A'
explanation = '''
Za čas $t$ projdou průřezem $S$ všechny elektrony z úseku délky $l = v_D t$, tedy z objemu $V = S\cdot l$:

$$I = \frac{Q}{t} = \frac{n\cdot q\cdot V}{t} = \frac{n\cdot q\cdot S\cdot l}{l/v_D} = n\cdot q\cdot S\cdot v_D$$

$$I = 5\cdot10^{28}\cdot1{,}602\cdot10^{-19}\cdot1\cdot10^{-6}\cdot1{,}5\cdot10^{-4} = 1{,}2\ \mathrm{A}$$

**Jak to říct:** „Náboj, který projde průřezem za sekundu, je náboj všech elektronů ve válečku o délce rovné driftové rychlosti.“
'''
warning = '1 mm² = $10^{-6}$ m².'

# ---------- Zadání, příklad 2: rezistivita mědi a její jednotky

[[question]]
id = 'VO-02'
kind = 'numeric'
topic = 'Rezistivita'
source = 'Zadání, příklad 2'
tags = ['zadani']
text = '''
Měděný vodič o délce 15,0 m a průřezu 0,100 mm² má při 20,0 °C odpor 2,58 Ω. Jaká je rezistivita mědi?
'''
value = 1.72e-8
tolerance = 0.02e-8
unit = 'Ω·m'
explanation = '''
$$R = \rho\frac{l}{S} \quad\Rightarrow\quad \rho = \frac{R\cdot S}{l} = \frac{2{,}58\cdot0{,}1\cdot10^{-6}}{15} = 1{,}72\cdot10^{-8}\ \Omega\cdot\mathrm{m}$$
'''

[[question]]
id = 'VO-03'
kind = 'numeric'
topic = 'Rezistivita'
source = 'Zadání, příklad 2'
tags = ['zadani']
text = '''
Rezistivita mědi je $1{,}72\cdot10^{-8}\ \Omega\cdot\mathrm{m}$. Kolik je to v jednotkách Ω·mm²·m⁻¹?
'''
value = 0.0172
tolerance = 0.0002
unit = 'Ω·mm²·m⁻¹'
explanation = '''
$1\ \mathrm{m^2} = 10^{6}\ \mathrm{mm^2}$, proto $1\ \Omega\cdot\mathrm{m} = 1\ \Omega\cdot\mathrm{m^2}\cdot\mathrm{m^{-1}} = 10^{6}\ \Omega\cdot\mathrm{mm^2}\cdot\mathrm{m^{-1}}$:

$$1{,}72\cdot10^{-8}\ \Omega\cdot\mathrm{m}\cdot10^{6} = 1{,}72\cdot10^{-2}\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}} = 0{,}0172\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}}$$

V praxi: měděný drát 1 m dlouhý o průřezu 1 mm² má odpor 0,0172 Ω.
'''

[[question]]
id = 'VO-04'
kind = 'numeric'
topic = 'Rezistivita'
source = 'Zadání, příklad 2'
tags = ['zadani']
text = '''
Rezistivita mědi je $1{,}72\cdot10^{-8}\ \Omega\cdot\mathrm{m}$. Kolik je to v Ω·cm?
'''
value = 1.72e-6
tolerance = 0.02e-6
unit = 'Ω·cm'
explanation = '''
$1\ \mathrm{m} = 100\ \mathrm{cm}$, proto $1\ \Omega\cdot\mathrm{m} = 10^{2}\ \Omega\cdot\mathrm{cm}$:

$$1{,}72\cdot10^{-8}\ \Omega\cdot\mathrm{m}\cdot10^{2} = 1{,}72\cdot10^{-6}\ \Omega\cdot\mathrm{cm}$$

V sešitu je jen převod na Ω·mm²·m⁻¹; převod na Ω·cm je doplněný.
'''

[[question]]
id = 'VO-05'
topic = 'Rezistivita'
source = 'Zadání, příklad 2'
tags = ['zadani']
text = '''
Jaký je převodní vztah mezi jednotkami rezistivity Ω·m, Ω·mm²·m⁻¹ a Ω·cm?
'''
options = [
  '$1\ \Omega\cdot\mathrm{m} = 10^{-6}\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}} = 10^{-2}\ \Omega\cdot\mathrm{cm}$',
  '$1\ \Omega\cdot\mathrm{m} = 10^{3}\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}} = 10^{2}\ \Omega\cdot\mathrm{cm}$',
  '$1\ \Omega\cdot\mathrm{m} = 10^{6}\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}} = 10^{2}\ \Omega\cdot\mathrm{cm}$',
  '$1\ \Omega\cdot\mathrm{m} = 10^{6}\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}} = 10^{4}\ \Omega\cdot\mathrm{cm}$',
]
answer = 2
explanation = '''
$\Omega\cdot\mathrm{m} = \Omega\cdot\mathrm{m^2}/\mathrm{m}$ a $1\ \mathrm{m^2} = 10^{6}\ \mathrm{mm^2}$, proto $10^{6}$. U Ω·cm se převádí jen délka: $1\ \mathrm{m} = 10^{2}\ \mathrm{cm}$.

$$1\ \Omega\cdot\mathrm{m} = 10^{6}\ \Omega\cdot\mathrm{mm^2\cdot m^{-1}} = 10^{2}\ \Omega\cdot\mathrm{cm}$$
'''
notes = [
  'Obrácené exponenty: menší jednotka znamená větší číslo.',
  'Plocha se převádí s druhou mocninou: $(10^{3})^2 = 10^{6}$.',
  '',
  'V Ω·cm je jen jeden metr, převádí se tedy jen první mocnina délky: $10^{2}$.',
]

# ---------- Zadání, příklad 3: stříbro

[[question]]
id = 'VO-06'
kind = 'numeric'
topic = 'Pohyblivost a driftová rychlost'
source = 'Zadání, příklad 3'
tags = ['zadani']
text = '''
Rezistivita stříbra je při 20,0 °C $1{,}54\cdot10^{-8}\ \Omega\cdot\mathrm{m}$, intenzita elektrického pole ve stříbrném vodiči je 100 V·m⁻¹. Jaká je proudová hustota?
'''
value = 6.494e9
tolerance = 0.07e9
unit = 'A·m⁻²'
explanation = '''
Ohmův zákon v diferenciálním tvaru:

$$J = \gamma\cdot E = \frac{1}{\rho}\cdot E = \frac{1}{1{,}54\cdot10^{-8}}\cdot100 = 6{,}49\cdot10^{9}\ \mathrm{A\cdot m^{-2}}$$
'''

[[question]]
id = 'VO-07'
kind = 'numeric'
topic = 'Pohyblivost a driftová rychlost'
source = 'Zadání, příklad 3'
tags = ['zadani']
text = '''
Stříbro: rezistivita $1{,}54\cdot10^{-8}\ \Omega\cdot\mathrm{m}$, v 1,00 m³ je $5{,}80\cdot10^{28}$ volných elektronů. Jaká je pohyblivost volných elektronů?
'''
value = 6.99e-3
tolerance = 0.07e-3
unit = 'm²·V⁻¹·s⁻¹'
explanation = '''
V kovu vedou jen elektrony: $\gamma = n\cdot q\cdot\mu$, a $\gamma = 1/\rho$:

$$\frac{1}{\rho} = n\cdot q\cdot\mu \quad\Rightarrow\quad \mu = \frac{1}{n\cdot q\cdot\rho} = \frac{1}{5{,}8\cdot10^{28}\cdot1{,}602\cdot10^{-19}\cdot1{,}54\cdot10^{-8}} = 6{,}99\cdot10^{-3}\ \mathrm{m^2V^{-1}s^{-1}}$$

**Jak to říct:** „Konduktivita kovu je koncentrace krát náboj krát pohyblivost; vedou jen elektrony, díry v kovu nejsou.“
'''

[[question]]
id = 'VO-08'
kind = 'numeric'
topic = 'Pohyblivost a driftová rychlost'
source = 'Zadání, příklad 3'
tags = ['zadani']
text = '''
Stříbro: rezistivita $1{,}54\cdot10^{-8}\ \Omega\cdot\mathrm{m}$, $5{,}80\cdot10^{28}$ volných elektronů v 1,00 m³, intenzita pole ve vodiči 100 V·m⁻¹. Jaká je střední driftová rychlost elektronů?
'''
value = 0.699
tolerance = 0.007
unit = 'm·s⁻¹'
explanation = '''
Pohyblivost: $\mu = \dfrac{1}{n q \rho} = 6{,}99\cdot10^{-3}\ \mathrm{m^2V^{-1}s^{-1}}$. Pohyblivost je driftová rychlost na jednotku intenzity, $\mu = v_D/E$ (jednotka $\frac{\mathrm{m\cdot s^{-1}}}{\mathrm{V\cdot m^{-1}}} = \mathrm{m^2V^{-1}s^{-1}}$):

$$v_D = \mu\cdot E = 6{,}99\cdot10^{-3}\cdot100 = 0{,}699\ \mathrm{m\cdot s^{-1}}$$
'''

