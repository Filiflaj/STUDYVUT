Měď: hustota 8 890 kg·m⁻³, molární hmotnost 63,57 kg/kmol, rezistivita $1{,}724\cdot10^{-8}\ \Omega\cdot\mathrm{m}$; na každý atom připadá jeden volný elektron. Jaká je pohyblivost volných elektronů?
'''
value = 4.30e-3
tolerance = 0.05e-3
unit = 'm²·V⁻¹·s⁻¹'
