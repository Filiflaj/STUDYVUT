tags = ['zadani']
text = '''
Měděný vodič 1,50 km, průřez 5,00 mm², napětí 100 V. Měď: hustota 8 890 kg·m⁻³, molární hmotnost 63,57 kg/kmol, rezistivita $1{,}724\cdot10^{-8}\ \Omega\cdot\mathrm{m}$, jeden volný elektron na atom. Jaká je driftová rychlost volných elektronů?
'''
value = 2.87e-4
tolerance = 0.03e-4
unit = 'm·s⁻¹'
explanation = '''
Intenzita: $E = \dfrac{U}{l} = \dfrac{100}{1\,500} = 6{,}67\cdot10^{-2}\ \mathrm{V\cdot m^{-1}}$.

Pohyblivost: $n = \dfrac{8\,890\cdot6{,}022\cdot10^{26}}{63{,}57} = 8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$, $\mu = \dfrac{1}{n q \rho} = 4{,}3\cdot10^{-3}\ \mathrm{m^2V^{-1}s^{-1}}$.

$$v_D = \mu\cdot E = 4{,}3\cdot10^{-3}\cdot6{,}67\cdot10^{-2} = 2{,}87\cdot10^{-4}\ \mathrm{m\cdot s^{-1}}$$

Kontrola: $v_D = \dfrac{J}{n q} = \dfrac{3{,}87\cdot10^{6}}{8{,}42\cdot10^{28}\cdot1{,}602\cdot10^{-19}} = 2{,}87\cdot10^{-4}\ \mathrm{m\cdot s^{-1}}$.
'''
warning = 'V sešitu jsou u tohoto kroku špatné exponenty ($4{,}3\cdot10^{-8}\cdot6{,}69\cdot10^{-8} = 2{,}87\cdot10^{-9}$). Mantisa sedí, správný řád je $10^{-4}$ m/s.'

# ---------- Zadání, příklad 5: teplota cívky

[[question]]
id = 'VO-13'
kind = 'numeric'
topic = 'Teplotní závislost odporu'
source = 'Zadání, příklad 5'
tags = ['zadani']
text = '''
Cívka z měděného drátu má při 20,0 °C odpor 41,8 Ω, po delším provozu se zahřátím zvýšil na 49,2 Ω. Teplotní součinitel rezistivity mědi je $3{,}93\cdot10^{-3}\ \mathrm{K^{-1}}$, závislost odporu na teplotě je lineární, roztažnost se neuvažuje. Jaká je průměrná teplota cívky v provozu?
'''
value = 65
tolerance = 1
unit = '°C'
explanation = '''
$$R = R_0\,[1 + \alpha_\rho(\vartheta - \vartheta_0)] \quad\Rightarrow\quad \vartheta = \vartheta_0 + \frac{\frac{R}{R_0} - 1}{\alpha_\rho}$$

$$\vartheta = 20 + \frac{\frac{49{,}2}{41{,}8} - 1}{3{,}93\cdot10^{-3}} = 20 + \frac{0{,}1770}{3{,}93\cdot10^{-3}} = 20 + 45 = 65\ ^\circ\mathrm{C}$$

Odpor celé cívky odpovídá průměrné teplotě vinutí: teplejší závity přidají víc odporu, chladnější méně, a protože je závislost lineární, sečte se to na odpor při průměrné teplotě. Proto 65 °C už **je** průměrná teplota.

**Jak to říct:** „Z naměřeného odporu přes lineární závislost dostanu teplotu, při které by měl celý drát tento odpor, a to je průměrná teplota vinutí.“
'''
warning = 'V sešitu je navíc krok $\vartheta_P = (20 + 65)/2 = 42{,}5$ °C. Ten fyzikálně nesedí (průměr počáteční a provozní teploty není průměrná teplota v provozu); pokud ho cvičící výslovně nechtěl, vynech ho.'

# ---------- Zadání, příklad 6: dotykové napětí Cu–Ta

[[question]]
id = 'VO-14'
kind = 'numeric'
topic = 'Dotykové a termoelektrické napětí'
source = 'Zadání, příklad 6'
tags = ['zadani']
text = '''
Výstupní potenciál elektronů z mědi je 4,29 V, z tantalu 4,14 V. Koncentrace volných elektronů je v mědi $8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$, v tantalu $5{,}53\cdot10^{28}\ \mathrm{m^{-3}}$. Jak velké je dotykové napětí mezi oběma kovy při 20,0 °C (dokonalý vodivý styk)?
'''
value = 0.139
tolerance = 0.002
unit = 'V'
explanation = '''
Kov 1 = tantal, kov 2 = měď. Dotykové napětí (potenciál kovu 1 vůči kovu 2) má dvě části:

$$U_{12} = U_2 - U_1 + \frac{kT}{q}\ln\frac{n_1}{n_2}$$

- $U_2 - U_1$: elektrony přejdou z kovu s menším výstupním potenciálem (Ta) do kovu s větším (Cu), tantal se nabije kladně;
- $\frac{kT}{q}\ln\frac{n_1}{n_2}$: elektrony difundují z kovu s větší koncentrací (Cu) do kovu s menší (Ta), to nabíjí kladně měď, takže člen je tady záporný.

$\dfrac{kT}{q} = \dfrac{1{,}38\cdot10^{-23}\cdot293{,}15}{1{,}602\cdot10^{-19}} = 0{,}02525\ \mathrm{V}$:

$$U_{12} = 4{,}29 - 4{,}14 + 0{,}02525\cdot\ln\frac{5{,}53\cdot10^{28}}{8{,}42\cdot10^{28}} = 0{,}15 - 0{,}0106 = 0{,}139\ \mathrm{V}$$

Kladný je tantal.
'''
warning = 'V sešitu je ve členu s logaritmem $\ln\frac{n_2}{n_1}$ (2 = Cu), takže oba vlivy se sečtou a vyjde 0,161 V. Měď má ale větší výstupní potenciál (nabíjí se záporně) i větší koncentraci elektronů (difuzí se nabíjí kladně): vlivy jdou proti sobě a výsledek musí být menší než 0,15 V. Ověř si u cvičícího, kterou verzi chce.'

[[question]]
id = 'VO-15'
topic = 'Dotykové a termoelektrické napětí'
source = 'Zadání, příklad 6'
tags = ['zadani']
text = '''
Měď (výstupní potenciál 4,29 V, $n = 8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$) se dotkne tantalu (4,14 V, $n = 5{,}53\cdot10^{28}\ \mathrm{m^{-3}}$). Který kov se nabije kladně a proč?
'''
options = [
  'Měď, protože má větší výstupní potenciál a elektrony z ní odcházejí.',
  'Měď, protože má větší koncentraci elektronů a ta rozhoduje.',
  'Tantal, protože má menší výstupní potenciál; difuze elektronů z mědi tento rozdíl jen mírně zmenší.',
  'Žádný, kovy mají v kontaktu stejný potenciál, protože se vyrovnají Fermiho hladiny.',
]
answer = 2
explanation = '''
Elektrony přecházejí z kovu, ze kterého se uvolní snáze (menší výstupní potenciál, Ta), do kovu s větším výstupním potenciálem (Cu): Ta se nabije kladně, příspěvek $4{,}29 - 4{,}14 = 0{,}15$ V. Difuze z mědi (víc elektronů) do tantalu působí opačně, ale je to jen $0{,}02525\cdot\ln\frac{8{,}42}{5{,}53} = 0{,}011$ V. Výsledek 0,139 V, kladný tantal.
'''
notes = [
  'Větší výstupní potenciál znamená, že elektrony v kovu drží pevněji: do mědi přicházejí, ne z ní.',
  'Difuzní člen je jen asi 0,011 V, rozdíl výstupních potenciálů 0,15 V převáží.',
  '',
  'Fermiho hladiny se vyrovnají právě tím, že vznikne dotykové napětí mezi kovy.',
]

# ---------- Zadání, příklad 7: termoelektrické napětí Cu–Ta

[[question]]
id = 'VO-16'
kind = 'numeric'
topic = 'Dotykové a termoelektrické napětí'
source = 'Zadání, příklad 7'
tags = ['zadani']
text = '''
Termočlánek má větve z mědi ($n = 8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$, výstupní potenciál 4,29 V) a tantalu ($n = 5{,}53\cdot10^{28}\ \mathrm{m^{-3}}$, 4,14 V). Teplotní rozdíl spojů je 65,0 °C. Jak velké je teoretické termoelektrické napětí?
'''
value = 2.354e-3
tolerance = 0.03e-3
unit = 'V'
explanation = '''
V obvodu jsou dva spoje, teplý ($T_B$) a studený ($T_A$), s opačně orientovanými dotykovými napětími (1 = Ta, 2 = Cu):

$$U_{12}(T_B) = U_2 - U_1 + \frac{kT_B}{q}\ln\frac{n_1}{n_2} \qquad U_{21}(T_A) = U_1 - U_2 + \frac{kT_A}{q}\ln\frac{n_2}{n_1}$$

Při sečtení se výstupní potenciály odečtou a zůstane jen člen s rozdílem teplot:

$$U_t = U_{12}(T_B) + U_{21}(T_A) = \frac{k\,(T_B - T_A)}{q}\ln\frac{n_1}{n_2}$$

Velikost:

$$|U_t| = \frac{1{,}38\cdot10^{-23}\cdot65}{1{,}602\cdot10^{-19}}\cdot\ln\frac{8{,}42\cdot10^{28}}{5{,}53\cdot10^{28}} = 5{,}60\cdot10^{-3}\cdot0{,}420 = 2{,}35\cdot10^{-3}\ \mathrm{V}$$

Rozdíl teplot je v kelvinech stejný jako ve °C. V sešitu je logaritmus obráceně ($\ln\frac{n_2}{n_1}$, viz dotykové napětí), to mění jen znaménko, velikost 2,35 mV ne. V mezikroku je tam i překlep $T_A + T_B$, správně $T_B - T_A$; dosazeno je správně 65.

**Jak to říct:** „Výstupní potenciály jsou v obou spojích stejné a odečtou se; zůstane jen difuzní člen, který závisí na teplotě spoje.“
'''

