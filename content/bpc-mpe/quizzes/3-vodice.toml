$$U_t = \frac{k\,(T_B - T_A)}{q}\ln\frac{n_1}{n_2} = \frac{1{,}38\cdot10^{-23}\cdot100}{1{,}602\cdot10^{-19}}\cdot\ln\frac{18{,}1}{8{,}42} = 8{,}61\cdot10^{-3}\cdot0{,}765 = 6{,}59\cdot10^{-3}\ \mathrm{V}$$

Výstupní potenciály se odečtou, nejsou potřeba.
'''
