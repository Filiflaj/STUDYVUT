'''
value = 4.2
tolerance = 0.05
unit = 'W·kg⁻¹'
explanation = '''
Při stejné amplitudě indukce rostou hysterezní ztráty lineárně s kmitočtem, ztráty vířivými proudy s jeho druhou mocninou:

$$p_c = \frac{f}{f_1}\,p_{h1} + \left(\frac{f}{f_1}\right)^2 p_{v1} = \frac{150}{50}\cdot1{,}1 + \left(\frac{150}{50}\right)^2\cdot0{,}1 = 3{,}3 + 0{,}9 = 4{,}2\ \mathrm{W\cdot kg^{-1}}$$

**Jak to říct:** „Hysterezní ztráta je energie jedné smyčky krát počet smyček za sekundu, tedy ∼ f. Vířivé proudy jsou úměrné indukovanému napětí ∼ f a jejich výkon ∼ f².“
'''

