$\chi_{m2} = 2{,}5\cdot10^{-4}\cdot\dfrac{293{,}15}{423{,}15} = 1{,}732\cdot10^{-4}$, $M_2 = \chi_{m2}H = 34{,}6\ \mathrm{A\cdot m^{-1}}$:

$$J_{m2} = \mu_0 M_2 = 4\pi\cdot10^{-7}\cdot34{,}64 = 4{,}35\cdot10^{-5}\ \mathrm{T}$$
'''

