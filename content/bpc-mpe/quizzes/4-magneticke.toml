source = 'Obměna příkladu 4'
tags = ['obmena']
text = '''
**Obměna příkladu 4.** Celkové měrné ztráty oceli jsou při 60 Hz 1,50 W·kg⁻¹ a při 180 Hz 7,20 W·kg⁻¹; indukce je sinusová se stejnou amplitudou. Jaké jsou celkové měrné ztráty při **300 Hz**?
'''
value = 16.5
tolerance = 0.2
unit = 'W·kg⁻¹'
explanation = '''
Poměr kmitočtů $180/60 = 3$:

$$1{,}5 = p_{h1} + p_{v1} \qquad 7{,}2 = 3\,p_{h1} + 9\,p_{v1}$$

$p_{h1} = 1{,}5 - p_{v1}$ dosadím: $7{,}2 = 4{,}5 - 3p_{v1} + 9p_{v1}$, tedy $p_{v1} = 0{,}45$ a $p_{h1} = 1{,}05\ \mathrm{W\cdot kg^{-1}}$ (při 60 Hz).

$$p_{c3} = \frac{300}{60}\cdot1{,}05 + \left(\frac{300}{60}\right)^2\cdot0{,}45 = 5{,}25 + 11{,}25 = 16{,}5\ \mathrm{W\cdot kg^{-1}}$$
'''
warning = 'Poměry kmitočtů se berou vždy vůči $f_1$, při kterém jsou $p_{h1}$ a $p_{v1}$.'
