# ---------- Zadání, příklad 4: ze dvou měření ztráty při třetím kmitočtu

[[question]]
id = 'MG-18'
kind = 'numeric'
topic = 'Ztráty v magnetických materiálech'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
Celkové měrné ztráty oceli jsou při 100 Hz 2,00 W·kg⁻¹ a při 200 Hz 7,00 W·kg⁻¹; indukce je sinusová se stejnou amplitudou. Jaké jsou hysterezní ztráty při 100 Hz?
'''
value = 0.5
tolerance = 0.01
unit = 'W·kg⁻¹'
explanation = '''
Soustava dvou rovnic ($p_{h1}$, $p_{v1}$ jsou složky při $f_1 = 100$ Hz):

$$p_{c1} = p_{h1} + p_{v1} \qquad p_{c2} = \frac{f_2}{f_1}p_{h1} + \left(\frac{f_2}{f_1}\right)^2 p_{v1}$$

$$2 = p_{h1} + p_{v1} \qquad 7 = 2\,p_{h1} + 4\,p_{v1}$$

Z první $p_{v1} = 2 - p_{h1}$, dosadím: $7 = 2p_{h1} + 8 - 4p_{h1}$, tedy $p_{h1} = 0{,}5\ \mathrm{W\cdot kg^{-1}}$ a $p_{v1} = 1{,}5\ \mathrm{W\cdot kg^{-1}}$.

V sešitu je zapsáno $p_{v1} = -p_{h1} - 2$, správně $p_{v1} = 2 - p_{h1}$; výsledky 0,5 a 1,5 sedí.
'''

[[question]]
id = 'MG-19'
kind = 'numeric'
topic = 'Ztráty v magnetických materiálech'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
Celkové měrné ztráty oceli jsou při 100 Hz 2,00 W·kg⁻¹ a při 200 Hz 7,00 W·kg⁻¹; indukce je sinusová se stejnou amplitudou. Jaké jsou celkové měrné ztráty při **400 Hz**?
'''
value = 26
tolerance = 0.3
unit = 'W·kg⁻¹'
explanation = '''
Ze soustavy $2 = p_{h1} + p_{v1}$, $7 = 2p_{h1} + 4p_{v1}$ vyjde $p_{h1} = 0{,}5$ a $p_{v1} = 1{,}5\ \mathrm{W\cdot kg^{-1}}$ (při 100 Hz). Pak:

$$p_{c3} = \frac{f_3}{f_1}p_{h1} + \left(\frac{f_3}{f_1}\right)^2 p_{v1} = \frac{400}{100}\cdot0{,}5 + \left(\frac{400}{100}\right)^2\cdot1{,}5 = 2 + 24 = 26\ \mathrm{W\cdot kg^{-1}}$$

**Jak to říct:** „Z dvou měření rozdělím ztráty na hysterezní a vířivé, protože každá složka roste s kmitočtem jinak, a pak je přepočítám na 400 Hz.“
'''

