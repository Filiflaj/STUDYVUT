text = '''
**Obměna příkladu 3.** Plech má při 50 Hz měrné hysterezní ztráty 0,80 W·kg⁻¹ a ztráty vířivými proudy 0,20 W·kg⁻¹. Indukce je sinusová se stejnou amplitudou. Jaké jsou celkové měrné ztráty při **200 Hz**?
'''
value = 6.4
tolerance = 0.1
unit = 'W·kg⁻¹'
explanation = '''
$$p_c = \frac{200}{50}\cdot0{,}8 + \left(\frac{200}{50}\right)^2\cdot0{,}2 = 4\cdot0{,}8 + 16\cdot0{,}2 = 3{,}2 + 3{,}2 = 6{,}4\ \mathrm{W\cdot kg^{-1}}$$
'''

