# ---------- Zadání, příklad 1: B, susceptibilita, permeabilita

[[question]]
id = 'MG-01'
kind = 'numeric'
topic = 'Indukce, magnetizace, polarizace'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Magnetická polarizace prostředí je $3{,}00\cdot10^{-6}$ T, působí na něj vnější magnetické pole o intenzitě 10,0 A·m⁻¹. Jaká je magnetická indukce v prostředí?
'''
value = 1.557e-5
tolerance = 0.03e-5
unit = 'T'
explanation = '''
Indukce = příspěvek vakua + polarizace látky:

$$B = \mu_0 H + J_m = 4\pi\cdot10^{-7}\cdot10 + 3\cdot10^{-6} = 1{,}257\cdot10^{-5} + 0{,}300\cdot10^{-5} = 1{,}56\cdot10^{-5}\ \mathrm{T}$$

V sešitu je výsledek zkrácený na $1{,}5\cdot10^{-5}$ T; přesněji je to $1{,}56\cdot10^{-5}$ T.

**Jak to říct:** „Indukce v látce je indukce, kterou by pole vytvořilo ve vakuu, plus magnetická polarizace látky.“
'''

[[question]]
id = 'MG-02'
kind = 'numeric'
topic = 'Indukce, magnetizace, polarizace'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Magnetická polarizace prostředí je $3{,}00\cdot10^{-6}$ T při intenzitě vnějšího pole 10,0 A·m⁻¹. Jaká je magnetická susceptibilita prostředí?
'''
value = 0.2387
tolerance = 0.003
explanation = '''
$$J_m = \mu_0 M = \mu_0\chi_m H \quad\Rightarrow\quad \chi_m = \frac{J_m}{\mu_0 H} = \frac{3\cdot10^{-6}}{4\pi\cdot10^{-7}\cdot10} = 0{,}239$$

Stejně vyjde $\chi_m = \dfrac{B - \mu_0 H}{\mu_0 H} = \dfrac{B}{\mu_0 H} - 1$.

V sešitu je zapsáno $2{,}387\cdot10^{-7}$, to je překlep v exponentu: správně $2{,}387\cdot10^{-1} = 0{,}239$. Dál se v sešitu správně počítá s 0,24.
'''

[[question]]
id = 'MG-03'
kind = 'numeric'
topic = 'Indukce, magnetizace, polarizace'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Magnetická polarizace prostředí je $3{,}00\cdot10^{-6}$ T při intenzitě vnějšího pole 10,0 A·m⁻¹. Jaká je relativní permeabilita prostředí?
'''
value = 1.239
tolerance = 0.012
explanation = '''
$\chi_m = \dfrac{J_m}{\mu_0 H} = \dfrac{3\cdot10^{-6}}{4\pi\cdot10^{-7}\cdot10} = 0{,}239$:

$$\mu_r = 1 + \chi_m = 1 + 0{,}24 = 1{,}24$$

Kontrola přes indukci: $\mu_r = \dfrac{B}{\mu_0 H} = \dfrac{1{,}557\cdot10^{-5}}{1{,}257\cdot10^{-5}} = 1{,}24$.
'''

