Na elektrody deskového vakuového kondenzátoru (30,0 × 20,0 cm, vzdálenost 4,00 mm) je přiloženo napětí 1 000 V. Jaká je intenzita elektrického pole mezi elektrodami?
'''
value = 2.5e5
tolerance = 0.025e5
unit = 'V·m⁻¹'
explanation = '''
Pole mezi deskami je homogenní:

$$E_0 = \frac{U}{h} = \frac{1\,000}{4\cdot10^{-3}} = 250\ \mathrm{kV\cdot m^{-1}} = 2{,}5\cdot10^{5}\ \mathrm{V\cdot m^{-1}}$$

Rozměry desek k tomu nejsou potřeba.
'''

