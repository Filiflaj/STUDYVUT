tags = ['zadani']
text = '''
Na elektrody deskového vakuového kondenzátoru (30,0 × 20,0 cm, vzdálenost 4,00 mm) je přiloženo napětí 1 000 V. Jaká je elektrická indukce mezi elektrodami (a tedy i plošná hustota náboje na nich)?
'''
value = 2.214e-6
tolerance = 0.025e-6
unit = 'C·m⁻²'
explanation = '''
$E_0 = \dfrac{U}{h} = 2{,}5\cdot10^{5}\ \mathrm{V\cdot m^{-1}}$:

$$D_0 = \varepsilon_0 E_0 = 8{,}854\cdot10^{-12}\cdot2{,}5\cdot10^{5} = 2{,}214\cdot10^{-6}\ \mathrm{C\cdot m^{-2}}$$

Plošná hustota náboje na elektrodách je rovna indukci: $\sigma_0 = D_0 = 2{,}214\cdot10^{-6}\ \mathrm{C\cdot m^{-2}}$ (v sešitu značeno $\delta$).
'''

