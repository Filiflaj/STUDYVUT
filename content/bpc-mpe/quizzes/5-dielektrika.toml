tags = ['zadani']
text = '''
Deskový kondenzátor (vzdálenost elektrod 4,00 mm) je **připojen** ke zdroji 1 000 V. Mezi elektrody se vloží slídová destička ($\varepsilon_r = 5{,}40$), která vyplní celý prostor. Jaká je teď elektrická indukce mezi elektrodami?
'''
value = 1.195e-5
tolerance = 0.02e-5
unit = 'C·m⁻²'
explanation = '''
Zdroj drží napětí, proto se intenzita nezmění: $E = E_0 = \dfrac{U}{h} = 2{,}5\cdot10^{5}\ \mathrm{V\cdot m^{-1}}$.

$$D = \varepsilon_0\varepsilon_r E = \varepsilon_r D_0 = 8{,}854\cdot10^{-12}\cdot5{,}4\cdot2{,}5\cdot10^{5} = 1{,}195\cdot10^{-5} \doteq 1{,}2\cdot10^{-5}\ \mathrm{C\cdot m^{-2}}$$

Stejně vzroste plošná hustota náboje: $\sigma = D = 1{,}2\cdot10^{-5}\ \mathrm{C\cdot m^{-2}}$; zdroj na desky dodá další náboj.
'''

