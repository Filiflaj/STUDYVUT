# ---------- Zadání, příklad 4: elektrolytický kondenzátor

[[question]]
id = 'DI-10'
kind = 'numeric'
topic = 'Polarizace dielektrika'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
Elektrolytický kondenzátor z oxidované hliníkové destičky s aktivní plochou 400 cm² má kapacitu 8,00 µF. Napětí mezi destičkou a elektrolytem je 10,0 V, relativní permitivita oxidu $\mathrm{Al_2O_3}$ je 8,00. Jaká je intenzita elektrického pole v oxidové vrstvě?
'''
value = 2.824e7
tolerance = 0.03e7
unit = 'V·m⁻¹'
explanation = '''
Tloušťku vrstvy neznám, ale vyjde z kapacity: $C = \varepsilon_0\varepsilon_r\frac{S}{h}$, tedy $h = \frac{\varepsilon_0\varepsilon_r S}{C}$. Proto:

$$E = \frac{U}{h} = \frac{D}{\varepsilon_0\varepsilon_r} = \frac{Q}{\varepsilon_0\varepsilon_r S} = \frac{C\cdot U}{\varepsilon_0\varepsilon_r S} = \frac{8\cdot10^{-6}\cdot10}{8{,}854\cdot10^{-12}\cdot8\cdot400\cdot10^{-4}} = 2{,}82\cdot10^{7}\ \mathrm{V\cdot m^{-1}}$$

(Tloušťka oxidu $h = 3{,}5\cdot10^{-7}$ m, proto je pole tak silné.)
'''
warning = '400 cm² = $400\cdot10^{-4}$ m², 8,00 µF = $8\cdot10^{-6}$ F.'

[[question]]
id = 'DI-11'
kind = 'numeric'
topic = 'Polarizace dielektrika'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
Elektrolytický kondenzátor: aktivní plocha 400 cm², kapacita 8,00 µF, napětí 10,0 V, relativní permitivita oxidu $\mathrm{Al_2O_3}$ 8,00. Jaký celkový dipólový moment je indukovaný v oxidové vrstvě?
'''
value = 2.479e-11
tolerance = 0.03e-11
unit = 'C·m'
explanation = '''
Polarizace (dipólový moment jednotky objemu) je rozdíl indukce v dielektriku a ve vakuu:

$$P = D - D_0 = \varepsilon_0\varepsilon_r E - \varepsilon_0 E = \varepsilon_0(\varepsilon_r - 1)E$$

Celkový moment = polarizace × objem vrstvy, $V = S\cdot h$, a $E\cdot h = U$:

$$\mu_\text{cel} = P\cdot V = \varepsilon_0(\varepsilon_r - 1)E\cdot S h = \varepsilon_0(\varepsilon_r - 1)\,U\cdot S$$

$$\mu_\text{cel} = 8{,}854\cdot10^{-12}\cdot(8 - 1)\cdot10\cdot400\cdot10^{-4} = 2{,}48\cdot10^{-11}\ \mathrm{C\cdot m}$$

Kapacita ani tloušťka k tomu nejsou potřeba.

**Jak to říct:** „Polarizace je dipólový moment objemové jednotky; vynásobím ji objemem vrstvy a součin E·h je napětí.“
'''

