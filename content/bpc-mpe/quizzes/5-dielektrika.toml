# ---------- Zadání, příklad 1: drážková izolace

[[question]]
id = 'DI-01'
kind = 'numeric'
topic = 'Kapacita'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Mezi dvě kovové desky 15,0 × 18,0 cm jsou vloženy dvě vrstvy drážkové izolace. Jedna vrstva se skládá z elektrotechnické lepenky tloušťky 0,300 mm ($\varepsilon_r = 2{,}60$) a z PET fólie tloušťky 40,0 µm ($\varepsilon_r = 3{,}80$). Jaká je kapacita? Okrajová pole neuvažujte.
'''
value = 9.49e-10
tolerance = 0.1e-10
unit = 'F'
explanation = '''
Plocha desek: $S = a\cdot b = 0{,}15\cdot0{,}18 = 2{,}7\cdot10^{-2}\ \mathrm{m^2}$.

Každá vrstva je deskový kondenzátor $C = \varepsilon_0\varepsilon_r\frac{S}{h}$:

$$C_1 = 8{,}854\cdot10^{-12}\cdot2{,}6\cdot\frac{2{,}7\cdot10^{-2}}{0{,}3\cdot10^{-3}} = 2{,}07\cdot10^{-9}\ \mathrm{F} \qquad C_2 = 8{,}854\cdot10^{-12}\cdot3{,}8\cdot\frac{2{,}7\cdot10^{-2}}{40\cdot10^{-6}} = 2{,}271\cdot10^{-8}\ \mathrm{F}$$

Dvě vrstvy izolace = 2× lepenka a 2× fólie, všechny nad sebou, tedy v sérii:

$$\frac1C = \frac1{C_1} + \frac1{C_2} + \frac1{C_1} + \frac1{C_2} = \frac2{C_1} + \frac2{C_2} \quad\Rightarrow\quad C = \frac{C_1 C_2}{2(C_1 + C_2)}$$

$$C = \frac{2{,}07\cdot10^{-9}\cdot2{,}271\cdot10^{-8}}{2\,(2{,}07\cdot10^{-9} + 2{,}271\cdot10^{-8})} = 9{,}49\cdot10^{-10}\ \mathrm{F}$$

V sešitu vyšlo $9{,}485\cdot10^{-10}$ F (se zaokrouhleným $C_1$); bez zaokrouhlení $9{,}493\cdot10^{-10}$ F.

**Jak to říct:** „Vrstvy dielektrika leží nad sebou mezi stejnými deskami, prochází jimi stejný tok indukce: chovají se jako kondenzátory v sérii.“
'''
warning = '40,0 µm = $40\cdot10^{-6}$ m, 0,300 mm = $0{,}3\cdot10^{-3}$ m.'

[[question]]
id = 'DI-02'
topic = 'Kapacita'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Mezi deskami jsou dvě stejné vrstvy izolace, každá z lepenky (kapacita samotné vrstvy lepenky $C_1$) a fólie ($C_2$). Jaká je výsledná kapacita?
'''
options = [
  '$C = 2\,(C_1 + C_2)$',
  '$C = \dfrac{C_1 C_2}{C_1 + C_2}$',
  '$C = \dfrac{C_1 C_2}{2\,(C_1 + C_2)}$',
  '$C = \dfrac{2\,C_1 C_2}{C_1 + C_2}$',
]
answer = 2
layout = 'grid'
explanation = '''
Čtyři vrstvy (lepenka, fólie, lepenka, fólie) leží nad sebou, jsou v sérii:

$$\frac1C = \frac2{C_1} + \frac2{C_2} = \frac{2\,(C_1 + C_2)}{C_1 C_2} \quad\Rightarrow\quad C = \frac{C_1 C_2}{2\,(C_1 + C_2)}$$
'''
notes = [
  'To by platilo pro vrstvy vedle sebe (paralelně). Vrstvy nad sebou jsou v sérii.',
  'To je jen jedna vrstva izolace (lepenka + fólie). Vrstvy izolace jsou dvě.',
  '',
  'Dvě stejné série za sebou kapacitu zmenší na polovinu, ne zdvojnásobí.',
]

# ---------- Zadání, příklad 2: koaxiální kabel

[[question]]
id = 'DI-03'
kind = 'numeric'
topic = 'Kapacita'
source = 'Zadání, příklad 2'
tags = ['zadani']
text = '''
Souosý kabel má izolaci z PTFE ($\varepsilon_r = 2{,}1$) tloušťky 1,5 mm, průřez vnitřního vodiče je 0,80 mm², délka kabelu 1,2 m. Jaká je jeho kapacita?
'''
value = 1.017e-10
tolerance = 0.015e-10
unit = 'F'
explanation = '''
Poloměr vnitřního vodiče z průřezu $S_v = \pi r_1^2$:

$$r_1 = \sqrt{\frac{S_v}{\pi}} = \sqrt{\frac{0{,}8\cdot10^{-6}}{\pi}} = 5{,}05\cdot10^{-4}\ \mathrm{m}$$

Indukce ve vzdálenosti $r$ od osy (plášť válce $2\pi r l$) a z ní intenzita:

$$D = \frac{Q}{2\pi r l} = \varepsilon_0\varepsilon_r E \quad\Rightarrow\quad E = \frac{Q}{2\pi\varepsilon_0\varepsilon_r r l}$$

Napětí mezi vodiči je integrál intenzity přes izolaci:

$$U = \int_{r_1}^{r_1 + h} E\,\mathrm{d}r = \frac{Q}{2\pi\varepsilon_0\varepsilon_r l}\ln\frac{r_1 + h}{r_1} \quad\Rightarrow\quad C = \frac{Q}{U} = \frac{2\pi\varepsilon_0\varepsilon_r l}{\ln\frac{r_1 + h}{r_1}}$$

$$C = \frac{2\pi\cdot8{,}854\cdot10^{-12}\cdot2{,}1\cdot1{,}2}{\ln\frac{5{,}05\cdot10^{-4} + 1{,}5\cdot10^{-3}}{5{,}05\cdot10^{-4}}} = \frac{1{,}402\cdot10^{-10}}{1{,}379} = 1{,}017\cdot10^{-10}\ \mathrm{F}$$

**Jak to říct:** „Pole v kabelu není homogenní, slábne s 1/r; proto napětí počítám integrálem a v kapacitě je logaritmus poměru poloměrů.“
'''
warning = 'Tloušťka izolace se k poloměru přičítá: vnější poloměr je $r_1 + h$, ne $h$.'

# ---------- Zadání, příklad 3: deskový kondenzátor a slída

