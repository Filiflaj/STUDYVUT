text = '''
**Obměna příkladu 4.** K vytvoření vakance v mědi je třeba energie 1,28 eV. Měď: mřížka plošně centrovaná, hustota 8 890 kg·m⁻³, molární hmotnost 63,57 kg/kmol. Kolik vakancí je v 1,00 m³ mědi při 1 000 °C?
'''
value = 7.19e23
tolerance = 0.14e23
unit = 'm⁻³'
explanation = '''
$T = 1\,000 + 273{,}15 = 1\,273{,}15\ \mathrm{K}$, $W_v = 1{,}28\cdot1{,}602\cdot10^{-19} = 2{,}051\cdot10^{-19}\ \mathrm{J}$.

$$N = \frac{\rho V N_A}{M} = \frac{8\,890\cdot1\cdot6{,}022\cdot10^{26}}{63{,}57} = 8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$$

$$n_v = N\cdot e^{-\frac{W_v}{kT}} = 8{,}42\cdot10^{28}\cdot e^{-\frac{2{,}051\cdot10^{-19}}{1{,}38\cdot10^{-23}\cdot1\,273{,}15}} = 8{,}42\cdot10^{28}\cdot e^{-11{,}67} \doteq 7{,}19\cdot10^{23}\ \mathrm{m^{-3}}$$
'''

