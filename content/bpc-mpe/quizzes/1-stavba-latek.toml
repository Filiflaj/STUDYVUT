tags = ['zadani']
text = '''
Kolik atomů v průměru připadá na jednu elementární buňku krystalové struktury **diamantu**?
'''
value = 8
tolerance = 0
unit = 'atomů'
explanation = '''
Struktura diamantu je plošně centrovaná mřížka, ve které jsou navíc 4 atomy uvnitř buňky:

$$N = 8\cdot\tfrac18 + 6\cdot\tfrac12 + 4 = 1 + 3 + 4 = 8$$

V sešitu samostatně není; stejný počet se používá v příkladu 1 polovodičů (Si, Ge).
'''

[[question]]
id = 'ST-08'
kind = 'numeric'
topic = 'Krystalové mřížky'
source = 'Zadání, příklad 2'
tags = ['zadani']
text = '''
Atomy struktury diamantu jsou stejné pevné koule o poloměru $r$, které se navzájem dotýkají. Jaké je zaplnění objemu elementární buňky?
'''
value = 34.01
tolerance = 0.5
unit = '%'
explanation = '''
Vnitřní atom se dotýká nejbližšího rohového atomu; jejich středy jsou od sebe čtvrtinu tělesové úhlopříčky:

$$\frac{a\sqrt3}{4} = 2r \quad\Rightarrow\quad a = \frac{8r}{\sqrt3} \qquad a^3 = \frac{512\,r^3}{3\sqrt3}$$

Na buňku připadá $N = 8$ atomů:

$$D = \frac{8\cdot\frac43\pi r^3}{a^3} = \frac{32}{3}\pi r^3\cdot\frac{3\sqrt3}{512\,r^3} = \frac{\pi\sqrt3}{16} \doteq 0{,}34 = 34\,\%$$

V sešitu tento příklad není; postup je stejný jako u příkladu 1, jen s jinou podmínkou dotyku.
'''

# ---------- Zadání, příklad 3: měď (v sešitu „Příklad 2“)

[[question]]
id = 'ST-09'
kind = 'numeric'
topic = 'Elementární buňka z hustoty'
source = 'Zadání, příklad 3'
tags = ['zadani']
text = '''
Měď krystalizuje v krychlové soustavě, v mřížce plošně centrované. Při 20 °C má hustotu 8 890 kg·m⁻³, její molární hmotnost je 63,57 kg/kmol. Jaký je objem elementární buňky?
'''
value = 4.749e-29
tolerance = 0.05e-29
unit = 'm³'
explanation = '''
Hmotnost připadající na jeden atom je stejná, ať ji počítám z buňky, nebo z molu: $\dfrac{m}{N} = \dfrac{M}{N_A}$, kde $m = \rho V$ je hmotnost buňky s $N = 4$ atomy:

$$\frac{\rho\cdot V}{N} = \frac{M}{N_A} \quad\Rightarrow\quad V = \frac{N\cdot M}{\rho\cdot N_A}$$

$$V = \frac{4\cdot 63{,}57}{8\,890\cdot 6{,}022\cdot10^{26}} = 4{,}749\cdot10^{-29}\ \mathrm{m^3}$$

Molární hmotnost je v kg/kmol, proto $N_A = 6{,}022\cdot10^{23}\ \mathrm{mol^{-1}} = 6{,}022\cdot10^{26}\ \mathrm{kmol^{-1}}$.

**Jak to říct:** „Hmotnost buňky dělená počtem jejích atomů je hmotnost jednoho atomu, tedy M/N_A. Z toho vyjádřím objem buňky.“
'''

[[question]]
id = 'ST-10'
kind = 'numeric'
topic = 'Elementární buňka z hustoty'
source = 'Zadání, příklad 3'
tags = ['zadani']
text = '''
Měď (mřížka plošně centrovaná, hustota 8 890 kg·m⁻³, molární hmotnost 63,57 kg/kmol): atomy jsou koule, které se v elementární buňce dotýkají. Jaký je poloměr atomu mědi?
'''
value = 1.28e-10
tolerance = 0.02e-10
unit = 'm'
explanation = '''
Objem buňky (předchozí krok): $V = \dfrac{4\cdot63{,}57}{8\,890\cdot6{,}022\cdot10^{26}} = 4{,}749\cdot10^{-29}\ \mathrm{m^3}$.

V plošně centrované mřížce $a\sqrt2 = 4r$ a $a = \sqrt[3]{V}$:

$$r = \frac{\sqrt2}{4}\cdot\sqrt[3]{V} = \frac{\sqrt2}{4}\cdot\sqrt[3]{4{,}749\cdot10^{-29}} = \frac{\sqrt2}{4}\cdot 3{,}621\cdot10^{-10} = 1{,}28\cdot10^{-10}\ \mathrm{m}$$
'''

[[question]]
id = 'ST-11'
kind = 'numeric'
topic = 'Elementární buňka z hustoty'
source = 'Zadání, příklad 3'
tags = ['zadani']
text = '''
Jaká je hmotnost jednoho atomu mědi (molární hmotnost 63,57 kg/kmol)?
'''
value = 1.056e-25
tolerance = 0.01e-25
unit = 'kg'
explanation = '''
$$m_a = \frac{M}{N_A} = \frac{63{,}57}{6{,}022\cdot10^{26}} = 1{,}056\cdot10^{-25}\ \mathrm{kg}$$

$N_A$ v $\mathrm{kmol^{-1}}$, protože $M$ je v kg/kmol.
'''

# ---------- Zadání, příklad 4: vakance v hliníku (v sešitu „Příklad 3“)

[[question]]
id = 'ST-12'
kind = 'numeric'
topic = 'Bodové poruchy'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
Hliník má hustotu 2 699 kg·m⁻³ a molární hmotnost 26,98 kg/kmol. Kolik atomů je v 1,00 m³ hliníku (koncentrace atomů $N$)?
'''
value = 6.024e28
tolerance = 0.06e28
unit = 'm⁻³'
explanation = '''
Stejná úvaha jako u mědi, $\dfrac{m}{N} = \dfrac{M}{N_A}$, jen teď hledám počet atomů v objemu $V = 1\ \mathrm{m^3}$:

$$N = \frac{\rho\cdot V\cdot N_A}{M} = \frac{2\,699\cdot1\cdot6{,}022\cdot10^{26}}{26{,}98} = 6{,}024\cdot10^{28}\ \mathrm{m^{-3}}$$

To je počet uzlových bodů mřížky v 1 m³, potřebný pro vakance i mezimřížkové poruchy.
'''

[[question]]
id = 'ST-13'
kind = 'numeric'
topic = 'Bodové poruchy'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
K vytvoření vakance v hliníku je třeba energie 0,75 eV. Hliník: mřížka plošně centrovaná, hustota 2 699 kg·m⁻³, molární hmotnost 26,98 kg/kmol. Kolik vakancí je v 1,00 m³ hliníku při 25,0 °C v termodynamické rovnováze?
'''
value = 1.3e16
tolerance = 0.06e16
unit = 'm⁻³'
explanation = '''
Převody: $T = 25{,}0 + 273{,}15 = 298{,}15\ \mathrm{K}$, $W_v = 0{,}75\cdot1{,}602\cdot10^{-19} \doteq 1{,}2\cdot10^{-19}\ \mathrm{J}$.

Koncentrace atomů: $N = \dfrac{\rho V N_A}{M} = \dfrac{2\,699\cdot1\cdot6{,}022\cdot10^{26}}{26{,}98} = 6{,}024\cdot10^{28}\ \mathrm{m^{-3}}$.

$$n_v = N\cdot e^{-\frac{W_v}{kT}} = 6{,}024\cdot10^{28}\cdot e^{-\frac{1{,}2\cdot10^{-19}}{1{,}38\cdot10^{-23}\cdot298{,}15}} = 6{,}024\cdot10^{28}\cdot e^{-29{,}17} \doteq 1{,}3\cdot10^{16}\ \mathrm{m^{-3}}$$

Sešit zaokrouhluje $W_v$ na $1{,}2\cdot10^{-19}$ J. S nezaokrouhleným $1{,}2015\cdot10^{-19}$ J vyjde exponent $-29{,}20$ a $n_v = 1{,}25\cdot10^{16}\ \mathrm{m^{-3}}$; uznává se obojí. V exponentu se vyplatí nezaokrouhlovat.
'''
warning = 'Teplotu do exponentu vždy v kelvinech a energii v joulech.'

[[question]]
id = 'ST-14'
kind = 'numeric'
topic = 'Bodové poruchy'
source = 'Zadání, příklad 4'
tags = ['zadani']
text = '''
K vytvoření vakance v hliníku je třeba energie 0,75 eV. Hliník: mřížka plošně centrovaná, hustota 2 699 kg·m⁻³, molární hmotnost 26,98 kg/kmol. Kolik vakancí je v 1,00 m³ hliníku při **550 °C**?
'''
value = 1.55e24
tolerance = 0.03e24
unit = 'm⁻³'
explanation = '''
$T = 550 + 273{,}15 = 823{,}15\ \mathrm{K}$, $W_v \doteq 1{,}2\cdot10^{-19}\ \mathrm{J}$, $N = 6{,}024\cdot10^{28}\ \mathrm{m^{-3}}$.

$$n_v = 6{,}024\cdot10^{28}\cdot e^{-\frac{1{,}2\cdot10^{-19}}{1{,}38\cdot10^{-23}\cdot823{,}15}} = 6{,}024\cdot10^{28}\cdot e^{-10{,}56} \doteq 1{,}55\cdot10^{24}\ \mathrm{m^{-3}}$$

Proti 25 °C je vakancí asi $10^{8}$krát víc. (S nezaokrouhleným $W_v$ vyjde $1{,}54\cdot10^{24}$.)

**Jak to říct:** „Koncentrace vakancí roste s teplotou exponenciálně, proto je při 550 °C o osm řádů vyšší.“
'''

# ---------- Zadání, příklad 5: mezimřížkové poruchy v hliníku (v sešitu „Příklad 4“)

[[question]]
id = 'ST-15'
kind = 'numeric'
topic = 'Bodové poruchy'
source = 'Zadání, příklad 5'
tags = ['zadani']
text = '''
K přesunu atomu hliníku z uzlového bodu do mezimřížkové polohy je třeba energie 3 eV, konstanta $c' = 3$. Hliník: hustota 2 699 kg·m⁻³, molární hmotnost 26,98 kg/kmol. Kolik atomů v mezimřížkových polohách je v 1 m³ hliníku při **20,0 °C**?
'''
value = 4.6e-23
tolerance = 0.1e-23
unit = 'm⁻³'
explanation = '''
$T = 20{,}0 + 273{,}15 = 293{,}15\ \mathrm{K}$, $W_m = 3\cdot1{,}602\cdot10^{-19} = 4{,}806\cdot10^{-19}\ \mathrm{J}$, $N = 6{,}024\cdot10^{28}\ \mathrm{m^{-3}}$ (jako u vakancí).

$$n_m = c'\cdot N\cdot e^{-\frac{W_m}{kT}} = 3\cdot6{,}024\cdot10^{28}\cdot e^{-\frac{4{,}806\cdot10^{-19}}{1{,}38\cdot10^{-23}\cdot293{,}15}} = 1{,}807\cdot10^{29}\cdot e^{-118{,}80} \doteq 4{,}6\cdot10^{-23}\ \mathrm{m^{-3}}$$

Prakticky žádné mezimřížkové poruchy.

V sešitu je zapsáno $W_m = 4{,}81\cdot10^{-19}$ J, ale výsledek $4{,}6\cdot10^{-23}$ odpovídá nezaokrouhlenému $4{,}806\cdot10^{-19}$ J. S $4{,}81$ by vyšlo $4{,}2\cdot10^{-23}$: v exponentu kolem 119 už změní výsledek i třetí platná číslice.
'''
warning = 'Energii v exponentu nezaokrouhluj: $W_m = 4{,}806\cdot10^{-19}$ J.'

