text = '''
**Obměna příkladu 5.** K přesunu atomu mědi z uzlového bodu do mezimřížkové polohy je třeba energie 2,5 eV, konstanta $c' = 2$. Měď: hustota 8 890 kg·m⁻³, molární hmotnost 63,57 kg/kmol. Kolik atomů v mezimřížkových polohách je v 1 m³ mědi při 800 °C?
'''
value = 3.03e17
tolerance = 0.06e17
unit = 'm⁻³'
explanation = '''
$T = 800 + 273{,}15 = 1\,073{,}15\ \mathrm{K}$, $W_m = 2{,}5\cdot1{,}602\cdot10^{-19} = 4{,}005\cdot10^{-19}\ \mathrm{J}$, $N = 8{,}42\cdot10^{28}\ \mathrm{m^{-3}}$.

$$n_m = c'\cdot N\cdot e^{-\frac{W_m}{kT}} = 2\cdot8{,}42\cdot10^{28}\cdot e^{-\frac{4{,}005\cdot10^{-19}}{1{,}38\cdot10^{-23}\cdot1\,073{,}15}} = 1{,}684\cdot10^{29}\cdot e^{-27{,}04} \doteq 3{,}03\cdot10^{17}\ \mathrm{m^{-3}}$$
'''
