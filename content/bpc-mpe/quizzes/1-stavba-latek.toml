# ---------- Zadání, příklad 1: prostá, prostorově a plošně centrovaná mřížka

[[question]]
id = 'ST-01'
topic = 'Krystalové mřížky'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Kolik atomů v průměru připadá na jednu elementární buňku krychlové mřížky **prosté**, **prostorově centrované** a **plošně centrované** (v tomto pořadí)?
'''
options = ['8 / 9 / 14', '1 / 2 / 7', '1 / 2 / 4', '1 / 4 / 2']
answer = 2
layout = 'grid'
explanation = '''
Atom v rohu krychle sdílí 8 sousedních buněk, atom ve stěně 2 buňky, atom uprostřed buňky patří jen jí.

$$\text{prostá: } N = 8\cdot\tfrac18 = 1 \qquad \text{prostorově c.: } N = 8\cdot\tfrac18 + 1 = 2 \qquad \text{plošně c.: } N = 8\cdot\tfrac18 + 6\cdot\tfrac12 = 4$$

**Jak to říct:** „Rohový atom patří osmi buňkám, stěnový dvěma, středový jen jedné; sečtu podíly.“
'''
notes = [
  'To jsou všechny nakreslené atomy. Rohový atom ale patří osmi buňkám a stěnový dvěma, počítá se jen jejich podíl.',
  'Atomy ve stěnách jsou sdílené dvěma buňkami: $6\cdot\frac12 = 3$, ne 6.',
  '',
  'Prostorově a plošně centrovaná jsou prohozené: středový atom je jen jeden, stěnových šest.',
]

[[question]]
id = 'ST-02'
kind = 'numeric'
topic = 'Krystalové mřížky'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Mřížka je složená ze stejných atomů, pevných koulí o poloměru $r$, které se navzájem dotýkají. Jaké je zaplnění objemu elementární buňky (podíl objemu buňky vyplněný atomy) u **prosté** krychlové mřížky?
'''
value = 52.36
tolerance = 0.5
unit = '%'
explanation = '''
V prosté mřížce se atomy dotýkají podél hrany: $a = 2r$. Na buňku připadá $N = 1$ atom.

$$D = \frac{N\cdot V_a}{V_M} = \frac{1\cdot\frac43\pi r^3}{a^3} = \frac{\frac43\pi r^3}{8r^3} = \frac{\pi}{6} \doteq 0{,}523 = 52\,\%$$
'''

[[question]]
id = 'ST-03'
kind = 'numeric'
topic = 'Krystalové mřížky'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Mřížka je složená ze stejných atomů, pevných koulí o poloměru $r$, které se navzájem dotýkají. Jaké je zaplnění objemu elementární buňky u **prostorově centrované** krychlové mřížky?
'''
value = 68.02
tolerance = 0.7
unit = '%'
explanation = '''
Atomy se dotýkají podél tělesové úhlopříčky (roh – střed – roh): $a\sqrt3 = 4r$, tedy $a = \dfrac{4r}{\sqrt3}$. Na buňku připadají $N = 2$ atomy.

$$D = \frac{2\cdot\frac43\pi r^3}{a^3} = \frac{\frac83\pi r^3}{\frac{4^3 r^3}{(\sqrt3)^3}} = \frac{8\pi}{3}\cdot\frac{(\sqrt3)^3}{4^3} = \frac{\pi\sqrt3}{8} \doteq 0{,}68 = 68\,\%$$
'''

[[question]]
id = 'ST-04'
kind = 'numeric'
topic = 'Krystalové mřížky'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Mřížka je složená ze stejných atomů, pevných koulí o poloměru $r$, které se navzájem dotýkají. Jaké je zaplnění objemu elementární buňky u **plošně centrované** krychlové mřížky?
'''
value = 74.05
tolerance = 0.7
unit = '%'
explanation = '''
Atomy se dotýkají podél stěnové úhlopříčky (roh – střed stěny – roh): $a\sqrt2 = 4r$, tedy $a = \dfrac{4r}{\sqrt2}$ a $a^3 = \dfrac{64r^3}{2\sqrt2}$. Na buňku připadají $N = 4$ atomy.

$$D = \frac{4\cdot\frac43\pi r^3}{a^3} = \frac{\frac{16}{3}\pi r^3}{\frac{64r^3}{2\sqrt2}} = \frac{\pi\sqrt2}{6} \doteq 0{,}74 = 74\,\%$$

V sešitu je v mezikroku čitatel $\frac83\pi r^3$; správně je $4\cdot\frac43 = \frac{16}{3}$. Výsledek 0,74 sedí.
'''

[[question]]
id = 'ST-05'
topic = 'Krystalové mřížky'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Která krychlová mřížka (při těsném uložení stejných atomů, které se dotýkají) zaplňuje objem elementární buňky nejlépe, a čím se to dokáže?
'''
options = [
  'prostorově centrovaná: atom uprostřed buňky vyplní prázdné místo, zaplnění vyjde 0,74',
  'prostá: atomy se dotýkají přímo podél hrany, mezi nimi nezůstane mezera, zaplnění vyjde 0,74',
  'struktura diamantu: má nejvíc atomů v buňce (8), proto je zaplnění největší',
  'plošně centrovaná: atomy se dotýkají podél stěnové úhlopříčky ($a\sqrt2 = 4r$), zaplnění vyjde 0,74',
]
answer = 3
explanation = '''
Důkaz je výpočet zaplnění $D = N\cdot V_a / a^3$ pro všechny tři mřížky a jejich porovnání:

$$D_\text{prostá} = \frac{\pi}{6} \doteq 0{,}52 \qquad D_\text{prostorově} = \frac{\pi\sqrt3}{8} \doteq 0{,}68 \qquad D_\text{plošně} = \frac{\pi\sqrt2}{6} \doteq 0{,}74$$

Největší je u plošně centrované mřížky.

**Jak to říct:** „Spočítám zaplnění pro každou mřížku z podmínky dotyku: prostá 52 %, prostorově centrovaná 68 %, plošně centrovaná 74 %. Plošně centrovaná je nejtěsnější uložení.“
'''
notes = [
  'Prostorově centrovaná mřížka má zaplnění jen 0,68: atomy se dotýkají podél tělesové úhlopříčky a hrana je delší.',
  'Prostá mřížka má jen 0,52, mezi osmi rohovými atomy zůstává uprostřed buňky velká mezera.',
  'Diamant má sice 8 atomů v buňce, ale atomy jsou malé vůči hraně ($a\sqrt3/4 = 2r$): zaplnění jen 0,34.',
  '',
]

[[question]]
id = 'ST-06'
topic = 'Krystalové mřížky'
source = 'Zadání, příklad 1'
tags = ['zadani']
text = '''
Atomy (koule o poloměru $r$) se v mřížce dotýkají. Který vztah mezi hranou elementární buňky $a$ a poloměrem $r$ platí pro **prostorově centrovanou** krychlovou mřížku?
'''
options = ['$a\sqrt2 = 4r$', '$a\sqrt3 = 4r$', '$a = 2r$', '$\dfrac{a\sqrt3}{4} = 2r$']
answer = 1
