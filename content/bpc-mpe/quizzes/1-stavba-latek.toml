explanation = '''
V prostorově centrované buňce se dotýkají rohový atom, středový atom a protější rohový atom, tedy podél **tělesové** úhlopříčky délky $a\sqrt3$. Na ní leží $r + 2r + r = 4r$:

$$a\sqrt3 = 4r \quad\Rightarrow\quad a = \frac{4r}{\sqrt3}$$
'''
notes = [
  'To platí pro plošně centrovanou mřížku (dotyk podél stěnové úhlopříčky).',
  '',
