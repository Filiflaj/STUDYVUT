explanation = '''
Prostorově centrovaná mřížka: $N = 2$ atomy na buňku.

$$V = \frac{N\cdot M}{\rho\cdot N_A} = \frac{2\cdot55{,}85}{7\,870\cdot6{,}022\cdot10^{26}} = 2{,}357\cdot10^{-29}\ \mathrm{m^3} \qquad a = \sqrt[3]{V} = 2{,}867\cdot10^{-10}\ \mathrm{m}$$

Dotyk podél tělesové úhlopříčky, $a\sqrt3 = 4r$:

$$r = \frac{\sqrt3}{4}\cdot a = \frac{\sqrt3}{4}\cdot2{,}867\cdot10^{-10} = 1{,}24\cdot10^{-10}\ \mathrm{m}$$
'''
warning = 'Jiná mřížka = jiný počet atomů $N$ i jiná podmínka dotyku.'

