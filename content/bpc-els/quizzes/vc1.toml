# ---------- Příklad 1
[[question]]
id = 'VC1-01'
topic = 'Metoda smyčkových proudů'
source = 'VC1, příklad 1'
figure = 'images/vc1-p1.svg'
text = '''
$U_\text{z1} = 24$ V, $U_\text{z2} = 10$ V, $U_\text{z3} = 3$ V (všechny šipky dolů), $R_1 = 20\ \Omega$, $R_2 = 15\ \Omega$, $R_3 = 200\ \Omega$, $R_4 = 35\ \Omega$, $R_5 = 50\ \Omega$. Smyčkové proudy po směru hodinových ručiček. Jak vypadá pravá strana soustavy $\mathbf{R}\,\mathbf{I}_\text{S} = \mathbf{U}$?
'''
options = ['$\begin{bmatrix} 14 \\ 7 \end{bmatrix}$', '$\begin{bmatrix} 34 \\ 13 \end{bmatrix}$', '$\begin{bmatrix} -14 \\ -7 \end{bmatrix}$', '$\begin{bmatrix} 24 \\ 3 \end{bmatrix}$']
answer = 0
layout = 'grid'
explanation = '''
Smyčka 1: $I_\text{S1}$ jde zdrojem $U_\text{z1}$ nahoru, proti šipce: $+24$; zdrojem $U_\text{z2}$ dolů, po šipce: $-10$. Celkem $+14$ V.

Smyčka 2: $I_\text{S2}$ jde zdrojem $U_\text{z2}$ nahoru, proti šipce: $+10$; zdrojem $U_\text{z3}$ dolů, po šipce: $-3$. Celkem $+7$ V.
'''
notes = ['', 'Zdroj $U_\text{z2}$ působí v obou smyčkách proti sobě, odečítá se.', 'Znaménka jsou obrácená.', 'Zapomenutý zdroj $U_\text{z2}$ ve společné větvi.']

[[question]]
id = 'VC1-02'
kind = 'numeric'
topic = 'Metoda smyčkových proudů'
source = 'VC1, příklad 1'
figure = 'images/vc1-p1.svg'
text = '''
Hodnoty jako v předchozí otázce. Jaký je determinant matice odporů $\Delta$?
'''
value = 27575
tolerance = 0
unit = 'Ω²'
explanation = '''
$$\mathbf{R} = \begin{bmatrix} R_1 + R_3 + R_4 & -R_3 \\ -R_3 & R_2 + R_3 + R_5 \end{bmatrix} = \begin{bmatrix} 255 & -200 \\ -200 & 265 \end{bmatrix}$$
$$\Delta = 255\cdot265 - (-200)\cdot(-200) = 67\,575 - 40\,000 = 27\,575$$
'''

[[question]]
id = 'VC1-03'
kind = 'numeric'
topic = 'Metoda smyčkových proudů'
source = 'VC1, příklad 1'
figure = 'images/vc1-p1.svg'
text = '''
Jaký je proud $I_1$? (zadání: 185,3 mA)
'''
value = 185.3
tolerance = 0.1
unit = 'mA'
explanation = '''
$$\begin{bmatrix} 255 & -200 \\ -200 & 265 \end{bmatrix}\begin{bmatrix} I_\text{S1} \\ I_\text{S2} \end{bmatrix} = \begin{bmatrix} 14 \\ 7 \end{bmatrix}, \qquad \Delta_1 = \begin{vmatrix} 14 & -200 \\ 7 & 265 \end{vmatrix} = 3710 + 1400 = 5110$$
$$I_1 = I_\text{S1} = \frac{5110}{27\,575} = 0{,}1853\ \text{A} = 185{,}3\ \text{mA}$$
'''

[[question]]
id = 'VC1-04'
kind = 'numeric'
topic = 'Metoda smyčkových proudů'
source = 'VC1, příklad 1'
figure = 'images/vc1-p1.svg'
text = '''
Jaký je proud $I_2$? (zadání: 166,3 mA)
'''
value = 166.3
tolerance = 0.1
unit = 'mA'
explanation = '''
$$\Delta_2 = \begin{vmatrix} 255 & 14 \\ -200 & 7 \end{vmatrix} = 1785 + 2800 = 4585, \qquad I_2 = I_\text{S2} = \frac{4585}{27\,575} = 0{,}1663\ \text{A} = 166{,}3\ \text{mA}$$
'''

[[question]]
id = 'VC1-05'
kind = 'numeric'
topic = 'Metoda smyčkových proudů'
source = 'VC1, příklad 1'
figure = 'images/vc1-p1.svg'
text = '''
Jaký je proud $I_3$ (šipka dolů rezistorem $R_3$)? (zadání: 19,04 mA)
'''
value = 19.04
tolerance = 0.02
unit = 'mA'
explanation = '''
$R_3$ je společný oběma smyčkám; $I_\text{S1}$ jím teče dolů, $I_\text{S2}$ nahoru:
$$I_3 = I_\text{S1} - I_\text{S2} = 185{,}31 - 166{,}27 = 19{,}04\ \text{mA}$$
Kontrola 2. KZ ve smyčce 1: $0{,}18531\cdot55 + 0{,}01904\cdot200 + 10 = 10{,}19 + 3{,}81 + 10 = 24{,}0$ V.
'''

# ---------- Příklad 2
[[question]]
id = 'VC1-06'
kind = 'numeric'
topic = 'Metoda smyčkových proudů'
source = 'VC1, příklad 2'
figure = 'images/vc1-p2.svg'
text = '''
$I_\text{z1} = 15$ mA (šipka dolů) s vnitřní vodivostí $G_\text{i1} = 1{,}5$ mS. Na jaké napětí se tento zdroj převede pro MSP?
'''
value = 10
tolerance = 0.01
unit = 'V'
explanation = '''
$$U'_\text{z1} = \frac{I_\text{z1}}{G_\text{i1}} = \frac{15\ \text{mA}}{1{,}5\ \text{mS}} = 10\ \text{V}, \qquad R_\text{i1} = \frac{1}{1{,}5\ \text{mS}} = 666{,}7\ \Omega\ \text{(v sérii)}$$
Šipka $I_\text{z1}$ míří dolů, kladná svorka náhradního zdroje je tedy dole a šipka $U'_\text{z1}$ míří nahoru. Podobně $U'_\text{z2} = 50/2{,}5 = 20$ V s $R_\text{i2} = 400\ \Omega$, šipka dolů (kladná svorka nahoře).
'''

[[question]]
id = 'VC1-07'
topic = 'Metoda smyčkových proudů'
source = 'VC1, příklad 2'
figure = 'images/vc1-p2.svg'
text = '''
Po převodu zdrojů ($U'_\text{z1} = 10$ V se šipkou nahoru a $R_\text{i1} = 666{,}7\ \Omega$ vlevo, $U'_\text{z2} = 20$ V se šipkou dolů a $R_\text{i2} = 400\ \Omega$ vpravo; $R_1 = 350\ \Omega$, $R_2 = 150\ \Omega$, $R_3 = 250\ \Omega$) a se smyčkovými proudy po směru hodinových ručiček. Která soustava je správně?
'''
options = [
  '$\begin{bmatrix} 1266{,}7 & -250 \\ -250 & 800 \end{bmatrix}\mathbf{I}_\text{S} = \begin{bmatrix} -10 \\ -20 \end{bmatrix}$',
  '$\begin{bmatrix} 1266{,}7 & -250 \\ -250 & 800 \end{bmatrix}\mathbf{I}_\text{S} = \begin{bmatrix} 10 \\ 20 \end{bmatrix}$',
  '$\begin{bmatrix} 600 & -250 \\ -250 & 400 \end{bmatrix}\mathbf{I}_\text{S} = \begin{bmatrix} -10 \\ -20 \end{bmatrix}$',
  '$\begin{bmatrix} 1266{,}7 & 250 \\ 250 & 800 \end{bmatrix}\mathbf{I}_\text{S} = \begin{bmatrix} -10 \\ 20 \end{bmatrix}$',
]
answer = 0
explanation = '''
Diagonála: $R_\text{i1} + R_1 + R_3 = 666{,}7 + 350 + 250 = 1266{,}7$ a $R_3 + R_2 + R_\text{i2} = 250 + 150 + 400 = 800$; mimo diagonálu $-R_3$.

Smyčkový proud 1 jde levým zdrojem nahoru, po šipce: $-10$. Smyčkový proud 2 jde pravým zdrojem dolů, po šipce: $-20$.
'''
notes = ['', 'Oba smyčkové proudy jdou zdroji po šipce, znaménka jsou záporná.', 'Chybí vnitřní odpory převedených zdrojů.', 'Mimo diagonálu má být záporné znaménko.']

