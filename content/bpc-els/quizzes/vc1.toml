'''
value = 5275000
tolerance = 0
unit = 'Ω³'
explanation = '''
$$\mathbf{R} = \begin{bmatrix} R_1 + R_3 & 0 & -R_3 \\ 0 & R_2 + R_5 & -R_5 \\ -R_3 & -R_5 & R_3 + R_4 + R_5 \end{bmatrix} = \begin{bmatrix} 270 & 0 & -250 \\ 0 & 110 & -100 \\ -250 & -100 & 500 \end{bmatrix}$$
Sarrusovo pravidlo:
$$\Delta = 270\cdot110\cdot500 + 0 + 0 - (-250)\cdot110\cdot(-250) - 270\cdot(-100)\cdot(-100) - 0 = 14\,850\,000 - 6\,875\,000 - 2\,700\,000 = 5\,275\,000$$
'''

