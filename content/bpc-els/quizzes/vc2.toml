# ---------- Příklad 2
[[question]]
id = 'VC2-07'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 2'
figure = 'images/vc2-p2.svg'
text = '''
Větev mezi uzly 1 a 2 tvoří zdroj $U_\text{A} = 20$ V (šipka doprava, kladná svorka u uzlu 1) v sérii s $R_2 = 20\ \Omega$. Čím se pro MUN nahradí?
'''
options = [
  'vodivostí $G_2 = 0{,}05$ S mezi uzly 1 a 2 a zdrojem proudu 1 A, který teče do uzlu 1 a z uzlu 2',
  'vodivostí $G_2$ a zdrojem proudu 1 A do uzlu 2 a z uzlu 1',
  'jen vodivostí $G_2$, zdroj se zkratuje',
  'zdrojem proudu 20 A',
]
answer = 0
explanation = '''
$I = U_\text{A}/R_2 = 20/20 = 1$ A. Kladná svorka zdroje je u uzlu 1, proud náhradního zdroje proudu proto míří **do uzlu 1** (a z uzlu 2). Paralelně k němu $G_2 = 1/20 = 0{,}05$ S.

Podobně větev $R_4$ + $U_\text{B}$ (šipka nahoru, kladná svorka dole u země): zdroj proudu $10/20 = 0{,}5$ A, který teče **z uzlu 2** do země, a $G_4 = 0{,}05$ S.
'''
notes = ['', 'Směr je obrácený: proud míří ke kladné svorce, tedy k uzlu 1.', 'Zkratovat by se zdroj mohl jen při superpozici, tady by zmizel.', '20/20 = 1 A, ne 20 A.']

[[question]]
id = 'VC2-08'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 2'
figure = 'images/vc2-p2.svg'
text = '''
$I = 0{,}8$ A (šipka dolů, z uzlu 1), $U_\text{A} = 20$ V, $U_\text{B} = 10$ V, $R_1 = 15\ \Omega$, $R_2 = 20\ \Omega$, $R_3 = 50\ \Omega$, $R_4 = 20\ \Omega$. Jaký je součet proudů zdrojů na pravé straně rovnice uzlu 1?
'''
value = 0.2
tolerance = 0.001
unit = 'A'
explanation = '''
Zdroj $I$ z uzlu vytéká ($-0{,}8$), náhradní zdroj větve $U_\text{A}$, $R_2$ do uzlu vtéká ($+1$): $-0{,}8 + 1 = 0{,}2$ A.

Uzel 2: $-1$ (náhradní zdroj větve $U_\text{A}$) $-0{,}5$ (větev $U_\text{B}$) $= -1{,}5$ A.
'''

[[question]]
id = 'VC2-09'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 2'
figure = 'images/vc2-p2.svg'
text = '''
Jaké je napětí $U_1$? (zadání: −4,435 V)
'''
value = -4.435
tolerance = 0.002
unit = 'V'
explanation = '''
$G_{11} = G_1 + G_2 = 0{,}06667 + 0{,}05 = 0{,}11667$ S, $G_{22} = G_2 + G_3 + G_4 = 0{,}05 + 0{,}02 + 0{,}05 = 0{,}12$ S:
$$\begin{bmatrix} 0{,}11667 & -0{,}05 \\ -0{,}05 & 0{,}12 \end{bmatrix}\begin{bmatrix} U_{10} \\ U_{20} \end{bmatrix} = \begin{bmatrix} 0{,}2 \\ -1{,}5 \end{bmatrix}$$
$$\Delta = 0{,}11667\cdot0{,}12 - 0{,}0025 = 0{,}0115, \qquad \Delta_1 = 0{,}2\cdot0{,}12 - (-0{,}05)(-1{,}5) = 0{,}024 - 0{,}075 = -0{,}051$$
$$U_1 = U_{10} = \frac{-0{,}051}{0{,}0115} = -4{,}435\ \text{V}$$
'''

[[question]]
id = 'VC2-10'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 2'
figure = 'images/vc2-p2.svg'
text = '''
Jaké je napětí $U_2$? (zadání: −14,35 V)
'''
value = -14.35
tolerance = 0.01
unit = 'V'
explanation = '''
$$\Delta_2 = \begin{vmatrix} 0{,}11667 & 0{,}2 \\ -0{,}05 & -1{,}5 \end{vmatrix} = -0{,}175 + 0{,}01 = -0{,}165, \qquad U_2 = U_{20} = \frac{-0{,}165}{0{,}0115} = -14{,}35\ \text{V}$$
'''

