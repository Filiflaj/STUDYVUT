'''

[[question]]
id = 'VC2-18'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 4'
figure = 'images/vc2-p4.svg'
text = '''
Referenční uzel je levý dolní, uzel 1 horní, uzel 2 pravý dolní. Jaká je pravá strana soustavy po převodu zdrojů ($I_\text{z1} = I_\text{z2} = 20$ mA, $I_\text{z3} = 1$ mA)?
'''
options = ['$\begin{bmatrix} 40 \\ -21 \end{bmatrix}$ mA', '$\begin{bmatrix} 40 \\ 21 \end{bmatrix}$ mA', '$\begin{bmatrix} 20 \\ -20 \end{bmatrix}$ mA', '$\begin{bmatrix} 41 \\ -20 \end{bmatrix}$ mA']
answer = 0
layout = 'grid'
explanation = '''
Uzel 1 (horní): $U_\text{z1}$ i $U_\text{z2}$ mají kladnou svorku nahoře, oba náhradní zdroje tečou do uzlu 1: $20 + 20 = 40$ mA.

Uzel 2 (pravý dolní): zdroj větve $U_\text{z2}$ z něj vytéká ($-20$); kladná svorka $U_\text{z3}$ je vlevo (k $R_4$ a referenčnímu uzlu), náhradní zdroj tedy teče do referenčního uzlu a z uzlu 2 ($-1$). Celkem $-21$ mA.
'''
notes = ['', 'Zdroje v uzlu 2 z uzlu vytékají.', 'V uzlu 1 se sčítají dva zdroje a v uzlu 2 chybí $I_\text{z3}$.', '$I_\text{z3}$ nepatří k uzlu 1.']

[[question]]
id = 'VC2-19'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 4'
figure = 'images/vc2-p4.svg'
text = '''
$R_3 = 250\ \Omega$, $R_5 = 100\ \Omega$, dále $G_1 = 0{,}4$ mS, $G_2 = 0{,}667$ mS. Jaký je diagonální prvek $G_{11}$ horního uzlu (v mS)?
'''
value = 15.067
tolerance = 0.002
unit = 'mS'
explanation = '''
K hornímu uzlu jsou připojeny $R_1$, $R_2$, $R_3$ a $R_5$:
$$G_{11} = 0{,}4 + 0{,}667 + 4 + 10 = 15{,}067\ \text{mS}$$
Dále $G_{12} = -(G_2 + G_5) = -10{,}667$ a $G_{22} = G_2 + G_4 + G_5 = 10{,}767$ mS.
'''

[[question]]
id = 'VC2-20'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 4'
figure = 'images/vc2-p4.svg'
text = '''
Jaký je proud $I_3$ rezistorem $R_3$? (zadání: 17,07 mA)
'''
value = 17.07
tolerance = 0.02
unit = 'mA'
explanation = '''
$$\begin{bmatrix} 15{,}067 & -10{,}667 \\ -10{,}667 & 10{,}767 \end{bmatrix}\begin{bmatrix} U_{10} \\ U_{20} \end{bmatrix} = \begin{bmatrix} 40 \\ -21 \end{bmatrix}$$
$$\Delta = 15{,}067\cdot10{,}767 - 10{,}667^2 = 162{,}226 - 113{,}785 = 48{,}441$$
$$\Delta_1 = 40\cdot10{,}767 - (-10{,}667)(-21) = 430{,}68 - 224{,}01 = 206{,}67, \qquad U_{10} = \frac{206{,}67}{48{,}441} = 4{,}2664\ \text{V}$$
$R_3$ vede z horního uzlu do referenčního:
$$I_3 = G_3 U_{10} = 4\cdot4{,}2664 = 17{,}07\ \text{mA}$$
'''

[[question]]
id = 'VC2-21'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 4'
figure = 'images/vc2-p4.svg'
text = '''
Jaký je proud $I_5$ rezistorem $R_5$? (zadání: 19,90 mA)
'''
value = 19.90
tolerance = 0.02
unit = 'mA'
explanation = '''
$$\Delta_2 = 15{,}067\cdot(-21) - (-10{,}667)\cdot40 = -316{,}41 + 426{,}68 = 110{,}27, \qquad U_{20} = \frac{110{,}27}{48{,}441} = 2{,}2764\ \text{V}$$
$R_5$ vede z horního uzlu do uzlu 2:
$$I_5 = G_5\,(U_{10} - U_{20}) = 10\cdot(4{,}2664 - 2{,}2764) = 19{,}90\ \text{mA}$$
'''
