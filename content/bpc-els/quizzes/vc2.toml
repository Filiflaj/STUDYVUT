# ---------- Příklad 1
[[question]]
id = 'VC2-01'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 1'
figure = 'images/vc2-p1.svg'
text = '''
$I_\text{A} = 1$ A (šipka dolů, z uzlu 1), $I_\text{B} = 2$ A (šipka nahoru, do uzlu 2), $R_1 = 10\ \Omega$, $R_2 = 20\ \Omega$, $R_3 = 10\ \Omega$. Která soustava MUN je správně (vodivosti v S, proudy v A)?
'''
options = [
  '$\begin{bmatrix} 0{,}15 & -0{,}05 \\ -0{,}05 & 0{,}15 \end{bmatrix}\mathbf{U} = \begin{bmatrix} -1 \\ 2 \end{bmatrix}$',
  '$\begin{bmatrix} 0{,}15 & -0{,}05 \\ -0{,}05 & 0{,}15 \end{bmatrix}\mathbf{U} = \begin{bmatrix} 1 \\ 2 \end{bmatrix}$',
  '$\begin{bmatrix} 0{,}1 & -0{,}05 \\ -0{,}05 & 0{,}1 \end{bmatrix}\mathbf{U} = \begin{bmatrix} -1 \\ 2 \end{bmatrix}$',
  '$\begin{bmatrix} 0{,}15 & 0{,}05 \\ 0{,}05 & 0{,}15 \end{bmatrix}\mathbf{U} = \begin{bmatrix} -1 \\ 2 \end{bmatrix}$',
]
answer = 0
explanation = '''
$G_1 = 0{,}1$ S, $G_2 = 0{,}05$ S, $G_3 = 0{,}1$ S. Diagonála: $G_1 + G_2 = 0{,}15$, $G_2 + G_3 = 0{,}15$; mimo diagonálu $-G_2$. $I_\text{A}$ z uzlu 1 vytéká ($-1$), $I_\text{B}$ do uzlu 2 vtéká ($+2$).
'''
notes = ['', '$I_\text{A}$ míří z uzlu ven, píše se se znaménkem −.', 'Na diagonále chybí $G_2$.', 'Mimo diagonálu je záporné znaménko.']

[[question]]
id = 'VC2-02'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 1'
figure = 'images/vc2-p1.svg'
text = '''
Jaké je uzlové napětí $U_{10}$?
'''
value = -2.5
tolerance = 0.001
unit = 'V'
explanation = '''
$$\Delta = 0{,}15\cdot0{,}15 - 0{,}05^2 = 0{,}0225 - 0{,}0025 = 0{,}02$$
$$\Delta_1 = \begin{vmatrix} -1 & -0{,}05 \\ 2 & 0{,}15 \end{vmatrix} = -0{,}15 + 0{,}1 = -0{,}05, \qquad U_{10} = \frac{-0{,}05}{0{,}02} = -2{,}5\ \text{V}$$
'''

