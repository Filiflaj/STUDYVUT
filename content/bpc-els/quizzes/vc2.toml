explanation = '''
$$I_1 = G_1 U_{10} = \frac{-2{,}5}{10} = -0{,}25\ \text{A}$$
Proud teče rezistorem $R_1$ nahoru, proti šipce.
'''

[[question]]
id = 'VC2-05'
