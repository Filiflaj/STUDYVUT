text = '''
$U_\text{z1} = 10$ V (šipka dolů) v sérii s $R_3 = 200\ \Omega$ se převede na zdroj proudu do uzlu 1. Jaký má proud?
'''
value = 50
tolerance = 0.01
unit = 'mA'
explanation = '''
$$I_\text{z1} = \frac{U_\text{z1}}{R_3} = \frac{10}{200} = 0{,}05\ \text{A} = 50\ \text{mA}, \qquad G_3 = 5\ \text{mS}$$
Kladná svorka $U_\text{z1}$ je nahoře, proud proto teče do uzlu 1.
'''

[[question]]
id = 'VC2-12'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 3'
figure = 'images/vc2-p3.svg'
text = '''
$R_1 = 150\ \Omega$, $R_3 = 200\ \Omega$, $R_4 = 350\ \Omega$, $R_6 = 450\ \Omega$. Jaký je diagonální prvek $G_{11}$ (v mS, vodivosti na 3 desetinná místa)?
'''
value = 16.746
tolerance = 0.002
unit = 'mS'
explanation = '''
K uzlu 1 jsou připojeny $R_1$, $R_3$ (z převedeného zdroje), $R_4$ a $R_6$:
$$G_{11} = G_1 + G_3 + G_4 + G_6 = 6{,}667 + 5 + 2{,}857 + 2{,}222 = 16{,}746\ \text{mS}$$
'''

[[question]]
id = 'VC2-13'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 3'
figure = 'images/vc2-p3.svg'
text = '''
Soustava (mS, mA): $\begin{bmatrix} 16{,}746 & -2{,}857 & -2{,}222 \\ -2{,}857 & 17{,}857 & -5 \\ -2{,}222 & -5 & 7{,}222 \end{bmatrix}\mathbf{U} = \begin{bmatrix} 50 \\ 0 \\ 20 \end{bmatrix}$. Jaký je determinant $\Delta$?
'''
value = 1530.4
tolerance = 0.3
unit = 'mS³'
explanation = '''
Sarrusovo pravidlo. Po hlavní diagonále:
$$16{,}746\cdot17{,}857\cdot7{,}222 + (-2{,}857)(-5)(-2{,}222) + (-2{,}222)(-2{,}857)(-5) = 2159{,}618 - 31{,}741 - 31{,}741 = 2096{,}136$$
Po vedlejší diagonále:
$$(-2{,}222)\cdot17{,}857\cdot(-2{,}222) + 16{,}746\cdot(-5)(-5) + (-2{,}857)(-2{,}857)\cdot7{,}222 = 88{,}164 + 418{,}650 + 58{,}950 = 565{,}764$$
$$\Delta = 2096{,}136 - 565{,}764 = 1530{,}37$$
'''

[[question]]
id = 'VC2-14'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 3'
figure = 'images/vc2-p3.svg'
text = '''
Jaké je uzlové napětí $U_{10}$?
'''
value = 4.102
tolerance = 0.002
unit = 'V'
explanation = '''
$$\Delta_1 = \begin{vmatrix} 50 & -2{,}857 & -2{,}222 \\ 0 & 17{,}857 & -5 \\ 20 & -5 & 7{,}222 \end{vmatrix} = (6448{,}16 + 285{,}70 + 0) - (-793{,}57 + 1250 + 0) = 6733{,}86 - 456{,}43 = 6277{,}43$$
$$U_{10} = \frac{6277{,}43}{1530{,}37} = 4{,}102\ \text{V}$$
'''

[[question]]
id = 'VC2-15'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 3'
figure = 'images/vc2-p3.svg'
text = '''
Jaký je proud $I_1$ rezistorem $R_1 = 150\ \Omega$? (zadání: 27,35 mA)
'''
value = 27.35
tolerance = 0.02
unit = 'mA'
explanation = '''
$$I_1 = G_1 U_{10} = 6{,}667\ \text{mS}\cdot4{,}102\ \text{V} = 27{,}35\ \text{mA}$$
'''

[[question]]
id = 'VC2-16'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 3'
figure = 'images/vc2-p3.svg'
text = '''
Jaký je proud $I_2$ rezistorem $R_2 = 100\ \Omega$? (zadání: 22,14 mA)
'''
value = 22.14
tolerance = 0.02
unit = 'mA'
explanation = '''
$$\Delta_2 = \begin{vmatrix} 16{,}746 & 50 & -2{,}222 \\ -2{,}857 & 0 & -5 \\ -2{,}222 & 20 & 7{,}222 \end{vmatrix} = (0 + 555{,}50 + 126{,}97) - (0 - 1674{,}60 - 1031{,}66) = 682{,}47 + 2706{,}26 = 3388{,}73$$
$$U_{20} = \frac{3388{,}73}{1530{,}37} = 2{,}2143\ \text{V}, \qquad I_2 = G_2 U_{20} = 10\cdot2{,}2143 = 22{,}14\ \text{mA}$$
'''

