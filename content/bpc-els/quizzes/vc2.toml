id = 'VC2-03'
kind = 'numeric'
topic = 'Metoda uzlových napětí'
source = 'VC2, příklad 1'
figure = 'images/vc2-p1.svg'
text = '''
Jaké je uzlové napětí $U_{20}$?
'''
value = 12.5
tolerance = 0.001
unit = 'V'
explanation = '''
$$\Delta_2 = \begin{vmatrix} 0{,}15 & -1 \\ -0{,}05 & 2 \end{vmatrix} = 0{,}3 - 0{,}05 = 0{,}25, \qquad U_{20} = \frac{0{,}25}{0{,}02} = 12{,}5\ \text{V}$$
'''

