value = -0.75
tolerance = 0.001
unit = 'A'
explanation = '''
$$I_2 = \frac{U_{10} - U_{20}}{R_2} = \frac{-2{,}5 - 12{,}5}{20} = -0{,}75\ \text{A}$$
'''

[[question]]
