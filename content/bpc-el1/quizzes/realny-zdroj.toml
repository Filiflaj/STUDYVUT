Zkrat vede přes miliampérmetr, na jehož vnitřním odporu vzniká malý úbytek: $0{,}29\ \text{V}/77\ \text{mA} \approx 3{,}8\ \Omega$. Do výpočtu $U_\text{i}$ ani $R_\text{i}$ se nepoužívá; naměřený $I_\text{k}$ je kvůli tomu o 2 až 3 % menší než u dokonalého zkratu.
