[[question]]
id = 'CVNZ-12'
topic = 'Přenos výkonu'
text = '''
Zátěž je výkonově přizpůsobená ($R_\text{z} = R_\text{i}$). Jaká je účinnost přenosu z ideálního zdroje $U_\text{i}$ do zátěže?
'''
options = ['50 %', '100 %', '25 %', 'záleží na $U_\text{i}$']
answer = 0
layout = 'grid'
explanation = '''
Na $R_\text{i}$ i na $R_\text{z}$ teče stejný proud a mají stejný odpor, takže se výkon dělí napůl: $\eta = R_\text{z}/(R_\text{i} + R_\text{z}) = 1/2$. Vyšší účinnost dává větší zátěž, ale menší výkon.
'''
notes = [
  '',
  'Sto procent by bylo jen při $R_\text{i} = 0$ nebo nekonečné zátěži.',
  'Čtvrtina se objevuje ve vzorci $P_\text{max} = U_\text{i}^2/(4R_\text{i})$, ne v účinnosti.',
  'Účinnost závisí jen na poměru odporů.',
]
