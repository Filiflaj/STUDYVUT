name = 'Pracovní sešit a měření'
description = 'pravidla zápisu, analogové přístroje, zaokrouhlování, odchylka'

[[question]]
id = 'PS-01'
kind = 'numeric'
topic = 'Pracovní sešit'
text = '''
Analogový voltmetr je na rozsahu 12 V, stupnice má 120 dílků a ručka ukazuje výchylku $\alpha = 80$ dílků. Jaké je měřené napětí?
'''
value = 8.0
tolerance = 0.05
unit = 'V'
explanation = '''
Konstanta je rozsah / počet dílků, $k = 12/120$ V/dílek, a měřená hodnota je výchylka krát konstanta:
$$U = \alpha\cdot k = 80\cdot\frac{12}{120} = 8{,}0\ \text{V}$$
'''

