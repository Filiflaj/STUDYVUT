[[question]]
id = 'PS-03'
topic = 'Pracovní sešit'
text = '''
Digitální multimetr ukazuje 12,030 V. Co se zapíše do tabulky?
'''
options = ['12,030', '12,03', '12,0', '12']
answer = 0
explanation = '''
U digitálního přístroje se zapisují **všechny zobrazené číslice** včetně koncových nul, nic se nezaokrouhluje. Zaokrouhlují se až vypočtené hodnoty, a to na stejný počet míst jako měřené.
'''
notes = [
