[[question]]
id = 'PS-04'
kind = 'numeric'
topic = 'Pracovní sešit'
text = '''
Vypočtené napětí je $U_\text{teor} = 4{,}904$ V, naměřené $U_\text{měř} = 4{,}96$ V. Jaká je relativní odchylka $\delta$ v procentech (se znaménkem)?
'''
value = 1.15
tolerance = 0.07
unit = '%'
sign_hint = 'Naměřená hodnota je větší než vypočtená, odchylka je kladná.'
explanation = '''
$$\delta = \frac{U_\text{měř} - U_\text{teor}}{U_\text{teor}}\cdot 100 = \frac{4{,}96 - 4{,}904}{4{,}904}\cdot 100 = 1{,}14\ \%$$
Odchylka se zaokrouhluje **nahoru** na 1 až 2 platné číslice a nechává se jí znaménko: $\delta = +1{,}2\ \%$.
'''

[[question]]
id = 'PS-05'
topic = 'Pracovní sešit'
text = '''
Jak se volí rozsah analogového přístroje?
'''
options = [
  'Nejbližší vyšší, aby ručka byla v poslední třetině stupnice.',
  'Vždy největší, aby se přístroj nepoškodil.',
  'Tak, aby ručka byla uprostřed stupnice.',
  'Na rozsahu nezáleží, chyba je pořád stejná.',
]
answer = 0
explanation = '''
Chyba analogového přístroje je daná třídou přesnosti z **rozsahu**. Při velké výchylce je proto relativní chyba nejmenší. Volí se nejbližší vyšší rozsah, než je měřená hodnota; při přepínání se začíná od nejvyššího.
'''
notes = [
  '',
  'Na největším rozsahu se začíná, ale měří se na nejbližším vyšším.',
  'Uprostřed stupnice je relativní chyba zbytečně velká.',
  'Absolutní chyba je daná rozsahem, relativní je tedy nejmenší při velké výchylce.',
]

