[[question]]
id = 'PS-08'
topic = 'Pracovní sešit'
text = '''
Při zpracování se ukáže, že jedna naměřená hodnota zjevně nesedí (např. napětí naprázdno je zapsané jako 0 V). Co s ní?
'''
options = [
  'V tabulce ji nechat, chybu vysvětlit a hodnotu případně určit náhradně (z grafu, z Kirchhoffova zákona).',
  'Přepsat ji na hodnotu, která by vyjít měla.',
  'Vymazat celý řádek.',
  'Upravit i ostatní hodnoty, aby to sedělo.',
]
answer = 0
explanation = '''
Naměřené hodnoty se nepřepisují. Chyba se v závěru vysvětlí a potřebná veličina se určí jinou cestou, třeba prodloužením charakteristiky k ose napětí. Opravit se smí jen překlep ve **vypočtené** (šedé) buňce.
'''
notes = ['', 'Přepsat naměřenou hodnotu nejde, to by bylo falšování měření.', 'Data se nemažou, chyba se vysvětlí.', 'Měřené hodnoty se nemění.']

