[[question]]
id = 'CVMO-14'
topic = 'Výpočet magnetických obvodů'
text = '''
Proč v obvodu s feromagnetickým jádrem a vzduchovou mezerou bývá většina magnetického napětí na mezeře, i když je o dva až tři řády kratší?
'''
options = [
  'permeabilita vzduchu je stokrát až tisíckrát menší než železa, takže mezera má velký magnetický odpor',
  'v mezeře je větší magnetický tok',
  'v mezeře je menší indukce',
  'mezera má větší průřez',
]
answer = 0
explanation = '''
$R_\text{m} = l/(\mu S)$. Při stejném toku a průřezu je indukce v mezeře i v železe stejná, ale intenzita $H = B/\mu$ je v mezeře $\mu_\text{r}$krát větší. Proto 1 mm vzduchu „spotřebuje“ tolik jako desítky centimetrů až metry železa.
'''
notes = [
  '',
  'V sériovém obvodu je tok všude stejný.',
  'Při stejném průřezu je indukce stejná.',
  'Větší průřez by odpor naopak zmenšil.',
