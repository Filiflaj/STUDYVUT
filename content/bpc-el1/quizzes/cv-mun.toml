[[question]]
id = 'CVMUN-12'
topic = 'MUN ve cvičení'
text = '''
Zdroj $U_1$ se sériovým $R_1$ jsi pro MUN převedl na zdroj proudu $I_\text{z1}$ s vodivostí $G_1$ do uzlu 1. Jak spočítáš skutečný proud rezistorem $R_1$ (od zdroje do uzlu)?
'''
options = [
  '$I_1 = I_\text{z1} - G_1U_{10} = (U_1 - U_{10})/R_1$',
  '$I_1 = G_1U_{10}$',
  '$I_1 = I_\text{z1}$',
  '$I_1 = U_{10}/R_1 + I_\text{z1}$',
]
answer = 0
explanation = '''
V náhradním schématu teče vodivostí $G_1$ proud $G_1U_{10}$, ale to není proud původního rezistoru. Skutečný proud se počítá z původního obvodu: rozdíl napětí zdroje a uzlu lomeno odporem.
'''
notes = [
  '',
  'To je proud náhradní vodivosti, ne původního rezistoru.',
  'To je proud nakrátko, platil by jen při $U_{10} = 0$.',
  'Znaménka nesedí, proud se zmenšuje, když napětí uzlu roste.',
]
