'''
options = [
  'zdroj proudu $U/R$ tekoucí do uzlu, paralelně vodivost $1/R$',
  'zdroj proudu $U/R$ tekoucí z uzlu, paralelně vodivost $1/R$',
  'zdroj proudu $U\,R$ tekoucí do uzlu',
  'zkrat, protože MUN zdroje napětí ignoruje',
]
answer = 0
explanation = '''
Proud nakrátko reálného zdroje je $U/R$ a teče z jeho kladné svorky ven do obvodu, tedy do uzlu. Vnitřní vodivost $1/R$ se zapojí paralelně a přičte se k diagonále uzlu.
'''
notes = [
  '',
  'Směr je opačný: + je u uzlu, proud do uzlu vtéká.',
  'Proud je napětí lomeno odporem.',
  'MUN zdroje převádí, ne ignoruje.',
]

