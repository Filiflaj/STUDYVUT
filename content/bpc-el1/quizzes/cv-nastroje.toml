[[question]]
id = 'CVNA-06'
topic = 'Nástroje: kalkulačka, LinRov, MicroCap'
text = '''
Matici soustavy máš na kalkulačce v MatA a vektor pravých stran v MatB. Jak získáš vektor neznámých?
'''
options = ['MatA⁻¹ × MatB', 'MatB⁻¹ × MatA', 'MatA × MatB', 'det(MatA) × MatB']
answer = 0
layout = 'grid'
explanation = '''
Z $\mathbf{A}\mathbf{x} = \mathbf{b}$ plyne $\mathbf{x} = \mathbf{A}^{-1}\mathbf{b}$; inverzní matice se násobí **zleva**. Pro Cramerovo pravidlo se počítá det(MatA) a determinanty matic s nahrazeným sloupcem.
'''
notes = [
  '',
  'Vektor nemá inverzi a pořadí násobení je špatně.',
  'To by matici soustavy použilo místo její inverze.',
  'Determinant je číslo, z něj samotného řešení nevznikne.',
]

