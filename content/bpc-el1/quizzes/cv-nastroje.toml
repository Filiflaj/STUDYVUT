[[question]]
id = 'CVNA-03'
topic = 'Nástroje: kalkulačka, LinRov, MicroCap'
text = '''
Kterou analýzou MicroCapu nakreslíš závislost napětí na rezistoru na napětí zdroje (třeba AV charakteristiku diody)?
'''
options = ['DC', 'AC', 'Transient', 'jen pracovní bod (BIAS)']
answer = 0
layout = 'grid'
explanation = '''
DC analýza opakuje výpočet stejnosměrného pracovního bodu pro řadu hodnot rozmítané veličiny (napětí zdroje, teplota, parametr) a výsledek vykreslí jako graf.
'''
notes = [
  '',
  'AC je kmitočtová analýza linearizovaného obvodu.',
  'Transient počítá časové průběhy.',
  'BIAS dá jediný bod, ne závislost.',
]

[[question]]
id = 'CVNA-04'
topic = 'Nástroje: kalkulačka, LinRov, MicroCap'
text = '''
