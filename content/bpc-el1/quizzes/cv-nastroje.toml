  'graf průběhu proudu v čase',
  'nic dalšího',
]
answer = 0
explanation = '''
LinRov řeší soustavy 1. až 5. řádu $\mathbf{K}\mathbf{X} = \mathbf{Y}$ a po stisku Výpočet zobrazí i $\Delta$ a $\Delta_k$, takže jde snadno zkontrolovat ruční výpočet. Symetrickou matici stačí zadat v horním trojúhelníku a zkopírovat.
'''
notes = [
  '',
  'LinRov pracuje jen s čísly, schéma nekreslí.',
  'Časové průběhy počítá simulátor, ne řešič soustav.',
  'Determinanty ukazuje.',
]
