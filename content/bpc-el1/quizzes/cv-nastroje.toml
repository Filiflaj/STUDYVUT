options = ['Transient', 'AC', 'DC', 'BIAS']
answer = 0
layout = 'grid'
explanation = '''
Analýza přechodných dějů (Transient) řeší obvod v časové oblasti s počátečními podmínkami a s nelineárními modely. AC naopak předpokládá malé signály a linearizuje.
'''
notes = [
  '',
  'AC pracuje v kmitočtové oblasti a nelinearity nepostihne.',
