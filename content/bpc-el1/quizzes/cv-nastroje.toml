[[question]]
id = 'CVNA-01'
topic = 'Nástroje: kalkulačka, LinRov, MicroCap'
text = '''
V MicroCapu zadáš rezistoru hodnotu `1M`. Jaký odpor bude mít?
'''
options = ['1 mΩ', '1 MΩ', '1 Ω', 'chyba, hodnota se nepřijme']
answer = 0
layout = 'grid'
explanation = '''
Simulátory typu SPICE nerozlišují velká a malá písmena: `M` i `m` znamená mili. Mega se píše `MEG` (`1MEG` = 1 MΩ). Jinak `k` = kilo, `u` = mikro, `n` = nano, `p` = piko; `1k2` = 1,2 kΩ.
'''
notes = [
  '',
  'Mega se v MicroCapu píše MEG.',
  'Předpona se neignoruje.',
  'Hodnota se přijme, jen jako miliohm.',
]

