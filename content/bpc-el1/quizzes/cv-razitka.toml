  'určitě je chyba ve výpočtu, odpor nemůže být záporný',
  'vstupní odpor je 81 Ω, znaménko se zanedbá',
  'tranzistor je v nasycení',
]
answer = 0
explanation = '''
Záporný vstupní odpor znamená, že při kladném vstupním proudu je vstupní napětí záporné: obvod napájený z aktivního prvku dodává energii zpět do zdroje signálu. U zapojení se zpětnou vazbou (PC8, př. 3; sbírka 6.24, 6.25) je to skutečná vlastnost, ne chyba.
'''
notes = [
  '',
  'Aktivní obvod záporný vstupní odpor mít může.',
  'Znaménko nese informaci, nezanedbává se.',
  'Malosignálový model nasycení vůbec nepopisuje.',
]
