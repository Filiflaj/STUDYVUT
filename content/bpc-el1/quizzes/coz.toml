'''
figure = 'images/cv-prubeh-b.svg'
value = 3.680
tolerance = 0.005
unit = 'V'
explanation = '''
$$U = \sqrt{\frac1T\left[\int_0^{T/2}\frac{U_\text{m}^2}{T^2}t^2\,\mathrm{d}t + U_\text{m}^2\frac T2\right]} = U_\text{m}\sqrt{\frac1{24} + \frac12} = 5\sqrt{\frac{13}{24}} = 3{,}680\ \text{V}$$
'''

[[question]]
id = 'COZ6-05'
kind = 'numeric'
