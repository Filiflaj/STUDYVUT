$$k_\text{t} = \frac{U}{U_\text{sa}} = \frac{3{,}680}{3{,}125} = 1{,}178, \qquad k_\text{v} = \frac{U_\text{m}}{U} = \frac{5}{3{,}680} = 1{,}359$$
'''

