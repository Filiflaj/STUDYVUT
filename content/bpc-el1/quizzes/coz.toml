source = 'COZ4, př. 4.12 (PC9, př. 4)'
text = '''
Pro proměnný rezistor $R$ vyšel náhradní zdroj $U_\text{i} = 15\ \text{V}$, $R_\text{i} = 8{,}333\ \Omega$. Jaké napětí bude na $R = 40\ \Omega$?
'''
value = 12.41
tolerance = 0.02
unit = 'V'
explanation = '''
$$U_R = U_\text{i}\,\frac{R}{R_\text{i} + R} = 15\cdot\frac{40}{48{,}33} = 12{,}41\ \text{V}$$
Náhradní zdroj: $R_\text{i} = (R_1 + R_3) \parallel R_2 = 50\cdot10/60 = 8{,}333\ \Omega$, $U_\text{i} = (I + I')/(G_{13} + G_2) = (1 + 0{,}8)/(0{,}02 + 0{,}1) = 15\ \text{V}$ s $I' = U/(R_1 + R_3) = 0{,}8\ \text{A}$.
'''

[[question]]
id = 'COZ4-15'
kind = 'numeric'
topic = 'Věty o náhradním zdroji'
source = 'COZ4, př. 4.13 (PC9, př. 5)'
text = '''
Pro napětí naprázdno vyšla soustava MUN $\begin{bmatrix} 0{,}12 & -0{,}1 \\ -0{,}1 & 0{,}1833 \end{bmatrix}\begin{bmatrix} U_{10} \\ U_{20} \end{bmatrix} = \begin{bmatrix} -1 \\ 2{,}5 \end{bmatrix}$ a $U_\text{i} = U_{20}$. Kolik je $U_\text{i}$?
'''
value = 16.67
tolerance = 0.03
unit = 'V'
explanation = '''
$$\Delta = 0{,}12\cdot0{,}1833 - (-0{,}1)(-0{,}1) = 0{,}022 - 0{,}01 = 0{,}012, \qquad \Delta_2 = 0{,}12\cdot2{,}5 - (-0{,}1)(-1) = 0{,}2$$
$$U_\text{i} = \frac{0{,}2}{0{,}012} = 16{,}67\ \text{V}$$
S $R_\text{i} = 20\ \Omega$ dá přizpůsobená zátěž $R = 20\ \Omega$ výkon $16{,}67^2/(4\cdot20) = 3{,}472\ \text{W}$.
'''

