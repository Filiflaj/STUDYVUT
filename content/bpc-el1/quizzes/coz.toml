[[question]]
id = 'COZ4-01'
kind = 'numeric'
topic = 'Řízené zdroje v MUN'
source = 'COZ4, př. 4.1 (PC8, př. 1)'
text = '''
Zesilovač s MOSFET v zapojení SE: $R_1 = 1\ \text{M}\Omega$ (uzel 1 – zem), $R_2 = 12\ \text{M}\Omega$ (uzly 1–2), $R_3 = 10\ \text{k}\Omega$ (uzel 2 – zem), ZPŘN $g_\text{m}U_{10}$ z uzlu 2 k zemi, $g_\text{m} = 100\ \text{mS}$. Jaký je napěťový přenos $K_U$?
'''
value = -999.1
tolerance = 0.5
explanation = '''
$G_1 = 1\cdot10^{-6}$, $G_2 = 8{,}333\cdot10^{-8}$, $G_3 = 1\cdot10^{-4}\ \text{S}$:
$$\begin{bmatrix} G_1 + G_2 & -G_2 \\ -G_2 + g_\text{m} & G_2 + G_3 \end{bmatrix} = \begin{bmatrix} 1{,}083\cdot10^{-6} & -8{,}333\cdot10^{-8} \\ 0{,}1 & 1{,}0008\cdot10^{-4} \end{bmatrix}$$
$$K_U = \frac{\Delta_2}{\Delta_1} = \frac{-0{,}1\,I}{1{,}0008\cdot10^{-4}\,I} = -999{,}2$$
(S $G_2 + G_3$ zaokrouhleným na $1{,}001\cdot10^{-4}$ vyjde −999,0.)
'''
warning = 'Slajd PC8 uvádí K_U = −992,2, ale z jeho vlastních čísel vychází −0,1/1,001·10⁻⁴ = −999,0. Na slajdu je početní chyba.'

