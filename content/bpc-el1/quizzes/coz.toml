[[question]]
id = 'COZ6-01'
kind = 'numeric'
topic = 'Periodické průběhy'
source = 'COZ6, př. 6.1 (PC12, př. 1)'
text = '''
Proud podle obrázku má $I_\text{m} = 200\ \text{mA}$. Jaká je jeho střední hodnota? Výsledek v mA.
'''
figure = 'images/cv-prubeh-a.svg'
value = 100
tolerance = 0.5
unit = 'mA'
explanation = '''
$$I_0 = \frac1T\left[I_\text{m}\frac T2 - I_\text{m}\frac T4 + I_\text{m}\frac T4\right] = \frac{I_\text{m}}{2} = 100\ \text{mA}$$
'''

[[question]]
id = 'COZ6-02'
kind = 'numeric'
topic = 'Periodické průběhy'
source = 'COZ6, př. 6.1 (PC12, př. 1)'
text = '''
Jaká je efektivní hodnota téhož proudu ($I_\text{m} = 200\ \text{mA}$)? Výsledek v mA.
'''
figure = 'images/cv-prubeh-a.svg'
value = 200
tolerance = 0.5
unit = 'mA'
explanation = '''
Čtverec je po celou periodu $I_\text{m}^2$, znaménko nehraje roli:
$$I = \sqrt{\frac1T\left[I_\text{m}^2\frac T2 + I_\text{m}^2\frac T4 + I_\text{m}^2\frac T4\right]} = I_\text{m} = 200\ \text{mA}$$
'''

[[question]]
id = 'COZ6-03'
kind = 'numeric'
topic = 'Periodické průběhy'
source = 'COZ6, př. 6.2 (PC12, př. 2)'
text = '''
Napětí podle obrázku má $U_\text{m} = 5\ \text{V}$. Jaká je jeho střední hodnota?
'''
figure = 'images/cv-prubeh-b.svg'
value = -1.875
tolerance = 0.005
unit = 'V'
sign_hint = 'Záporná půlperioda má větší plochu.'
explanation = '''
$$U_0 = \frac1T\left[\int_0^{T/2}\frac{U_\text{m}}{T}t\,\mathrm{d}t - U_\text{m}\frac T2\right] = U_\text{m}\left(\frac18 - \frac12\right) = -\frac38\cdot5 = -1{,}875\ \text{V}$$
'''

[[question]]
id = 'COZ6-04'
kind = 'numeric'
topic = 'Periodické průběhy'
source = 'COZ6, př. 6.2 (PC12, př. 2)'
text = '''
