$$(G_1 + G_2 + G_\text{d})\,U_2 = I + I_\text{z} \quad\Rightarrow\quad 0{,}605\,U_2 = 4{,}3 \quad\Rightarrow\quad U_2 = 7{,}107\ \text{V}$$
