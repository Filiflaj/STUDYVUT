name = 'Pracovní sešity COZ1–COZ6'
description = 'příklady z pracovních sešitů ke cvičením, s postupem a výsledkem'

# ------------------------------------------------------------------ COZ1

[[question]]
id = 'COZ1-01'
kind = 'numeric'
topic = 'Prvky R, L, C'
source = 'COZ1, př. 1.1'
text = '''
Induktorem teče proud $i = 5t^2$ (A, $t$ v sekundách). Jaké napětí je na něm v čase $t = 1\ \text{s}$? List indukčnost neuvádí, počítej s $L = 1\ \text{H}$.
'''
value = 10
tolerance = 0.01
unit = 'V'
explanation = '''
$$u = L\frac{\mathrm{d}i}{\mathrm{d}t} = 1\cdot10t \quad\Rightarrow\quad u(1) = 10\ \text{V}$$
Pro lineární proud $i = 5t$ by bylo napětí stálé, $u = 5\ \text{V}$; kvadratický proud dá lineárně rostoucí napětí.
'''

[[question]]
id = 'COZ1-02'
kind = 'numeric'
topic = 'Prvky R, L, C'
source = 'COZ1, př. 1.2'
text = '''
Na induktoru $L = 1\ \text{H}$ je od času 0 stálé napětí 5 V, na počátku jím proud neteče. Jaký proud jím teče v čase 2 s?
'''
value = 10
tolerance = 0.01
unit = 'A'
explanation = '''
$$i(t) = i(0) + \frac1L\int_0^t u\,\mathrm{d}t = 0 + \frac{5t}{1} \quad\Rightarrow\quad i(2) = 10\ \text{A}$$
Stálé napětí na cívce znamená lineárně rostoucí proud.
'''

[[question]]
id = 'COZ1-03'
kind = 'numeric'
topic = 'Prvky R, L, C'
source = 'COZ1, př. 1.3'
text = '''
Proud cívkou $L = 4\ \text{mH}$ má průběh podle obrázku. Jaké napětí je na cívce v intervalu 4 až 9 ms? Výsledek v mV.
'''
figure = 'images/cv-coz1-proud.svg'
value = -8
tolerance = 0.05
unit = 'mV'
sign_hint = 'Proud v tomto úseku klesá, napětí je záporné.'
explanation = '''
Proud klesne o 10 mA za 5 ms:
$$u = L\frac{\Delta i}{\Delta t} = 4\cdot10^{-3}\cdot\frac{-10\cdot10^{-3}}{5\cdot10^{-3}} = -8\cdot10^{-3}\ \text{V} = -8\ \text{mV}$$
V úseku 2 až 4 ms je $+20\ \text{mV}$, jinde nula. (Indukčnost list neuvádí; 4 mH odpovídá měřítku jeho grafů.)
'''

[[question]]
id = 'COZ1-04'
kind = 'numeric'
topic = 'Prvky R, L, C'
source = 'COZ1, př. 1.4'
text = '''
Na cívce $L = 4\ \text{mH}$ je napětí 0 do 2 ms, $+20\ \text{mV}$ od 2 do 4 ms a $-8\ \text{mV}$ od 4 do 9 ms; na počátku neteče proud. Jaký proud teče v čase 6 ms? Výsledek v mA.
'''
value = 6
tolerance = 0.02
unit = 'mA'
explanation = '''
Proud je plocha pod napětím lomeno $L$:
$$i(4\ \text{ms}) = \frac{20\cdot10^{-3}\cdot2\cdot10^{-3}}{4\cdot10^{-3}} = 10\ \text{mA}, \qquad i(6\ \text{ms}) = 10\ \text{mA} + \frac{-8\cdot10^{-3}\cdot2\cdot10^{-3}}{4\cdot10^{-3}} = 10 - 4 = 6\ \text{mA}$$
Je to obrácená úloha k př. 1.3: vyjde trojúhelník s vrcholem 10 mA ve 4 ms, který v 9 ms klesne na nulu.
'''

[[question]]
id = 'COZ1-05'
kind = 'numeric'
topic = 'Prvky R, L, C'
source = 'COZ1, př. 1.5'
text = '''
Napětí kapacitoru $C = 2\ \mu\text{F}$ má průběh podle obrázku. Jaký proud jím teče v intervalu 0 až 2 ms? Výsledek v mA.
'''
figure = 'images/cv-coz1-napeti.svg'
value = 4
tolerance = 0.02
unit = 'mA'
explanation = '''
$$i = C\frac{\Delta u}{\Delta t} = 2\cdot10^{-6}\cdot\frac{4}{2\cdot10^{-3}} = 4\cdot10^{-3}\ \text{A} = 4\ \text{mA}$$
Kapacita v listu není; 2 μF odpovídá měřítku grafu proudu.
'''

[[question]]
id = 'COZ1-06'
kind = 'numeric'
topic = 'Prvky R, L, C'
source = 'COZ1, př. 1.5'
text = '''
Jaký proud teče tímtéž kapacitorem ($C = 2\ \mu\text{F}$) v intervalu 5 až 11 ms, kdy napětí klesá ze 4 V na nulu? Výsledek v mA.
'''
figure = 'images/cv-coz1-napeti.svg'
value = -1.333
tolerance = 0.005
unit = 'mA'
sign_hint = 'Napětí klesá, kapacitor se vybíjí, proud je záporný.'
explanation = '''
$$i = C\frac{\Delta u}{\Delta t} = 2\cdot10^{-6}\cdot\frac{-4}{6\cdot10^{-3}} = -1{,}333\ \text{mA}$$
Mezi 2 a 5 ms se napětí nemění a proud je nulový.
'''

[[question]]
id = 'COZ1-07'
kind = 'numeric'
topic = 'Prvky R, L, C'
source = 'COZ1, př. 1.6'
text = '''
Vybitým kapacitorem $C = 2\ \mu\text{F}$ teče proud 4 mA od 0 do 2 ms, od 2 do 5 ms nulový a od 5 do 11 ms −1,333 mA. Jaké napětí má kapacitor v čase 8 ms?
'''
value = 2
tolerance = 0.01
unit = 'V'
explanation = '''
Napětí je plocha pod proudem lomeno $C$:
$$u(2\ \text{ms}) = \frac{4\cdot10^{-3}\cdot2\cdot10^{-3}}{2\cdot10^{-6}} = 4\ \text{V}, \qquad u(8\ \text{ms}) = 4 + \frac{-1{,}333\cdot10^{-3}\cdot3\cdot10^{-3}}{2\cdot10^{-6}} = 4 - 2 = 2\ \text{V}$$
'''

# ------------------------------------------------------------------ COZ2

[[question]]
id = 'COZ2-01'
kind = 'numeric'
topic = 'Základní pojmy a zdroje'
source = 'COZ2, př. 2.1 (PC4, př. 1)'
text = '''
Automobilový akumulátor má napětí naprázdno 13,5 V, při odběru 20 A klesne svorkové napětí na 12,9 V. Jaký je jeho vnitřní odpor?
'''
value = 0.03
tolerance = 0.0005
unit = 'Ω'
explanation = '''
2. KZ: $R_\text{i}I + U - U_\text{i} = 0$:
$$R_\text{i} = \frac{U_\text{i} - U}{I} = \frac{13{,}5 - 12{,}9}{20} = 0{,}03\ \Omega$$
'''

[[question]]
id = 'COZ2-02'
kind = 'numeric'
topic = 'Základní pojmy a zdroje'
source = 'COZ2, př. 2.1 (PC4, př. 1)'
text = '''
Jaký je proud $I_\text{i}$ proudového modelu téhož akumulátoru ($U_\text{i} = 13{,}5\ \text{V}$, $R_\text{i} = 0{,}03\ \Omega$)?
'''
value = 450
tolerance = 1
unit = 'A'
explanation = '''
$$I_\text{i} = \frac{U_\text{i}}{R_\text{i}} = \frac{13{,}5}{0{,}03} = 450\ \text{A}, \qquad G_\text{i} = \frac{1}{0{,}03} = 33{,}3\ \text{S}$$
'''

[[question]]
id = 'COZ2-03'
kind = 'numeric'
topic = 'Základní pojmy a zdroje'
source = 'COZ2, př. 2.2 (PC4, př. 2)'
text = '''
Zdroj dodává do $R_1 = 68\ \Omega$ proud 0,15 A a do $R_2 = 100\ \Omega$ proud 0,106 A. Vyšlo $R_\text{i} = 9{,}091\ \Omega$ a $U_\text{i} = 11{,}56\ \text{V}$. Jaký je proud $I_\text{i}$ proudového modelu?
'''
value = 1.272
tolerance = 0.003
unit = 'A'
explanation = '''
$$I_\text{i} = \frac{U_\text{i}}{R_\text{i}} = \frac{11{,}56}{9{,}091} = 1{,}272\ \text{A}, \qquad G_\text{i} = \frac{1}{9{,}091} = 0{,}11\ \text{S}$$
Odvození $R_\text{i}$ a $U_\text{i}$ ze dvou zatížení je v kapitole o základních pojmech.
'''

[[question]]
id = 'COZ2-04'
kind = 'numeric'
topic = 'Zjednodušování obvodu'
source = 'COZ2, př. 2.3 (PC4, př. 3)'
text = '''
Metodou postupného zjednodušování urči $U_4$: $U = 10\ \text{V}$, $R_1 = 30\ \Omega$, $R_2 = 100\ \Omega$, $R_3 = R_4 = 50\ \Omega$.
'''
figure = 'images/cv-zjednodusovani.svg'
value = 3.125
tolerance = 0.003
unit = 'V'
explanation = '''
$$R_{34} = 100\ \Omega, \quad R_{234} = \frac{100\cdot100}{200} = 50\ \Omega, \quad R = 30 + 50 = 80\ \Omega$$
$$I_1 = \frac{10}{80} = 0{,}125\ \text{A}, \quad U_2 = U - R_1I_1 = 10 - 3{,}75 = 6{,}25\ \text{V}, \quad U_4 = U_2\frac{R_4}{R_3 + R_4} = 3{,}125\ \text{V}$$
'''

[[question]]
id = 'COZ2-05'
kind = 'numeric'
topic = 'Zjednodušování obvodu'
source = 'COZ2, př. 2.4 (PC4, př. 5)'
text = '''
Zdroj $U = 10\ \text{V}$ má přímo připojený $R_5 = 10\ \text{k}\Omega$ a vedle něj větev: $R_2 = 13\ \text{k}\Omega$ v sérii s paralelní dvojicí $R_3 = 3\ \text{k}\Omega$ a $R_1 + R_4 = 3 + 2\ \text{k}\Omega$. Jaký celkový proud $I_1$ dodává zdroj? Výsledek v mA.
'''
value = 1.672
tolerance = 0.003
unit = 'mA'
explanation = '''
$$R_{14} = 5\ \text{k}\Omega, \quad R_{314} = \frac{3\cdot5}{8} = 1{,}875\ \text{k}\Omega, \quad R_{2314} = 13 + 1{,}875 = 14{,}875\ \text{k}\Omega$$
$$R = \frac{R_5R_{2314}}{R_5 + R_{2314}} = \frac{10\cdot14{,}875}{24{,}875} = 5{,}98\ \text{k}\Omega, \qquad I_1 = \frac{10}{5{,}98} = 1{,}672\ \text{mA}$$
'''

[[question]]
id = 'COZ2-06'
kind = 'numeric'
topic = 'Zjednodušování obvodu'
source = 'COZ2, př. 2.4 (PC4, př. 5)'
text = '''
V tomtéž obvodu ($I_1 = 1{,}672\ \text{mA}$, proud $R_5$ je $I_5 = 1\ \text{mA}$) urči proud $I_4$ větví $R_1 + R_4$. Výsledek v mA.
'''
value = 0.2521
tolerance = 0.002
unit = 'mA'
explanation = '''
$$I_2 = I_1 - I_5 = 0{,}672\,3\ \text{mA}, \quad U_{R2} = 13\cdot0{,}672\,3 = 8{,}740\ \text{V}, \quad U_{R3} = 10 - 8{,}740 = 1{,}260\ \text{V}$$
$$I_3 = \frac{1{,}260}{3} = 0{,}420\,0\ \text{mA}, \qquad I_4 = I_2 - I_3 = 0{,}672\,3 - 0{,}420\,0 = 0{,}252\ \text{mA}$$
'''
warning = 'Zaokrouhlení I2 na 0,672 mA posune U_R2 na 8,736 V a I3 na 0,4213 mA. Odtud pochází hodnota 0,4213 ve sbírce (př. 2.8); přesně je I3 = 0,4202 mA a I4 = 0,2521 mA.'

[[question]]
id = 'COZ2-07'
kind = 'numeric'
topic = 'Zjednodušování obvodu'
source = 'COZ2, př. 2.5 (PC4, př. 5; sbírka 2.7)'
text = '''
Zdroj $U = 50\ \text{V}$ je v sérii s $R_1 = 10\ \Omega$ a $R_6 = 60\ \Omega$. Mezi nimi jsou dvě paralelní cesty: $R_2 = 20\ \Omega$ a cesta z paralelní dvojice $R_3 = 30\ \Omega$, $R_4 = 40\ \Omega$ v sérii s $R_5 = 50\ \Omega$. Jaký proud $I_2$ teče rezistorem $R_2$?
'''
value = 0.451
tolerance = 0.002
unit = 'A'
explanation = '''
$$R_{34} = \frac{30\cdot40}{70} = 17{,}14\ \Omega, \quad R_{345} = 17{,}14 + 50 = 67{,}14\ \Omega, \quad R_{2345} = \frac{20\cdot67{,}14}{87{,}14} = 15{,}41\ \Omega$$
$$R = 10 + 15{,}41 + 60 = 85{,}41\ \Omega, \quad I = \frac{50}{85{,}41} = 0{,}585\,4\ \text{A}, \quad U_2 = 0{,}585\,4\cdot15{,}41 = 9{,}021\ \text{V}$$
$$I_2 = \frac{9{,}021}{20} = 0{,}451\ \text{A}$$
(Dál $I_5 = 0{,}134\ \text{A}$, $I_3 = 0{,}0767\ \text{A}$, $I_4 = 0{,}0576\ \text{A}$, shodně se sbírkou.)
'''

[[question]]
id = 'COZ2-08'
kind = 'numeric'
topic = 'Zjednodušování obvodu'
source = 'COZ2, př. 2.6 (PC4, př. 6)'
text = '''
Zdroj $U = 48\ \text{V}$ v sérii s $R_1 = 2\ \Omega$ napájí dvě paralelní cesty: $R_5 = 20\ \Omega$ a $R_2 = 30\ \Omega$ v sérii s paralelní dvojicí $R_3 = 40\ \Omega$, $R_4 = 10\ \Omega$. Jaký proud $I_1$ dodává zdroj?
'''
value = 3.178
tolerance = 0.005
unit = 'A'
explanation = '''
$$R_{34} = \frac{40\cdot10}{50} = 8\ \Omega, \quad R_{234} = 30 + 8 = 38\ \Omega, \quad R_{2345} = \frac{38\cdot20}{58} = 13{,}10\ \Omega$$
$$I_1 = \frac{48}{2 + 13{,}10} = \frac{48}{15{,}10} = 3{,}178\ \text{A}$$
(Dál $I_5 = 2{,}082\ \text{A}$, $I_2 = 1{,}096\ \text{A}$, $I_3 = 0{,}219\ \text{A}$, $I_4 = 0{,}877\ \text{A}$.)
'''

[[question]]
id = 'COZ2-09'
kind = 'numeric'
topic = 'Kirchhoffovy rovnice a MSP'
source = 'COZ2, př. 2.7 (PC5, př. 1)'
text = '''
Kirchhoffova soustava obvodu se dvěma zdroji je
$$\begin{bmatrix} -1 & -1 & 1 \\ 10 & 0 & 15 \\ 0 & 20 & 15 \end{bmatrix}\begin{bmatrix} I_1 \\ I_2 \\ I_3 \end{bmatrix} = \begin{bmatrix} 0 \\ 6 \\ 18 \end{bmatrix}$$
Sarrusovým pravidlem spočítej determinant $\Delta_2$ (2. sloupec nahrazený pravou stranou).
'''
value = 360
tolerance = 0
explanation = '''
$$\Delta_2 = \begin{vmatrix} -1 & 0 & 1 \\ 10 & 6 & 15 \\ 0 & 18 & 15 \end{vmatrix} = (-1)\cdot6\cdot15 + 0\cdot15\cdot0 + 1\cdot10\cdot18 - \big[1\cdot6\cdot0 + (-1)\cdot15\cdot18 + 0\cdot10\cdot15\big]$$
$$\Delta_2 = -90 + 180 - (-270) = 360$$
S $\Delta = 650$ je $I_2 = 360/650 = 0{,}553\,8\ \text{A}$.
'''

[[question]]
id = 'COZ2-10'
kind = 'numeric'
topic = 'Kirchhoffovy rovnice a MSP'
source = 'COZ2, př. 2.8 (PC5, př. 2)'
text = '''
$U_1 = 6\ \text{V}$, $U_2 = 18\ \text{V}$, $R_1 = 10\ \Omega$, $R_2 = 20\ \Omega$, $R_3 = 15\ \Omega$. Jaký je smyčkový proud $I_\text{s2}$ (orientace podle obrázku)?
'''
figure = 'images/cv-msp-zaklad.svg'
value = -0.5538
tolerance = 0.001
unit = 'A'
sign_hint = 'Smyčkový proud teče proti zvolené orientaci.'
explanation = '''
$$\begin{bmatrix} 25 & -15 \\ -15 & 35 \end{bmatrix}\begin{bmatrix} I_\text{s1} \\ I_\text{s2} \end{bmatrix} = \begin{bmatrix} 6 \\ -18 \end{bmatrix}, \qquad \Delta = 875 - 225 = 650$$
$$\Delta_2 = 25\cdot(-18) - (-15)\cdot6 = -360, \qquad I_\text{s2} = \frac{-360}{650} = -0{,}553\,8\ \text{A}$$
$U_2$ má šipku dolů, stejně jako jde $I_\text{s2}$ pravou větví, proto $-U_2$.
'''

[[question]]
id = 'COZ2-11'
kind = 'numeric'
topic = 'Kirchhoffovy rovnice a MSP'
source = 'COZ2, př. 2.9 (PC5, př. 3)'
text = '''
Můstek z obrázku: $U = 2\ \text{V}$, $R_1 = R_3 = 20\ \Omega$, $R_2 = 40\ \Omega$, $R_4 = 10\ \Omega$, $R_\text{G} = 25\ \Omega$. Smyčky: $I_\text{s1}$ přes $R_1$, $R_\text{G}$, $R_3$; $I_\text{s2}$ přes $R_2$, $R_4$, $R_\text{G}$; $I_\text{s3}$ přes $R_3$, $R_4$ a zdroj. Soustava MSP je
$$\begin{bmatrix} 65 & -25 & -20 \\ -25 & 75 & -10 \\ -20 & -10 & 30 \end{bmatrix}\mathbf{I}_\text{s} = \begin{bmatrix} 0 \\ 0 \\ 2 \end{bmatrix}$$
Jaký proud teče diagonálou, $I_\text{G} = I_\text{s1} - I_\text{s2}$? Výsledek v mA.
'''
figure = 'images/cv-mustek.svg'
value = 14.81
tolerance = 0.03
unit = 'mA'
explanation = '''
Rozvojem podle 1. řádku: $\Delta = 65(2250 - 100) + 25(-750 - 200) - 20(250 + 1500) = 139\,750 - 23\,750 - 35\,000 = 81\,000$.

Pravá strana má jen třetí prvek, takže $\Delta_1$ a $\Delta_2$ dají rozvojem podle nahrazeného sloupce:
$$\Delta_1 = 2\begin{vmatrix} -25 & -20 \\ 75 & -10 \end{vmatrix} = 2\cdot1750 = 3500, \qquad \Delta_2 = -2\begin{vmatrix} 65 & -20 \\ -25 & -10 \end{vmatrix} = -2\cdot(-1150) = 2300$$
$$I_\text{s1} = 0{,}043\,21\ \text{A}, \quad I_\text{s2} = 0{,}028\,40\ \text{A}, \qquad I_\text{G} = 0{,}014\,81\ \text{A} = 14{,}81\ \text{mA}$$
Náhradním zdrojem vyjde totéž (sbírka 8.6).
'''

[[question]]
id = 'COZ2-12'
kind = 'numeric'
topic = 'Kirchhoffovy rovnice a MSP'
source = 'COZ2, př. 2.10 (PC5, př. 4)'
text = '''
V obvodu je zdroj proudu $I = 2\ \text{A}$ paralelně s $R_2 = 30\ \Omega$. Po převodu na zdroj napětí $U = R_2I = 60\ \text{V}$ vyšla soustava
$$\begin{bmatrix} 60 & -30 \\ -30 & 40 \end{bmatrix}\begin{bmatrix} I_\text{s1} \\ I_\text{s2} \end{bmatrix} = \begin{bmatrix} 0 \\ -70 \end{bmatrix}$$
Jaký je smyčkový proud $I_\text{s2}$?
'''
value = -2.8
tolerance = 0.005
unit = 'A'
explanation = '''
$$\Delta = 60\cdot40 - (-30)(-30) = 1500, \qquad \Delta_2 = 60\cdot(-70) - (-30)\cdot0 = -4200, \qquad I_\text{s2} = \frac{-4200}{1500} = -2{,}80\ \text{A}$$
($I_\text{s1} = -2100/1500 = -1{,}40\ \text{A}$.) Proud původního $R_2$ se pak dopočítá z 1. KZ v uzlu se zdrojem proudu: $I_{R2} = -0{,}60\ \text{A}$.
'''

[[question]]
id = 'COZ2-13'
kind = 'numeric'
topic = 'Kirchhoffovy rovnice a MSP'
source = 'COZ2, př. 2.11 (PC5, př. 5)'
text = '''
Soustava MSP se třemi smyčkami ($R_1 = 7{,}5$, $R_2 = 2{,}5$, $R_3 = 5$, $R_4 = 2$, $R_5 = 25\ \Omega$, $U_1 = 5\ \text{V}$, $U_2 = 7\ \text{V}$):
$$\begin{bmatrix} 9{,}5 & -2 & 0 \\ -2 & 32 & -25 \\ 0 & -25 & 27{,}5 \end{bmatrix}\begin{bmatrix} I_\text{s1} \\ I_\text{s2} \\ I_\text{s3} \end{bmatrix} = \begin{bmatrix} 5 \\ 0 \\ -7 \end{bmatrix}$$
Proud rezistorem $R_4$ (společný smyčkám 1 a 2) je $I_4 = I_\text{s1} - I_\text{s2}$. Kolik je?
'''
value = 1
tolerance = 0.005
unit = 'A'
explanation = '''
Sarrus: $\Delta = 9{,}5\cdot32\cdot27{,}5 - \big[9{,}5\cdot(-25)(-25) + (-2)(-2)\cdot27{,}5\big] = 8360 - (5937{,}5 + 110) = 2312{,}5$.
$$\Delta_1 = 5(880 - 625) + 2(0 - 175) = 925, \qquad \Delta_2 = 9{,}5\,(0 - 175) - 5(-55 - 0) = -1387{,}5$$
$$I_\text{s1} = \frac{925}{2312{,}5} = 0{,}4\ \text{A}, \quad I_\text{s2} = \frac{-1387{,}5}{2312{,}5} = -0{,}6\ \text{A}, \qquad I_4 = 0{,}4 + 0{,}6 = 1\ \text{A}$$
Zkouška ze slajdu: $I_2 = I_3 + I_5 = 0{,}6 + 0{,}2 = 0{,}8\ \text{A}$.
'''

[[question]]
id = 'COZ2-14'
kind = 'numeric'
topic = 'Kirchhoffovy rovnice a MSP'
source = 'COZ2, př. 2.14 (PC5, př. 8; sbírka 5.14)'
text = '''
V obvodu se dvěma zdroji $U_1 = U_2 = 8\ \text{V}$ vyšly proudy zdroji $I_1 = 0{,}3956\ \text{A}$ a $I_2 = 0{,}5726\ \text{A}$ (oba zdroje pracují jako zdroje). Jaký celkový výkon dodávají?
'''
value = 7.746
tolerance = 0.005
unit = 'W'
explanation = '''
$$P = U_1I_1 + U_2I_2 = 8\cdot0{,}3956 + 8\cdot0{,}5726 = 3{,}165 + 4{,}581 = 7{,}746\ \text{W}$$
Rezistory spotřebují $\sum RI^2 = 7{,}745\ \text{W}$; bilance výkonů sedí až na zaokrouhlení, takže proudy jsou správně.
'''

# ------------------------------------------------------------------ COZ3

[[question]]
id = 'COZ3-01'
kind = 'numeric'
topic = 'MUN ve cvičení'
source = 'COZ3, př. 3.1 (PC6, př. 1)'
text = '''
Soustava MUN ($I_\text{Z1} = 1\ \text{A}$, $I_\text{Z2} = 0{,}375\ \text{A}$, $I = 1{,}5\ \text{A}$, $R_1 = R_2 = 20\ \Omega$, $R_3 = R_4 = 40\ \Omega$):
$$\begin{bmatrix} G_1 + G_2 & -G_2 \\ -G_2 & G_2 + G_3 + G_4 \end{bmatrix}\begin{bmatrix} U_{10} \\ U_{20} \end{bmatrix} = \begin{bmatrix} I_\text{Z1} - I \\ -I_\text{Z1} - I_\text{Z2} \end{bmatrix}$$
Jaké je $U_{10}$?
'''
value = -15.83
tolerance = 0.02
unit = 'V'
explanation = '''
$$\begin{bmatrix} 0{,}1 & -0{,}05 \\ -0{,}05 & 0{,}1 \end{bmatrix}\begin{bmatrix} U_{10} \\ U_{20} \end{bmatrix} = \begin{bmatrix} -0{,}5 \\ -1{,}375 \end{bmatrix}, \qquad \Delta = 0{,}01 - 0{,}0025 = 0{,}0075$$
$$\Delta_1 = -0{,}5\cdot0{,}1 - (-0{,}05)(-1{,}375) = -0{,}118\,75, \qquad U_{10} = \frac{-0{,}118\,75}{0{,}0075} = -15{,}83\ \text{V}$$
'''

[[question]]
id = 'COZ3-02'
kind = 'numeric'
