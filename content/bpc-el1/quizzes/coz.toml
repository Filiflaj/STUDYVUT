source = 'COZ6, př. 6.11 (PC13, př. 5; sbírka 11.4)'
text = '''
Prstenec $D = 90\ \text{mm}$ (vnější), průřez 10 × 10 mm, mezera 1 mm s indukcí 0,5 T, proud 5 A. Materiál: $B$ = 0,3; 0,5; 0,7; 0,9 T odpovídá $H$ = 66; 109; 167; 262 A/m. Kolik závitů potřebuje cívka?
'''
value = 85
tolerance = 0.1
explanation = '''
$D_\text{s} = 90 - 10 = 80\ \text{mm}$, $l_\text{f} = \pi\cdot0{,}08 - 0{,}001 = 0{,}2503\ \text{m}$, $B_\text{f} = B_\text{v} = 0{,}5\ \text{T}$ → $H_\text{f} = 109\ \text{A/m}$:
$$5N = 109\cdot0{,}2503 + \frac{0{,}5}{4\pi\cdot10^{-7}}\cdot10^{-3} = 27{,}28 + 397{,}9 = 425{,}2\ \text{A} \quad\Rightarrow\quad N = 85{,}03 \doteq 85$$
'''

[[question]]
id = 'COZ6-18'
kind = 'numeric'
topic = 'Výpočet magnetických obvodů'
source = 'COZ6, př. 6.11 (PC13, př. 5)'
text = '''
Jaká je indukčnost cívky z předchozí otázky ($N = 85$, $B = 0{,}5\ \text{T}$, $S = 1\ \text{cm}^2$, $I = 5\ \text{A}$)? Výsledek v μH.
'''
value = 850
tolerance = 2
unit = 'μH'
explanation = '''
$$L = \frac{N\Phi}{I} = \frac{NB_\text{v}S}{I} = \frac{85\cdot0{,}5\cdot(10\cdot10^{-3})^2}{5} = 850\ \mu\text{H}$$
'''

[[question]]
id = 'COZ6-19'
kind = 'numeric'
topic = 'Výpočet magnetických obvodů'
source = 'COZ6, př. 6.11'
text = '''
Jakou silou je namáháno jádro v oblasti jeho jediné vzduchové mezery (indukce 0,5 T, průřez 1 cm²)?
'''
value = 9.95
tolerance = 0.03
unit = 'N'
explanation = '''
Jedna mezera, tedy plocha jen jednou:
$$F = \frac{B^2S}{2\mu_0} = \frac{0{,}5^2\cdot10^{-4}}{2\cdot4\pi\cdot10^{-7}} = 9{,}95\ \text{N}$$
'''

[[question]]
id = 'COZ6-20'
kind = 'numeric'
topic = 'Výpočet magnetických obvodů'
source = 'COZ6, př. 6.12'
text = '''
Elektromagnet z ocelolitiny: v každé ze dvou mezer délky 1 mm má být indukce 0,7 T. Jaké magnetické napětí připadá na **jednu** mezeru?
'''
value = 557
tolerance = 1
unit = 'A'
explanation = '''
$$U_\text{mv} = \frac{B}{\mu_0}l_\text{v} = \frac{0{,}7}{4\pi\cdot10^{-7}}\cdot10^{-3} = 557\ \text{A}$$
Magnetické napětí na železe (0,3 m, intenzita z křivky ocelolitiny) je proti dvěma mezerám malé, proud určují hlavně mezery.
'''

[[question]]
id = 'COZ6-21'
kind = 'numeric'
topic = 'Výpočet magnetických obvodů'
source = 'COZ6, př. 6.12'
text = '''
Jakou silou je kotva téhož elektromagnetu přitahována (dvě mezery, průřez 3 cm², indukce 0,7 T)?
'''
value = 117
tolerance = 0.5
unit = 'N'
explanation = '''
Kotva je přitahována přes dvě pólové plochy:
$$F = \frac{B^2\cdot2S}{2\mu_0} = \frac{0{,}7^2\cdot2\cdot3\cdot10^{-4}}{2\cdot4\pi\cdot10^{-7}} = 117\ \text{N}$$
'''
