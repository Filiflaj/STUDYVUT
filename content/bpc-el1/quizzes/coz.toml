$$R_\text{vst} = \frac{\Delta_1}{I\,\Delta} = \frac{1{,}001\cdot10^{-4}}{8{,}441\cdot10^{-9}} = 11{,}86\ \text{k}\Omega$$
Vstupní odpor je mnohem menší než $R_1 \parallel R_2$: zpětnovazební $R_2$ se ze vstupu jeví zmenšený asi tisíckrát (Millerův jev).
