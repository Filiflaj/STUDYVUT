[[question]]
id = 'CVPR-17'
topic = 'Periodické průběhy'
text = '''
Která hodnota střídavého proudu odpovídá stálému proudu se stejnými **tepelnými** účinky v rezistoru?
'''
options = ['efektivní', 'střední', 'střední absolutní', 'vrcholová']
answer = 0
layout = 'grid'
explanation = '''
Teplo v rezistoru je $\int Ri^2\,\mathrm{d}t$. Stálý proud $I$ dá za periodu $RI^2T$; z rovnosti vyjde $I = \sqrt{\frac1T\int i^2\,\mathrm{d}t}$, tedy efektivní hodnota (RMS).
'''
notes = [
  '',
  'Střední hodnota odpovídá přenesenému náboji, u střídavého průběhu je nulová.',
  'Střední absolutní hodnota slouží v měřicích přístrojích, teplu neodpovídá.',
  'Vrcholová hodnota trvá jen okamžik.',
]
