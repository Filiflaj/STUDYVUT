[[question]]
id = 'SS-01'
topic = 'Spojový seznam'
text = '''
Uzly jsou propojené `a -> b -> c -> NULL` s hodnotami 5, 8, 12. Nový uzel `d` s hodnotou 7 se vloží funkcí z úlohy:

```c
void vloz_za(struct Node *kam, struct Node *novy)
{
    novy->next = kam->next;
    kam->next = novy;
}

vloz_za(&b, &d);
vypis(&a);
```

Co vypíše `vypis`?
'''
options = [
  '`5 -> 8 -> 7 -> 12 -> NULL`',
  '`5 -> 7 -> 8 -> 12 -> NULL`',
  '`5 -> 8 -> 12 -> 7 -> NULL`',
  '`7 -> 5 -> 8 -> 12 -> NULL`',
]
answer = 0
explanation = '''
Nový uzel jde **za** uzel `b` (hodnota 8): `d` převezme odkaz na `c` a `b` ukáže na `d`. Seznam se netřídí, pořadí určuje jen propojení.
'''
notes = [
  '',
  'Tak by to bylo při vložení za `a`.',
  'Vkládá se za `b`, ne na konec.',
  'Na začátek by se vkládalo přes změnu hlavy.',
]

