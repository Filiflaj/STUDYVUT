[[question]]
id = 'SS-08'
topic = 'Spojový seznam'
text = '''
Ve funkci `vloz_na_konec` se hledá poslední uzel. Co se stane, když se podmínka cyklu napíše takto?

```c
struct Node *current = head;
while (current != NULL)
{
    current = current->next;
}
current->next = novy;
```
'''
options = [
  'cyklus skončí až za posledním uzlem, `current` je NULL a `current->next` program shodí',
  'nový uzel se vloží na konec, funguje to stejně',
  'nový uzel se vloží před poslední uzel',
  'cyklus se nikdy nezastaví',
]
answer = 0
explanation = '''
Pro připojení na konec se musí cyklus zastavit **na** posledním uzlu, tedy na tom, jehož `next == NULL`. Správně `while (current->next != NULL)`.
'''
notes = [
  '',
  'Za cyklem je current NULL, dereference NULL je chyba.',
  'Ukazatel na předposlední uzel se nikde neuchovává.',
  'Cyklus skončí, jen o krok později, než má.',
]

[[question]]
id = 'SS-09'
topic = 'Spojový seznam'
kind = 'numeric'
text = '''
Seznam obsahuje 4 uzly. Kolikrát se při volání `vloz_na_konec` provede krok `current = current->next`, než se najde poslední uzel?

```c
struct Node *current = head;
while (current->next != NULL)
{
    current = current->next;
}
```
'''
value = 3
tolerance = 0
explanation = '''
`current` začíná na 1. uzlu a posune se na 2., 3. a 4. Čtvrtý uzel má `next == NULL` a cyklus skončí: 3 kroky. Vkládání na konec proto trvá tím déle, čím delší je seznam. Vkládání na začátek nemusí procházet nic.
'''

[[question]]
id = 'SS-10'
