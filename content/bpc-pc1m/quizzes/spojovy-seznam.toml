[[question]]
id = 'SS-03'
topic = 'Spojový seznam'
text = '''
Co se stane, když se ve funkci `vloz_za` prohodí pořadí řádků?

```c
kam->next = novy;
novy->next = kam->next;
```
'''
options = [
  'nový uzel ukazuje sám na sebe, zbytek seznamu se ztratí a výpis se zacyklí',
  'nic, výsledek je stejný',
  'nový uzel se vloží před `kam`',
  'překladač ohlásí chybu',
]
answer = 0
explanation = '''
První řádek přepíše `kam->next` na `novy` a adresa zbytku seznamu se ztratí. Druhý řádek pak nastaví `novy->next = kam->next`, což je `novy`. Uzel ukazuje sám na sebe a `vypis` tiskne jeho hodnotu donekonečna. Proto se nejdřív napojí nový uzel na zbytek a teprve pak se na něj přesměruje předchozí uzel.
'''
notes = [
  '',
  'Pořadí rozhoduje, druhý řádek čte už přepsanou hodnotu.',
  'Pozice `kam` se nemění, rozbije se jen napojení dál.',
  'Syntakticky je kód v pořádku, chyba je v logice.',
]

[[question]]
id = 'SS-04'
topic = 'Spojový seznam'
text = '''
Co vypíše funkce `vypis` z úlohy pro prázdný seznam, `vypis(NULL)`?

```c
void vypis(struct Node *head)
{
    struct Node *current = head;
    while (current != NULL)
    {
        printf("%d -> ", current->data);
        current = current->next;
    }
    printf("NULL\n");
}
```
'''
options = ['`NULL`', 'nic', 'program spadne', '`0 -> NULL`']
answer = 0
explanation = '''
Podmínka `current != NULL` je hned nesplněná, cyklus se neprovede a vypíše se jen `NULL`. Funkce prázdný seznam zvládne bez zvláštního ošetření.
'''
notes = [
  '',
  'Řádek `printf("NULL\n")` za cyklem se provede vždy.',
  'K dereferenci `current->data` nedojde, cyklus se přeskočí.',
  'Žádný uzel s hodnotou 0 neexistuje.',
]
layout = 'grid'

