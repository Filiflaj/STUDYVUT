[[question]]
id = 'SS-06'
topic = 'Spojový seznam'
text = '''
Který řádek v této verzi funkce `uvolni` je chybný?

```c
void uvolni(struct Node *head)
{
    while (head != NULL)          // řádek A
    {
        free(head);               // řádek B
        head = head->next;        // řádek C
    }
}
```
'''
options = [
  'řádek C: čte `next` z uzlu, který už byl uvolněný',
  'řádek A: podmínka má být `head->next != NULL`',
  'řádek B: free se smí volat jen jednou za program',
  'žádný, funkce je správně',
]
answer = 0
explanation = '''
Po `free(head)` se k uzlu nesmí přistupovat, `head->next` je čtení uvolněné paměti. Správně si adresu dalšího uzlu uložit předem: `struct Node *dalsi = head->next; free(head); head = dalsi;`.
'''
notes = [
  '',
  'S `head->next != NULL` by se poslední uzel neuvolnil.',
  'Každý uzel z malloc potřebuje vlastní free.',
  'Čtení po free je nedefinované chování, i když to někdy „projde“.',
]

