  'Šipka patří k ukazateli a funkce navíc čeká celou strukturu, ne jednu položku.',
]

[[question]]
id = 'UK-08'
topic = 'Ukazatele'
kind = 'numeric'
text = '''
S funkcemi z úlohy s obdélníkem (`zvetsi` násobí obě strany číslem `k`, `prohod_strany` prohodí `a` a `b`, `obsah` vrací `a * b`):

```c
struct Obdelnik o = {3, 5};
zvetsi(&o, 3);
prohod_strany(&o);
printf("%d\n", obsah(&o));
```

Co se vypíše?
'''
value = 135
tolerance = 0
explanation = '''
Po zvětšení je obdélník $9 \times 15$, po prohození $15 \times 9$. Obsah je $15 \cdot 9 = 135$. Funkce mění původní strukturu, protože dostávají její adresu.
'''

[[question]]
id = 'UK-09'
topic = 'Ukazatele'
text = '''
Co program vypíše?

```c
int pole[] = {4, -2, 9, 0};
int *p = pole;
p++;
printf("%d %d\n", *p, p[1]);
```
'''
options = ['`-2 9`', '`4 -2`', '`5 -2`', '`-2 -2`']
answer = 0
explanation = '''
`p++` posune ukazatel o jeden prvek, na `pole[1] = -2`. `p[1]` je `*(p + 1)`, tedy `pole[2] = 9`. Index se počítá od místa, kam ukazatel právě ukazuje.
'''
notes = [
  '',
  'Ukazatel se posunul, už neukazuje na první prvek.',
  '`p++` posouvá ukazatel, nezvyšuje hodnotu. To by bylo `(*p)++`.',
  '`p[1]` je o jeden prvek za `p`, ne `p` samo.',
]
layout = 'grid'

