[[question]]
id = 'UK-11'
topic = 'Ukazatele'
text = '''
V úloze se min a max hledají ještě **před** zdvojnásobením pole. Co by program vypsal, kdyby se pořadí prohodilo?

```c
int cisla[6] = {4, -2, 9, 0, 7, -5};
zdvojnasob(cisla, 6);
min_max(cisla, 6, &nejmensi, &nejvetsi);
printf("Min: %d, max: %d\n", nejmensi, nejvetsi);
```
'''
options = ['`Min: -10, max: 18`', '`Min: -5, max: 9`', '`Min: -2, max: 9`', '`Min: 0, max: 18`']
answer = 0
explanation = '''
`zdvojnasob` dostane adresu pole a mění **původní** prvky přes `*(p + i)`. Po něm je v poli 8, −4, 18, 0, 14, −10, takže min je −10 a max 18.
'''
notes = [
  '',
  'Tak to vypíše program z úlohy, kde se hledá před zdvojnásobením.',
  'Nejmenší je −5 (po zdvojnásobení −10), ne −2.',
  'min_max začíná prvním prvkem a najde i záporná čísla.',
]

[[question]]
id = 'UK-12'
topic = 'Ukazatele'
text = '''
Který řádek obsahuje chybu?

```c
int x;
int *p = &x;          // řádek A
scanf("%d", p);       // řádek B
scanf("%d", x);       // řádek C
printf("%d\n", *p);   // řádek D
```
'''
options = ['řádek C', 'řádek A', 'řádek B', 'řádek D']
answer = 0
explanation = '''
`scanf` potřebuje **adresu**, kam má číslo zapsat. Řádek C předá hodnotu `x` (navíc zatím nenastavenou) a scanf by zapisoval na nesmyslnou adresu. Správně `scanf("%d", &x)`. Řádek B je v pořádku, protože `p` adresu `x` už obsahuje.
'''
notes = [
  '',
  'Ukazatel se inicializuje adresou proměnné, to je správně.',
  '`p` je adresa `x`, takže `&` už se nepíše.',
  'Dereference `p` dá hodnotu `x`, správně.',
]
