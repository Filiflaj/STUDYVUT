name = 'Ukazatele'
description = '&, *, aritmetika ukazatelů, pole, ->'

[[question]]
id = 'UK-01'
topic = 'Ukazatele'
kind = 'numeric'
text = '''
Co program vypíše?

```c
int a = 5;
int *p = &a;
*p = 8;
printf("%d\n", a);
```
'''
value = 8
tolerance = 0
explanation = '''
`p` obsahuje adresu `a`. Zápis `*p = 8` uloží 8 na tuto adresu, tedy přímo do `a`.
'''

[[question]]
id = 'UK-02'
topic = 'Ukazatele'
text = '''
Co program vypíše?

```c
void prohod1(int x, int y)   { int t = x;  x = y;   y = t; }
void prohod2(int *x, int *y) { int t = *x; *x = *y; *y = t; }

int main()
{
    int a = 1, b = 2;
    prohod1(a, b);
    printf("%d %d\n", a, b);
    prohod2(&a, &b);
    printf("%d %d\n", a, b);
    return 0;
}
```
'''
options = [
  '`1 2` a pod tím `2 1`',
  '`2 1` a pod tím `1 2`',
  '`2 1` a pod tím `2 1`',
  '`1 2` a pod tím `1 2`',
]
answer = 0
explanation = '''
`prohod1` dostane kopie hodnot a prohodí jen je, `a` a `b` se nezmění. `prohod2` dostane **adresy** a přes `*x`, `*y` zapisuje přímo do `a` a `b`.
'''
notes = [
  '',
  'Opačně: předání hodnotou nic nezmění, předání adresy ano.',
  'První volání pracuje s kopiemi.',
  'Druhé volání přes ukazatele proměnné opravdu prohodí.',
]

[[question]]
id = 'UK-03'
topic = 'Ukazatele'
text = '''
Co program vypíše?

```c
int pole[5] = {10, 20, 30, 40, 50};
int *p = pole;
printf("%d %d\n", *(p + 2), *p + 2);
```
'''
options = ['`30 12`', '`30 30`', '`12 12`', '`20 12`']
answer = 0
explanation = '''
`*(p + 2)` je prvek o dva dál než `p`, tedy `pole[2] = 30`. Ve výrazu `*p + 2` má dereference přednost: `*p` je 10, plus 2 je 12.
'''
notes = [
  '',
  'Bez závorek se nejdřív dereferencuje, pak přičítá.',
  '`*(p + 2)` posouvá ukazatel, nepřičítá k hodnotě.',
  '`p + 2` je třetí prvek (indexy od 0), ne druhý.',
]

[[question]]
id = 'UK-04'
topic = 'Ukazatele'
kind = 'numeric'
text = '''
`int *p` ukazuje na `pole[0]` pole typu `int` (4 bajty). O kolik **bajtů** je adresa `p + 3` větší než adresa `p`?
'''
value = 12
tolerance = 0
unit = 'B'
explanation = '''
Aritmetika ukazatelů počítá v **prvcích**: `p + 3` je o 3 prvky dál, tedy o $3 \cdot \text{sizeof(int)} = 3 \cdot 4 = 12$ bajtů.
'''

[[question]]
id = 'UK-05'
topic = 'Ukazatele'
text = '''
Předpokládej 64bitový systém (`int` 4 B, ukazatel 8 B). Co vypíše program?

```c
void f(int *p)
{
    printf("%zu\n", sizeof(p));
}

int main()
{
    int cisla[6] = {4, -2, 9, 0, 7, -5};
    printf("%zu\n", sizeof(cisla));
    f(cisla);
    return 0;
}
```
'''
options = ['`24` a pod tím `8`', '`24` a pod tím `24`', '`6` a pod tím `6`', '`8` a pod tím `8`']
answer = 0
explanation = '''
V `main` je `cisla` opravdové pole: $6 \cdot 4 = 24$ B. Do funkce se ale předá jen adresa prvního prvku, `p` je ukazatel a `sizeof(p)` je velikost adresy, 8 B. Proto se délka pole posílá do funkce zvlášť.
'''
notes = [
  '',
  'Ve funkci už není pole, jen ukazatel.',
  'sizeof vrací bajty, ne počet prvků.',
  'V main dá sizeof velikost celého pole.',
]

[[question]]
id = 'UK-06'
topic = 'Ukazatele'
text = '''
`o` je typu `struct Obdelnik *`. Který zápis **není** správný přístup k položce `a`?
'''
options = ['`*o.a`', '`o->a`', '`(*o).a`', '`o[0].a`']
answer = 0
explanation = '''
Tečka má vyšší prioritu než `*`, takže `*o.a` se čte jako `*(o.a)`. Na ukazatel ale tečka použít nejde, překladač ohlásí chybu. `o->a` je zkratka pro `(*o).a`.
'''
notes = [
  '',
  'Šipka je správný a nejčastější zápis.',
  'Se závorkami se nejdřív dereferencuje, pak bere položka.',
  '`o[0]` je totéž co `*o`, takže je to správně, i když neobvyklé.',
]
layout = 'grid'

