[[question]]
id = 'ZF-01'
topic = 'Zásobník a fronta'
text = '''
S knihovnami z úlohy (zásobník `push`/`pop`, fronta `enqueue`/`dequeue`) se provede:

```c
push(1); push(2); push(3);
printf("%d ", pop());
printf("%d\n", pop());

enqueue(1); enqueue(2); enqueue(3);
printf("%d ", dequeue());
printf("%d\n", dequeue());
```

Co se vypíše?
'''
options = [
  '`3 2` a pod tím `1 2`',
  '`1 2` a pod tím `3 2`',
  '`3 2` a pod tím `3 2`',
  '`1 2` a pod tím `1 2`',
]
answer = 0
explanation = '''
Zásobník je **LIFO**: první vyjde poslední vložená hodnota (3, pak 2). Fronta je **FIFO**: první vyjde první vložená (1, pak 2).
'''
notes = [
  '',
  'Prohozené chování zásobníku a fronty.',
  'Fronta vydává v pořadí vložení.',
  'Zásobník vydává od vrcholu, tedy pozpátku.',
]

[[question]]
id = 'ZF-02'
topic = 'Zásobník a fronta'
text = '''
Zásobník je pole `stack[MAX]` s indexem vrcholu `top`, prázdný zásobník má `top = -1`. Která podmínka v `push` správně pozná **plný** zásobník?
'''
options = ['`top == MAX - 1`', '`top == MAX`', '`top == 0`', '`top > MAX`']
answer = 0
explanation = '''
Platné indexy pole jsou 0 až `MAX - 1`. Když `top` ukazuje na poslední políčko, další `top++` by zapsalo mimo pole.
'''
notes = [
  '',
  'Index `MAX` je už mimo pole. Při této podmínce by se jeden zápis provedl za konec pole.',
  '`top == 0` znamená, že v zásobníku je jeden prvek.',
  'Tahle podmínka by se splnila až dávno po přetečení.',
]
layout = 'grid'

[[question]]
id = 'ZF-03'
topic = 'Zásobník a fronta'
kind = 'numeric'
text = '''
Kruhová fronta má `MAX = 5`, na začátku `front = 0`, `rear = -1`, `count = 0`. Vkládá se `rear = (rear + 1) % MAX`, vybírá se `front = (front + 1) % MAX`.

Provede se 5× `enqueue`, 2× `dequeue` a znovu 1× `enqueue`. Jakou hodnotu má po posledním vložení `rear`?
'''
value = 0
tolerance = 0
explanation = '''
Pět vložení: `rear` = 0, 1, 2, 3, 4. Dva výběry posunou `front` na 2. Další vložení: $\text{rear} = (4 + 1) \bmod 5 = 0$. Nová hodnota jde na první políčko, které se výběrem uvolnilo. Proto se fronta jmenuje kruhová.
'''

