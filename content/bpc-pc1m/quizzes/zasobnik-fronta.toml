  'pop() při prázdném zásobníku program ukončí',
  'stackIsEmpty() zásobník zároveň vyprázdní',
  'pop() vrací −1 vždy, když je v zásobníku jeden prvek',
]
answer = 0
explanation = '''
Knihovna ukládá `int`. Pro znaky příkazů by −1 nevadila, ale obecně je to platné číslo. Test `stackIsEmpty()` (vrací výsledek `top == -1`) prázdný zásobník pozná vždy a hláška se nevypíše.
