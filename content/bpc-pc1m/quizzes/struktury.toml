name = 'Struktury'
description = 'struct, typedef, enum, switch, union'

[[question]]
id = 'ST-01'
topic = 'Struktury'
text = '''
Co program vypíše?

```c
typedef struct
{
    int x;
    int y;
} Bod;

int main()
{
    Bod a = {1, 2};
    Bod b = a;
    b.x = 10;
    printf("%d %d\n", a.x, b.x);
    return 0;
}
```
'''
options = ['`1 10`', '`10 10`', '`1 1`', '`10 1`']
answer = 0
explanation = '''
Přiřazení `Bod b = a;` **zkopíruje** všechny položky. `a` a `b` jsou dvě samostatné struktury, změna `b.x` se `a` netýká.
'''
notes = [
  '',
  'Struktury se nesdílejí jako u ukazatelů, `b` je kopie.',
  '`b.x` se po kopii přepsalo na 10.',
  'Prohozené pořadí: vypisuje se nejdřív `a.x`.',
]

[[question]]
id = 'ST-02'
topic = 'Struktury'
text = '''
Pole knih z úlohy (`nazev`, `pocetStran`, `cena`):

```c
Kniha knihy[4] =
{
    {"C", 240, 349.0f},
    {"Algoritmy", 520, 699.0f},
    {"Git", 180, 299.0f},
    {"Linux", 410, 549.0f}
};
printf("%c %d\n", knihy[2].nazev[0], knihy[3].pocetStran / 2);
```

Co se vypíše?
'''
options = ['`G 205`', '`A 260`', '`G 205.0`', '`L 90`']
answer = 0
explanation = '''
Indexy jsou od nuly: `knihy[2]` je Git, `nazev[0]` je jeho první znak `G`. `knihy[3]` je Linux se 410 stranami, celočíselné dělení $410 / 2 = 205$.
'''
notes = [
  '',
  'To by byl `knihy[1]` a `knihy[0]`, indexuje se od nuly.',
  '`%d` a dělení dvou `int` dá celé číslo bez desetinné části.',
  'Linux je `knihy[3]`, jeho název se netiskne. Git má 180 stran, ale tiskne se Linux.',
]

[[question]]
id = 'ST-03'
topic = 'Struktury'
text = '''
Co vypíše poslední řádek úlohy s knihami?

```c
int nejdrazsi = 0;
knihy[1].cena = knihy[1].cena + 50;

for (int i = 1; i < 4; i++)
{
    if (knihy[i].cena > knihy[nejdrazsi].cena)
    {
        nejdrazsi = i;
    }
}
printf("Nejdrazsi: %s (%.2f Kc)\n", knihy[nejdrazsi].nazev, knihy[nejdrazsi].cena);
```

(ceny jsou 349, 699, 299 a 549 Kč)
'''
options = [
  '`Nejdrazsi: Algoritmy (749.00 Kc)`',
  '`Nejdrazsi: Algoritmy (699.00 Kc)`',
  '`Nejdrazsi: Linux (549.00 Kc)`',
  '`Nejdrazsi: 1 (749.00 Kc)`',
]
answer = 0
explanation = '''
Před hledáním se Algoritmům přičte 50 Kč, mají tedy 749 Kč. Cyklus si pamatuje **index** nejdražší knihy (1), a z něj vypíše název i cenu. `%.2f` dá dvě desetinná místa.
'''
notes = [
  '',
  'Cena se zvýšila ještě před hledáním a vypisuje se nová hodnota.',
  'Linux je dražší než C a Git, ale ne než Algoritmy.',
  '`%s` vypíše řetězec `nazev`, ne index.',
]

