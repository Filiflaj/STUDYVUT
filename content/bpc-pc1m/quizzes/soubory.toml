text = '''
Program má do souboru `log.txt` každým spuštěním **připsat** jeden řádek a nesmí smazat předchozí řádky. Který režim pro `fopen` použije?
'''
options = ['`"a"`', '`"w"`', '`"r"`', '`"r+"`']
answer = 0
explanation = '''
`"a"` (append) zapisuje na konec souboru. Když soubor neexistuje, vytvoří ho.
'''
notes = [
  '',
  '`"w"` by při každém spuštění smazal předchozí obsah.',
  '`"r"` je jen pro čtení.',
  '`"r+"` zapisuje od začátku (přepisuje) a když soubor neexistuje, vrátí NULL.',
]
layout = 'grid'

[[question]]
id = 'SO-03'
topic = 'Soubory'
text = '''
