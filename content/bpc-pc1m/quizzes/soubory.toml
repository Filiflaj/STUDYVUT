[[question]]
id = 'SO-01'
topic = 'Soubory'
text = '''
Soubor `jmena.txt` už existuje a obsahuje 5 jmen. Program ho otevře příkazem `fopen("jmena.txt", "w")`. Co se stane s původním obsahem?
'''
options = [
  'smaže se, soubor začíná prázdný',
  'zůstane a nová data se připíšou na konec',
  'fopen vrátí NULL, protože soubor už existuje',
  'zůstane a nová data přepíší jen začátek souboru',
]
answer = 0
explanation = '''
Režim `"w"` soubor vytvoří, nebo existující soubor **zkrátí na nulu**. Připisování na konec je režim `"a"`.
'''
notes = [
  '',
  'To dělá režim `"a"` (append).',
  'Pro `"w"` existence souboru nevadí. NULL vrací hlavně `"r"`, když soubor chybí.',
  'Obsah se při otevření smaže celý, ne jen přepisovaná část.',
]

[[question]]
id = 'SO-02'
