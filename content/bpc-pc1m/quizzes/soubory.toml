  'fclose soubor smaže, aby se dal znovu vytvořit',
  'nemá to význam, je to jen zvyk',
]
answer = 0
explanation = '''
Zápis jde nejdřív do vyrovnávací paměti (bufferu) a na disk se dostane při jejím zaplnění nebo při `fclose`. Navíc režim `"w"` je jen pro zápis. Zavření a otevření pro čtení zajistí, že se načte všech 5 jmen od začátku.
'''
notes = [
