Jméno bez cesty se hledá v **pracovním adresáři**, tedy ve složce, ze které se program spustil. Proto se před spuštěním přepíná `cd zadani1_cisla`. Díky testu `soubor == NULL` program skončí s hláškou místo pádu.
'''
notes = [
