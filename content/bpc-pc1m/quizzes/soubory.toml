  'Rozhoduje pracovní adresář, ne umístění spustitelného souboru.',
  'Program normálně běží, jen fopen selže.',
]

[[question]]
id = 'SO-04'
topic = 'Soubory'
kind = 'numeric'
text = '''
Soubor `data.txt` obsahuje

```
10 25
16 abc 7
```

Kolik čísel načte tento cyklus (jakou hodnotu bude mít `pocet`)?

```c
while (fscanf(soubor, "%d", &cislo) == 1)
{
    pocet++;
    soucet = soucet + cislo;
}
```
'''
value = 3
tolerance = 0
explanation = '''
`fscanf` vrací počet úspěšně načtených položek. Načte 10, 25 a 16. Na slově `abc` vrátí 0, protože to není číslo, a cyklus skončí. Sedmička za ním se už nepřečte (součet je 51).
'''

[[question]]
id = 'SO-05'
topic = 'Soubory'
text = '''
Co se stane, když se v cyklu ze SO-04 změní podmínka na `while (fscanf(soubor, "%d", &cislo) != EOF)` a soubor obsahuje slovo `abc`?
'''
options = [
  'cyklus poběží donekonečna, fscanf na `abc` pořád vrací 0 a nic nepřečte',
  'slovo `abc` se přeskočí a načte se i sedmička',
  'nic se nezmění, cyklus skončí na `abc`',
  'program skončí chybou překladu',
]
answer = 0
explanation = '''
Na nečíselném textu `fscanf` vrátí 0 (ne `EOF`) a ze souboru nic neodebere. Další pokus skončí stejně, podmínka `!= EOF` je pořád splněná a cyklus se nezastaví. Navíc se pořád přičítá stará hodnota `cislo`. Proto `== 1`.
'''
notes = [
  '',
  '`%d` slovo nepřeskočí, zůstane ve vstupu.',
  '0 se od `EOF` liší, takže `!= EOF` cyklus neukončí.',
  'Kód se přeloží, chyba je v logice.',
]

[[question]]
id = 'SO-06'
topic = 'Soubory'
text = '''
Proč je v kopírování po znacích proměnná `znak` typu `int`, a ne `char`?

```c
int znak;
while ((znak = fgetc(vstup)) != EOF)
{
    fputc(znak, kopie);
}
```
'''
options = [
  'fgetc vrací int, aby šlo odlišit EOF od všech 256 možných hodnot bajtu',
  'char by nestačil na písmena s diakritikou',
  'fputc přijímá jen int, char by nešel předat',
  'je to jedno, s char by program fungoval stejně na každém systému',
]
answer = 0
explanation = '''
`EOF` je záporná konstanta (obvykle −1) mimo rozsah hodnot bajtu. Uložením do `char` by splynula se skutečným bajtem: podle platformy by cyklus skončil předčasně na bajtu 255, nebo by neskončil nikdy.
'''
notes = [
  '',
  'Diakritika s tím nesouvisí, jde o odlišení konce souboru.',
  'char se na int převede automaticky, předat by šel.',
  'Právě na tom se programy na různých systémech liší.',
]

[[question]]
id = 'SO-07'
topic = 'Soubory'
kind = 'numeric'
text = '''
Program zapíše do souboru:

```c
fputs("Ahoj", f);
fputs("\n", f);
fputs("svete", f);
```

Soubor zavře, znovu otevře pro čtení a přečte ho znak po znaku cyklem s `fgetc` až do `EOF`. Kolik znaků načte?
'''
value = 10
tolerance = 0
unit = 'znaků'
explanation = '''
`Ahoj` (4) + konec řádku `\n` (1) + `svete` (5) = 10. `fputs` nic dalšího nepřidává, ani konec řádku na konec souboru.
'''

[[question]]
id = 'SO-08'
topic = 'Soubory'
text = '''
Proč ve výpisu jmen chybí `\n` ve formátu?

```c
while (fgets(radek, sizeof(radek), soubor) != NULL)
{
    poradi++;
    printf("%d. %s", poradi, radek);
}
```
'''
options = [
  'fgets ukládá i znak konce řádku, takže `radek` už `\n` obsahuje',
  'printf přidává konec řádku za `%s` automaticky',
  'je to chyba, jména se vypíšou za sebou na jeden řádek',
  'fgets čte jen jedno slovo, konec řádku pak doplní fclose',
]
answer = 0
explanation = '''
`fgets` čte do konce řádku **včetně** `\n` (nejvýš `sizeof(radek) - 1` znaků). Druhé `\n` ve formátu by udělalo mezi jmény prázdné řádky.
'''
notes = [
  '',
  'printf nic nepřidává, vypíše přesně formát.',
  'Jména jsou pod sebou, protože `\n` je v řetězci `radek`.',
  'fgets čte celý řádek i s mezerami, jedno slovo čte `scanf("%s")`.',
]

[[question]]
id = 'SO-09'
topic = 'Soubory'
text = '''
Hledání maxima se změní tak, že `nejvetsi` začíná nulou:

```c
int nejvetsi = 0;
while (fscanf(soubor, "%d", &cislo) == 1)
{
    if (cislo > nejvetsi)
    {
        nejvetsi = cislo;
    }
}
printf("Nejvetsi cislo: %d\n", nejvetsi);
```

Co se vypíše pro soubor s čísly −15, −3, −42, −8?
'''
options = ['`Nejvetsi cislo: 0`', '`Nejvetsi cislo: -3`', '`Nejvetsi cislo: -42`', '`Nejvetsi cislo: -15`']
answer = 0
explanation = '''
Žádné číslo není větší než 0, podmínka se nikdy nesplní a zůstane počáteční nula, která v souboru vůbec není. Program z úlohy proto začíná prvním načteným číslem (`if (pocet == 0 || cislo > nejvetsi)`) a vypíše správně −3.
'''
notes = [
  '',
  'To vypíše správná verze, která začíná prvním číslem.',
  'To je minimum.',
  'To je první číslo, ale není největší.',
]

