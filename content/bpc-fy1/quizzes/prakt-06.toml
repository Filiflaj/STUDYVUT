name = 'Úvod do měření: vyhodnocení závislostí'
description = 'směrnice, metoda nejmenších čtverců, linearizace a zásady grafů'

[[question]]
id = 'P06-01'
kind = 'numeric'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.1'
tags = ["pocty"]
text = '''
Na přímce proložené voltampérovou charakteristikou odečtete body $(40\ \mathrm{mA};\ 1{,}20\ \mathrm{V})$ a $(190\ \mathrm{mA};\ 5{,}70\ \mathrm{V})$. Jaká je směrnice (odpor)?
'''
value = 30.0
tolerance = 0.1
unit = 'Ω'
explanation = '''
Směrnice se počítá z hodnot na osách, s jednotkami:
$$b = \frac{U_2 - U_1}{I_2 - I_1} = \frac{5{,}70 - 1{,}20}{0{,}190 - 0{,}040}\ \frac{\mathrm{V}}{\mathrm{A}} = \frac{4{,}50\ \mathrm{V}}{0{,}150\ \mathrm{A}} = 30{,}0\ \Omega$$
'''

[[question]]
id = 'P06-02'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.1'
text = '''
Proč se směrnice přímky z grafu nepočítá jako $\operatorname{tg}\alpha$ úhlu změřeného úhloměrem na papíře?
'''
options = [
  'Úhloměr je nepřesný.',
  'Tangens platí jen pro přímky procházející počátkem.',
  'Osy mají obvykle různá měřítka, takže úhel závisí na zvoleném měřítku, směrnice z hodnot na osách ne.',
  'Tangens dá směrnici ve stupních.',
]
answer = 2
explanation = '''
$b = \operatorname{tg}\alpha$ platí jen při **stejném měřítku obou os**. Tatáž závislost nakreslená v jiném měřítku má jiný sklon, ale $b = (y_2 - y_1)/(x_2 - x_1)$ z hodnot na osách vyjde stejně, i s jednotkou.
'''
notes = [
  'Problém není přesnost úhloměru, ale měřítka os.',
  'Na posunutí přímky sklon nezávisí; vadí různá měřítka os.',
  '',
  'Tangens je číslo, problém je, že úhel závisí na měřítku.',
]

