[[question]]
id = 'P06-04'
kind = 'numeric'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.1'
tags = ["pocty"]
text = '''
Body $x = 1, 2, 3, 4, 5$ a $y = 2{,}1;\ 3{,}9;\ 6{,}2;\ 7{,}8;\ 10{,}0$ proložte přímkou $y = a + bx$ metodou nejmenších čtverců. Jaká je směrnice $b$?
'''
value = 1.97
tolerance = 0.005
explanation = '''
$\bar x = 3$, $\bar y = 30{,}0/5 = 6{,}0$. Odchylky $x_i - \bar x$: $-2, -1, 0, 1, 2$; $y_i - \bar y$: $-3{,}9;\ -2{,}1;\ 0{,}2;\ 1{,}8;\ 4{,}0$.
$$\sum (x_i - \bar x)(y_i - \bar y) = 7{,}8 + 2{,}1 + 0 + 1{,}8 + 8{,}0 = 19{,}7 \qquad \sum (x_i - \bar x)^2 = 10$$
$$b = \frac{19{,}7}{10} = 1{,}97$$
'''

[[question]]
id = 'P06-05'
kind = 'numeric'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.1'
tags = ["pocty"]
text = '''
Pro tytéž body ($x = 1, 2, 3, 4, 5$; $y = 2{,}1;\ 3{,}9;\ 6{,}2;\ 7{,}8;\ 10{,}0$) vyšla metodou nejmenších čtverců směrnice $b = 1{,}97$. Jaký je úsek $a$?
'''
value = 0.09
tolerance = 0.005
explanation = '''
Přímka nejmenších čtverců prochází bodem $(\bar x, \bar y)$:
$$a = \bar y - b\,\bar x = 6{,}0 - 1{,}97\cdot3 = 6{,}0 - 5{,}91 = 0{,}09$$
'''

[[question]]
id = 'P06-06'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.1'
text = '''
Proč je potřeba vyřadit hrubé chyby ještě před použitím metody nejmenších čtverců?
'''
options = [
  'Metoda neumí pracovat s více než deseti body.',
  'Odchylky se v ní umocňují na druhou, takže jeden vzdálený bod přímku silně stáhne k sobě.',
  'Hrubá chyba změní jen úsek, směrnici ne.',
  'Metoda nejmenších čtverců hrubé chyby vyřadí sama.',
]
answer = 1
explanation = '''
Metoda minimalizuje **součet čtverců** odchylek. Bod s velkou odchylkou přispívá jejím čtvercem, a proto výsledek výrazně zkreslí. Dobré výsledky dává při normálním rozdělení chyb, hrubé chyby se vyřadí dřív.
'''
notes = [
  'Počet bodů omezený není.',
  '',
  'Vzdálený bod změní obvykle obojí.',
  'Metoda bere všechny body, které jí dáte, i ty špatné.',
]

[[question]]
id = 'P06-07'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.2'
text = '''
Ověřujete závislost $y = a\,\mathrm{e}^{bx}$. Co vynesete do grafu s lineárními osami, aby vyšla přímka?
'''
options = [
  '$\ln y$ proti $\ln x$',
  '$y$ proti $\ln x$',
  '$\ln y$ proti $x$',
  '$y^2$ proti $x$',
]
answer = 2
explanation = '''
Zlogaritmováním: $\ln y = \ln a + bx$. Po dosazení $Y = \ln y$ je to přímka v proměnné $x$ se směrnicí $b$ (semilogaritmický graf).
'''
notes = [
  'Logaritmus obou veličin linearizuje mocninnou závislost $y = ax^b$.',
  'Takto by šla linearizovat závislost $y = a + b\ln x$.',
  '',
  'Kvadrát exponenciálu přímkou neudělá.',
]

[[question]]
id = 'P06-08'
kind = 'numeric'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.2'
tags = ["pocty"]
text = '''
V grafu $\ln y$ proti $x$ odečtete na proložené přímce body $x_1 = 1{,}0\ \mathrm{cm}$, $\ln y_1 = 4{,}20$ a $x_2 = 6{,}0\ \mathrm{cm}$, $\ln y_2 = 1{,}50$. Jaký je koeficient $b$ v $y = a\,\mathrm{e}^{bx}$?
'''
value = -0.54
tolerance = 0.005
unit = 'cm⁻¹'
sign_hint = 'Závislost klesá, proto je b záporné.'
explanation = '''
$$b = \frac{\ln y_2 - \ln y_1}{x_2 - x_1} = \frac{1{,}50 - 4{,}20}{(6{,}0 - 1{,}0)\ \mathrm{cm}} = \frac{-2{,}70}{5{,}0\ \mathrm{cm}} = -0{,}540\ \mathrm{cm^{-1}}$$
Logaritmus je bezrozměrný, jednotka $b$ je převrácená jednotka $x$.
'''

[[question]]
id = 'P06-09'
kind = 'numeric'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.2'
tags = ["pocty"]
text = '''
Na semilogaritmickém papíře (svislá osa v dekadických logaritmech) leží na proložené přímce body s $\log y_1 = 1{,}85$ při $t_1 = 2{,}0\ \mathrm{s}$ a $\log y_2 = 0{,}95$ při $t_2 = 8{,}0\ \mathrm{s}$. Jaký je koeficient $b$ v $y = a\,\mathrm{e}^{bt}$?
'''
value = -0.345
tolerance = 0.003
unit = 's⁻¹'
sign_hint = 'Závislost klesá, proto je b záporné.'
explanation = '''
Osa je v dekadických logaritmech, exponenciála má základ $\mathrm{e}$, proto se násobí $\ln 10 \doteq 2{,}303$:
$$b = \frac{\log y_2 - \log y_1}{t_2 - t_1}\cdot\ln 10 = \frac{0{,}95 - 1{,}85}{6{,}0\ \mathrm{s}}\cdot2{,}303 = -0{,}150\cdot2{,}303\ \mathrm{s^{-1}} = -0{,}345\ \mathrm{s^{-1}}$$
'''
warning = 'Bez násobení ln 10 vyjde −0,150 s⁻¹, což je špatně.'

[[question]]
id = 'P06-10'
kind = 'numeric'
topic = 'Vyhodnocení závislostí'
source = 'Úvod do měření, 4.2'
tags = ["pocty"]
text = '''
V logaritmickém grafu výkonu $P$ vyzařovaného vláknem v závislosti na teplotě $T$ leží na proložené přímce body $(800\ \mathrm{K};\ 0{,}50\ \mathrm{W})$ a $(1350\ \mathrm{K};\ 4{,}0\ \mathrm{W})$. Jaký exponent $b$ v $P = a\,T^b$ z nich vyjde?
'''
value = 3.97
tolerance = 0.02
explanation = '''
V log–log grafu je směrnice exponent:
$$b = \frac{\log 4{,}0 - \log 0{,}50}{\log 1350 - \log 800} = \frac{\log 8}{\log 1{,}6875} = \frac{0{,}903}{0{,}227} = 3{,}97$$
To dobře souhlasí se Stefanovým–Boltzmannovým zákonem ($P \sim T^4$).
'''

