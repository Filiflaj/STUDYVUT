]

[[question]]
id = 'P03-15'
topic = 'Fyzikální veličiny a jednotky'
source = 'Úvod do měření, kap. 1 a 4'
text = '''
Záhlaví sloupce tabulky je „$t$ / s“. Co je ve sloupci?
'''
options = [
  'Čísla: časy vydělené sekundou, tedy číselné hodnoty času v sekundách.',
  'Časy na sekundu, tedy rychlost.',
  'Časy, jednotku je potřeba připsat ke každému číslu.',
  'Převrácené hodnoty časů.',
]
answer = 0
explanation = '''
Z $X = \{X\}[X]$ plyne $\{X\} = X/[X]$. Zápis „$t$ / s“ říká, že ve sloupci jsou **čísla** vzniklá vydělením času sekundou. Stejně se popisují osy grafů.
'''
notes = [
  '',
  'Lomítko tu není „za sekundu“, ale vydělení veličiny její jednotkou.',
  'Jednotka v záhlaví platí pro celý sloupec, k číslům se nepíše.',
  'Převrácenou hodnotu by značil zápis $1/t$.',
]
