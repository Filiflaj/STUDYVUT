[[question]]
id = 'P02-01'
topic = 'Praktikum: bezpečnost a laboratorní řád'
source = 'Laboratorní řád'
tags = ["pred-praktikem"]
text = '''
Do kdy musíte mít složenou zkoušku z bezpečnostních předpisů a první pomoci při úrazech elektrickým proudem?
'''
options = [
  'Před prvním cvičením praktika.',
  'Do konce 3. týdne prvního semestru studia.',
  'Do konce prvního semestru.',
  'Před zkouškou z Fyziky 1.',
]
answer = 1
explanation = '''
Podle laboratorního řádu (a směrnice děkana) musí mít všichni studenti zkoušku z bezpečnostních předpisů a z první pomoci při úrazech elektřinou **do konce 3. týdne prvního semestru**. Potvrzení musí být v informačním systému.
'''
notes = [
  'Na prvních cvičeních se s předpisy teprve seznamujete, zkouška má termín později.',
  '',
  'Termín je mnohem dřív, do konce 3. týdne.',
  'Bez zkoušky z bezpečnosti nesmíte v laboratoři pracovat celý semestr.',
]

[[question]]
id = 'P02-02'
topic = 'Praktikum: bezpečnost a laboratorní řád'
source = 'Laboratorní řád'
tags = ["pred-praktikem"]
text = '''
Kdy smíte zapojený elektrický obvod připojit ke zdroji?
'''
options = [
  'Kdykoli, pokud má zdroj proudovou ochranu.',
  'Hned, jakmile je zapojený podle schématu.',
  'Až po kontrole spolupracovníkem ze skupiny.',
  'Až když zapojení zkontroluje a schválí vyučující.',
]
answer = 3
explanation = '''
Zapojení musí **schválit vyučující dřív, než obvod připojíte k jakémukoli zdroji**. Chrání to vás i přístroje. Kdo to poruší, riskuje, že bude platit škodu.
'''
notes = [
  'Proudová ochrana nenahrazuje kontrolu zapojení vyučujícím.',
  'I zapojení „podle schématu“ musí zkontrolovat vyučující.',
  'Kontrolu dělá vyučující, ne spolužák.',
  '',
]

[[question]]
id = 'P02-03'
topic = 'Praktikum: bezpečnost a laboratorní řád'
source = 'Úvod do měření, 5.4'
tags = ["pred-praktikem"]
text = '''
Co rozhoduje o tom, jak nebezpečný je úraz elektrickým proudem?
'''
options = ['Velikost napětí zdroje.', 'Proud, který projde tělem.', 'Výkon zdroje.', 'Polarita zdroje.']
answer = 1
explanation = '''
Rozhoduje **proud procházející tělem**, ne napětí. Nebezpečné napětí proto není pevné číslo (někdy 200 V, jindy 50 V): závisí na odporu kůže (s vlhkostí klesá), na objemovém odporu těla a na časovém průběhu proudu.
'''
notes = [
  'Napětí rozhoduje jen nepřímo, přes odpor těla.',
  '',
  'Výkon zdroje neurčuje, kolik proudu projde tělem.',
  'Polarita stejnosměrného zdroje na nebezpečnosti nic nemění.',
]

[[question]]
id = 'P02-04'
topic = 'Praktikum: bezpečnost a laboratorní řád'
source = 'Úvod do měření, 5.4'
tags = ["pred-praktikem"]
text = '''
Jaký proud se podle Úvodu do měření považuje za bezpečný?
'''
options = [
  'Stejnosměrný do 3,5 mA, střídavý do 10 mA.',
  'Stejnosměrný i střídavý do 50 mA.',
  'Stejnosměrný do 10 mA, střídavý do 100 Hz do 3,5 mA.',
  'Jakýkoli proud ze zdroje do 230 V.',
]
answer = 2
explanation = '''
Za bezpečný se považuje **stejnosměrný proud do 10 mA** a **střídavý proud o kmitočtu do 100 Hz do 3,5 mA**. Střídavý proud síťového kmitočtu je nebezpečnější, proto je jeho mez nižší.
'''
notes = [
  'Hodnoty jsou přehozené: přísnější mez platí pro střídavý proud.',
  'Takový proud už je nebezpečný.',
  '',
  'Rozhoduje proud, ne napětí zdroje, a 230 V ze sítě je životu nebezpečné.',
]

[[question]]
id = 'P02-05'
topic = 'Praktikum: bezpečnost a laboratorní řád'
source = 'Úvod do měření, 5.4'
tags = ["pred-praktikem"]
text = '''
Který z proudů o stejné velikosti je pro člověka nejnebezpečnější?
'''
options = ['Stejnosměrný.', 'Střídavý o kmitočtu 100 kHz.', 'Všechny stejně.', 'Střídavý o kmitočtu 50 Hz.']
answer = 3
explanation = '''
Střídavý proud **50 Hz** je mnohem nebezpečnější než stejnosměrný proud téže velikosti. Proudy vyšších kmitočtů mají menší účinky. Kmitočty běžně používané v praxi jsou bohužel právě ty nejškodlivější.
'''
notes = [
  'Stejnosměrný proud téže velikosti je méně nebezpečný než síťový střídavý.',
  'Účinky proudů vysokých kmitočtů jsou menší.',
  'Na časovém průběhu proudu záleží.',
  '',
]

[[question]]
id = 'P02-06'
topic = 'Praktikum: bezpečnost a laboratorní řád'
source = 'Úvod do měření, 5.4'
tags = ["pred-praktikem"]
text = '''
V jakém pořadí se postupuje při úrazu elektrickým proudem?
'''
options = [
  'Vyprostit postiženého, oživovat, přivolat lékaře, ohlásit úraz.',
  'Přivolat lékaře, vyprostit postiženého, oživovat, ohlásit úraz.',
  'Oživovat, vyprostit postiženého, ohlásit úraz, přivolat lékaře.',
  'Ohlásit úraz, přivolat lékaře, vyprostit postiženého, oživovat.',
]
answer = 0
explanation = '''
Nejdřív **vyprostit** postiženého z dosahu proudu (bez ohrožení sebe), pak **oživovat** (nedýchá-li, resuscitace), **přivolat lékaře** a nakonec **ohlásit úraz**. Čím dřív pomoc začne, tím větší je naděje.
'''
notes = [
  '',
  'Dokud postižený je v obvodu, pomoc nejde poskytnout a proud dál působí.',
  'Oživovat člověka, kterým ještě teče proud, ohrožuje i zachránce.',
  'Hlášení úrazu je až poslední krok.',
]

[[question]]
id = 'P02-07'
topic = 'Praktikum: bezpečnost a laboratorní řád'
source = 'Úvod do měření, 5.4'
tags = ["pred-praktikem"]
text = '''
Jak správně vyprostit člověka, kterým prochází proud?
'''
options = [
  'Odtáhnout ho holou rukou, rychlost je nejdůležitější.',
  'Vypnout obvod, nebo vodič odsunout suchým izolantem.',
  'Polít ho vodou, aby se proud svedl do země.',
  'Na postiženého nesahat a čekat na lékaře.',
]
answer = 1
explanation = '''
Vyprostit co nejrychleji, ale tak, aby proud **nezasáhl zachránce**: vypnout obvod, odtáhnout postiženého nebo odsunout vodič **suchým izolantem**. V nouzi poslouží ruka obalená několika vrstvami suché látky.
'''
notes = [
  'Holou rukou by proud zasáhl i vás.',
  '',
  'Voda je vodivá a ohrozí i zachránce.',
  'Čekáním ztrácíte čas, vyprostit je potřeba hned.',
]

