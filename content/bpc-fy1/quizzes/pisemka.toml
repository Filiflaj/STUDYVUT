# Úloha 5: nakloněná rovina

[[question]]
id = 'PIS-05-01'
topic = 'Úloha 5: nakloněná rovina'
source = 'Protokol, úloha 5'
text = '''
Rychlost tělesa na úseku $i$ se počítá jako $v_i = \Delta s_i/\Delta t_i$. Proč se do grafu $v(t)$ vynáší k času $\tau_i = (t_{i-1} + t_i)/2$, tedy do středu doby průjezdu úsekem?
'''
options = [
  'U rovnoměrně zrychleného pohybu se průměrná rychlost za časový interval rovná okamžité rychlosti v polovině tohoto intervalu.',
  'Těleso projede každý úsek stálou rychlostí, takže na volbě času nezáleží.',
  'Aby se vyrovnalo zpoždění, se kterým se spouští osciloskop.',
  'Uprostřed úseku je těleso nejrychlejší.',
]
answer = 0
explanation = '''
$v_i$ je **průměrná** rychlost na úseku. Při rovnoměrně zrychleném pohybu roste rychlost s časem lineárně, $v = at + v_0$, a průměr lineární funkce přes interval je její hodnota uprostřed intervalu. Body $[\tau_i;\,v_i]$ proto leží na přímce a její směrnice je zrychlení $a$.
'''
notes = [
  '',
  'Těleso zrychluje, rychlost se během úseku mění. Právě proto záleží na tom, ke kterému času ji přiřadíme.',
  'Osciloskop se spouští průchodem bránou 0, s volbou času $\tau_i$ to nesouvisí.',
  'Zrychlující těleso je nejrychlejší na konci úseku, ne uprostřed.',
]

[[question]]
id = 'PIS-05-02'
topic = 'Úloha 5: nakloněná rovina'
source = 'Protokol, úloha 5'
text = '''
Čím se v úloze 5 měří doby, za které těleso projede jednotlivé úseky mezi branami?
'''
options = [
  'Optickými branami podél roviny: osciloskop se spustí průchodem bránou 0 a kontrolní počítač ukáže doby průjezdu.',
  'Ručními stopkami, které měřící spouští a zastavuje.',
  'Ultrazvukovým snímačem, který měří vzdálenost tělesa od konce roviny.',
  'Videokamerou a rozborem snímků v počítači.',
]
answer = 0
explanation = '''
Podél roviny je deset optických bran 0 až 9. Těleso přerušením brány 0 spustí osciloskop a kontrolní počítač ukáže pro každou bránu čas od brány 0 i dobu průjezdu úsekem od předchozí brány (rozlišení $1\ \mu\mathrm{s}$). Délky úseků se změří ocelovým měřítkem.
'''
notes = [
  '',
  'Úsek trvá setiny sekundy, ruční stopky (chyba asi $0{,}3\ \mathrm{s}$) by byly mnohem nepřesnější než doby samotné.',
  'Takový snímač v úloze není. Brány jsou pevné a jejich vzdálenosti se změří měřítkem.',
  'Kamera se v úloze nepoužívá.',
]

[[question]]
id = 'PIS-05-03'
topic = 'Úloha 5: nakloněná rovina'
source = 'Protokol, úloha 5'
text = '''
Jak se změní zrychlení tělesa $a = g(\sin\alpha - \mu\cos\alpha)$, když při stejné dvojici materiálů (stejném $\mu$) zvětšíte úhel sklonu roviny $\alpha$?
'''
options = [
  'Zvětší se: $\sin\alpha$ roste a $\cos\alpha$ klesá, takže závorka roste.',
  'Zmenší se, protože roste třecí síla.',
  'Nezmění se, zrychlení závisí jen na materiálech.',
  'Zvětší se přímo úměrně úhlu.',
]
answer = 0
explanation = '''
Se sklonem roste složka tíhy podél roviny $mg\sin\alpha$ a klesá normálová síla $N = mg\cos\alpha$, a s ní i třecí síla $F_\mathrm{t} = \mu N$. Obojí zrychlení zvětšuje. Například pro $\mu = 0{,}17$ vychází při $25^\circ$ asi $2{,}6\ \mathrm{m\,s^{-2}}$, při $35^\circ$ asi $4{,}3\ \mathrm{m\,s^{-2}}$.
'''
notes = [
  '',
  'Třecí síla $\mu mg\cos\alpha$ se s rostoucím úhlem naopak zmenšuje.',
  'Na materiálech závisí $\mu$, zrychlení závisí i na úhlu.',
  '$\sin\alpha$ a $\cos\alpha$ nejsou lineární funkce úhlu, přímá úměrnost neplatí.',
]

[[question]]
id = 'PIS-05-04'
kind = 'numeric'
topic = 'Úloha 5: nakloněná rovina'
source = 'Protokol, úloha 5'
text = '''
Ze vztahu $v_i = \Delta s_i/\Delta t_i$ vypočtěte rychlost tělesa na 2. úseku. Délka úseku je $\Delta s_2 = 76{,}0\ \mathrm{mm}$, doba průjezdu $\Delta t_2 = 0{,}085913\ \mathrm{s}$.
'''
value = 0.885
tolerance = 0.009
unit = 'm/s'
explanation = '''
Délku převedeme na metry, $\Delta s_2 = 76{,}0\ \mathrm{mm} = 0{,}0760\ \mathrm{m}$:
$$v_2 = \frac{\Delta s_2}{\Delta t_2} = \frac{0{,}0760\ \mathrm{m}}{0{,}085913\ \mathrm{s}} = 0{,}8846\ \mathrm{m\,s^{-1}} \doteq 0{,}885\ \mathrm{m\,s^{-1}}$$
Je to průměrná rychlost na úseku, v grafu $v(t)$ patří k času $\tau_2$ uprostřed průjezdu.
'''
warning = 'Délku úseku dosaďte v metrech.'

[[question]]
id = 'PIS-05-05'
kind = 'numeric'
topic = 'Úloha 5: nakloněná rovina'
source = 'Protokol, úloha 5'
text = '''
Těleso projelo 1. úsek za $\Delta t_1 = 0{,}127313\ \mathrm{s}$ a 2. úsek za $\Delta t_2 = 0{,}085913\ \mathrm{s}$. Čas $t_i$ průchodu bránou $i$ se měří od brány 0, $t_i = \sum_{k=1}^{i}\Delta t_k$. Rychlost na 2. úseku patří k času $\tau_2 = (t_1 + t_2)/2$. Vypočtěte $\tau_2$.
'''
value = 0.1703
tolerance = 0.001
unit = 's'
explanation = '''
Časy průchodu branami 1 a 2:
$$t_1 = \Delta t_1 = 0{,}127313\ \mathrm{s} \qquad t_2 = \Delta t_1 + \Delta t_2 = (0{,}127313 + 0{,}085913)\ \mathrm{s} = 0{,}213226\ \mathrm{s}$$
Čas uprostřed průjezdu 2. úsekem:
$$\tau_2 = \frac{t_1 + t_2}{2} = \frac{0{,}127313 + 0{,}213226}{2}\ \mathrm{s} = 0{,}170270\ \mathrm{s}$$
'''

[[question]]
id = 'PIS-05-06'
kind = 'numeric'
topic = 'Úloha 5: nakloněná rovina'
source = 'Protokol, úloha 5'
text = '''
Ze vztahu $\mu = \dfrac{\sin\alpha - a/g}{\cos\alpha}$ vypočtěte součinitel smykového tření pro ocel na oceli: $\alpha = 25{,}06^\circ$, naměřené zrychlení $a = 2{,}61\ \mathrm{m\,s^{-2}}$, $g = 9{,}81\ \mathrm{m\,s^{-2}}$.
'''
value = 0.174
tolerance = 0.002
explanation = '''
$$\sin 25{,}06^\circ = 0{,}4236 \qquad \cos 25{,}06^\circ = 0{,}9059 \qquad \frac{a}{g} = \frac{2{,}61}{9{,}81} = 0{,}2661$$
$$\mu = \frac{\sin\alpha - a/g}{\cos\alpha} = \frac{0{,}4236 - 0{,}2661}{0{,}9059} = \frac{0{,}1575}{0{,}9059} = 0{,}174$$
Součinitel je bezrozměrný. Kontrola: $\mu < \operatorname{tg}25{,}06^\circ \doteq 0{,}47$, takže těleso po rovině opravdu klouže.
'''
warning = 'Kalkulačka musí počítat ve stupních (DEG).'

# Úloha 10: reverzní kyvadlo

[[question]]
id = 'PIS-10-01'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Protokol, úloha 10'
text = '''
Proč se tíhové zrychlení v úloze 10 nepočítá přímo ze vztahu pro fyzické kyvadlo $T = 2\pi\sqrt{J/(mgd)}$?
'''
options = [
  'Moment setrvačnosti $J$ ani vzdálenost osy od těžiště $d$ neznáme. Reverzní kyvadlo je obejde: stačí změřit redukovanou délku $\ell_\mathrm{r}$ a dobu kmitu.',
  'Vztah pro fyzické kyvadlo platí jen pro velké rozkyvy.',
  'Fyzické kyvadlo nemá stálou dobu kmitu.',
  'Ve vztahu je hmotnost kyvadla a tu nejde změřit.',
]
answer = 0
explanation = '''
Fyzické kyvadlo kývá stejně jako matematické kyvadlo délky $\ell_\mathrm{r}$ (redukovaná délka). Když je závaží v poloze, kde jsou doby kmitu kolem obou břitů stejné, je vzdálenost břitů právě $\ell_\mathrm{r}$. Pak stačí vztah pro matematické kyvadlo:
$$g = \frac{4\pi^2\ell_\mathrm{r}}{T^2}$$
'''
notes = [
  '',
  'Platí naopak pro malé rozkyvy, stejně jako vztah pro matematické kyvadlo.',
  'Pro malé rozkyvy je doba kmitu fyzického kyvadla stálá.',
  'Hmotnost by se zvážit dala. Problém je v $J$ a $d$, které změřit neumíme.',
]

[[question]]
id = 'PIS-10-02'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Protokol, úloha 10'
text = '''
Proč se doba kmitu měří postupnou metodou (čas po každých 10 kmitech až do 90) a ne jako doba jediného kmitu?
'''
options = [
  'Chyba odečtu času se rozdělí na 50 kmitů, takže doba jednoho kmitu je přesnější, a z pěti hodnot doby 50 kmitů jde spočítat průměr a náhodnou chybu.',
  'Doba kmitu se s počtem kmitů mění a metoda ji zprůměruje.',
  'Optický snímač dobu jednoho kmitu změřit neumí.',
  'Doba 50 kmitů se pak už nemusí dělit, je to rovnou $T$.',
]
answer = 0
explanation = '''
Časy se zapíšou po 0, 10, …, 90 kmitech. Rozdíly $B - A$ (50 − 0, 60 − 10, …, 90 − 40) dají 5 hodnot doby 50 kmitů. Z nich se spočte průměr a chyba $\delta(50T)$, a pak
$$T = \frac{\overline{50T}}{50} \qquad \delta(T) = \frac{\delta(50T)}{50}$$
'''
notes = [
  '',
  'Pro malé rozkyvy je doba kmitu stálá, o její změnu nejde.',
  'Snímač dobu jednoho kmitu změří (tak se hledal průsečík), jde o přesnost.',
  'Doba 50 kmitů se naopak musí vydělit 50.',
]

[[question]]
id = 'PIS-10-03'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Protokol, úloha 10'
text = '''
Jak se změní doba kmitu matematického kyvadla $T = 2\pi\sqrt{\ell/g}$, když jeho délku čtyřikrát zvětšíte?
'''
options = ['Zdvojnásobí se.', 'Zčtyřnásobí se.', 'Zmenší se na polovinu.', 'Nezmění se.']
answer = 0
layout = 'grid'
explanation = '''
Doba kmitu je úměrná odmocnině z délky: $T \propto \sqrt{\ell}$. Čtyřnásobná délka dá $\sqrt4 = 2$, tedy dvojnásobnou dobu kmitu.
'''
notes = [
  '',
  'Doba kmitu roste s odmocninou délky, ne přímo úměrně.',
  'Delší kyvadlo kývá pomaleji, doba kmitu roste.',
  'Na hmotnosti doba kmitu nezávisí, na délce ano.',
]

[[question]]
id = 'PIS-10-04'
kind = 'numeric'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Protokol, úloha 10'
text = '''
Postupná metoda, osa O1: čas po 10 kmitech je $19{,}719\ \mathrm{s}$, po 60 kmitech $118{,}265\ \mathrm{s}$. Rozdíl dává dobu 50 kmitů. Vypočtěte dobu jednoho kmitu $T = 50T/50$.
'''
value = 1.9709
tolerance = 0.002
unit = 's'
explanation = '''
$$50T = B - A = 118{,}265\ \mathrm{s} - 19{,}719\ \mathrm{s} = 98{,}546\ \mathrm{s}$$
$$T = \frac{50T}{50} = \frac{98{,}546\ \mathrm{s}}{50} = 1{,}9709\ \mathrm{s}$$
V protokolu se takto spočte všech pět rozdílů, ty se zprůměrují a 50 se dělí až průměr.
'''

[[question]]
id = 'PIS-10-05'
kind = 'numeric'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Protokol, úloha 10'
text = '''
Průměrná doba 50 kmitů kolem osy O2 je $98{,}463\ \mathrm{s}$, redukovaná délka $\ell_\mathrm{r} = 97{,}01\ \mathrm{cm}$. Ze vztahu $g = 4\pi^2\ell_\mathrm{r}/T^2$ vypočtěte tíhové zrychlení.
'''
value = 9.876
tolerance = 0.02
unit = 'm/s²'
explanation = '''
Doba jednoho kmitu a délka v metrech:
$$T = \frac{98{,}463\ \mathrm{s}}{50} = 1{,}96926\ \mathrm{s} \qquad \ell_\mathrm{r} = 97{,}01\ \mathrm{cm} = 0{,}9701\ \mathrm{m}$$
$$g = \frac{4\pi^2\ell_\mathrm{r}}{T^2} = \frac{4\pi^2\cdot0{,}9701}{1{,}96926^2}\ \mathrm{m\,s^{-2}} = \frac{38{,}298}{3{,}8780}\ \mathrm{m\,s^{-2}} = 9{,}876\ \mathrm{m\,s^{-2}}$$
'''
warning = 'Do vztahu patří doba jednoho kmitu (ne 50) a délka v metrech.'

[[question]]
id = 'PIS-10-06'
kind = 'numeric'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Protokol, úloha 10'
text = '''
Doba 50 kmitů vyšla $\overline{50T} = 98{,}53\ \mathrm{s}$ s chybou $\delta(50T) = 0{,}03\ \mathrm{s}$. Vypočtěte chybu doby jednoho kmitu $\delta(T) = \delta(50T)/50$ a z ní relativní chybu $\delta_\mathrm{r}(T) = \delta(T)/T\cdot100\ \%$ (před zaokrouhlením).
'''
value = 0.0304
tolerance = 0.0005
unit = '%'
explanation = '''
$$T = \frac{98{,}53\ \mathrm{s}}{50} = 1{,}9706\ \mathrm{s} \qquad \delta(T) = \frac{\delta(50T)}{50} = \frac{0{,}03\ \mathrm{s}}{50} = 0{,}0006\ \mathrm{s}$$
$$\delta_\mathrm{r}(T) = \frac{\delta(T)}{T}\cdot100\ \% = \frac{0{,}0006}{1{,}9706}\cdot100\ \% = 0{,}0304\ \%$$
Relativní chyba je stejná jako u doby 50 kmitů ($0{,}03/98{,}53$), dělení padesáti ji nemění. Zaokrouhleno nahoru: $0{,}04\ \%$.
'''

# Úloha 17: ručkové přístroje

[[question]]
id = 'PIS-17-01'
topic = 'Úloha 17: ručkové přístroje'
source = 'Protokol, úloha 17'
text = '''
Co je efektivní hodnota střídavého napětí $U_\mathrm{ef}$?
'''
options = [
  'Stejnosměrné napětí, které na rezistoru vyvine za periodu stejné teplo jako dané střídavé napětí.',
  'Stejnosměrné napětí, které za periodu přenese stejný náboj.',
  'Největší hodnota napětí během periody.',
  'Rozdíl největší a nejmenší hodnoty napětí.',
]
answer = 0
explanation = '''
$$U_\mathrm{ef} = \sqrt{\frac1T\int_0^T u^2(t)\,\mathrm{d}t}$$
Pro harmonické napětí s amplitudou $U_\mathrm{M}$ je $U_\mathrm{ef} = U_\mathrm{M}/\sqrt2$.
'''
notes = [
  '',
  'To je střední hodnota $U_\mathrm{s}$.',
  'To je amplituda $U_\mathrm{M}$.',
  'To je rozkmit (špička–špička) $2U_\mathrm{M}$.',
]

[[question]]
id = 'PIS-17-02'
topic = 'Úloha 17: ručkové přístroje'
source = 'Protokol, úloha 17'
text = '''
Proč se magnetoelektrickým voltmetrem V1 (bez usměrňovače) neměřilo harmonické, neusměrněné napětí?
'''
options = [
  'Jeho výchylka je úměrná střední hodnotě napětí a ta je u harmonického napětí nulová, ručka by stála na nule.',
  'Napětí 25 V je pro něj příliš velké.',
  'Měří efektivní hodnotu a ta je u harmonického napětí nulová.',
  'Má horší třídu přesnosti než ostatní voltmetry.',
]
answer = 0
explanation = '''
Magnetoelektrický voltmetr měří střední hodnotu $U_\mathrm{s} = \frac1T\int_0^T u(t)\,\mathrm{d}t$. Kladná a záporná půlvlna harmonického napětí se vyruší, $U_\mathrm{s} = 0$. Usměrněná napětí už nenulovou střední hodnotu mají, proto je V1 měřil.
'''
notes = [
  '',
  'Rozsah se dá zvolit, problém je v principu měření.',
  'Efektivní hodnota harmonického napětí nulová není, je $U_\mathrm{M}/\sqrt2$. V1 měří střední hodnotu.',
  'V1 má třídu přesnosti 0,5, stejně dobrou jako V3. O přesnost nejde.',
]

[[question]]
id = 'PIS-17-03'
topic = 'Úloha 17: ručkové přístroje'
source = 'Protokol, úloha 17'
text = '''
Magnetoelektrický voltmetr s usměrňovačem (V2) napětí usměrní a měří jeho střední hodnotu, stupnici má ale cejchovanou v efektivní hodnotě harmonického napětí. Pro které průběhy ukazuje přímo efektivní hodnotu?
'''
options = [
  'Pro harmonické a dvoucestně usměrněné napětí.',
  'Pro všechny tři průběhy.',
  'Jen pro jednocestně usměrněné napětí.',
  'Pro žádný, vždy ukazuje střední hodnotu.',
]
answer = 0
explanation = '''
Stupnice je přepočtená činitelem tvaru harmonického průběhu $k_\mathrm{t} = U_\mathrm{ef}/U_\mathrm{s} = \pi/(2\sqrt2) \doteq 1{,}11$. Harmonické napětí po usměrnění v přístroji vypadá stejně jako dvoucestně usměrněné, pro oba je údaj správný. Jednocestně usměrněné napětí má jiný poměr $U_\mathrm{ef}/U_\mathrm{s} = \pi/2$, jeho údaj se musí přepočítat: $U_\mathrm{M} = 2\sqrt2\,U_\text{Měř}$.
'''
notes = [
  '',
  'U jednocestně usměrněného napětí je činitel tvaru jiný, údaj se musí přepočítat.',
  'To je právě průběh, u kterého údaj neodpovídá. Zbylé dva jsou správně.',
  'Díky cejchování činitelem 1,11 ukazuje u harmonického průběhu efektivní hodnotu.',
]

[[question]]
id = 'PIS-17-04'
kind = 'numeric'
topic = 'Úloha 17: ručkové přístroje'
source = 'Protokol, úloha 17'
text = '''
Elektromagnetický voltmetr na rozsahu $U_\mathrm{R} = 26\ \mathrm{V}$ se stupnicí $\alpha_\mathrm{max} = 130$ dílků ukazuje u harmonického napětí výchylku $\alpha = 116$ dílků. Jeho údaj $U_\text{Měř} = \alpha\,U_\mathrm{R}/\alpha_\mathrm{max}$ je efektivní hodnota. Vypočtěte amplitudu $U_\mathrm{M} = \sqrt2\,U_\mathrm{ef}$.
'''
value = 32.81
tolerance = 0.2
unit = 'V'
explanation = '''
$$U_\text{Měř} = \alpha\,\frac{U_\mathrm{R}}{\alpha_\mathrm{max}} = 116\cdot\frac{26}{130}\ \mathrm{V} = 23{,}20\ \mathrm{V} = U_\mathrm{ef}$$
$$U_\mathrm{M} = \sqrt2\,U_\mathrm{ef} = \sqrt2\cdot23{,}20\ \mathrm{V} = 32{,}81\ \mathrm{V}$$
'''

[[question]]
id = 'PIS-17-05'
kind = 'numeric'
topic = 'Úloha 17: ručkové přístroje'
source = 'Protokol, úloha 17'
text = '''
Voltmetr s usměrňovačem třídy přesnosti $T_\mathrm{p} = 1{,}5$ měří na rozsahu $U_\mathrm{R} = 60\ \mathrm{V}$ efektivní hodnotu harmonického napětí. Mezní chyba údaje je $\delta(U_\text{Měř}) = \dfrac{T_\mathrm{p}}{100}\,U_\mathrm{R}$ a chyba amplitudy $\delta(U_\mathrm{M}) = \sqrt2\,\delta(U_\text{Měř})$. Vypočtěte $\delta(U_\mathrm{M})$.
'''
value = 1.27
tolerance = 0.03
unit = 'V'
explanation = '''
$$\delta(U_\text{Měř}) = \frac{T_\mathrm{p}}{100}\,U_\mathrm{R} = \frac{1{,}5}{100}\cdot60\ \mathrm{V} = 0{,}9\ \mathrm{V}$$
$$\delta(U_\mathrm{M}) = \sqrt2\,\delta(U_\text{Měř}) = \sqrt2\cdot0{,}9\ \mathrm{V} = 1{,}27\ \mathrm{V}$$
Chyba začíná jedničkou, zaokrouhlí se nahoru na dvě platné číslice: $1{,}3\ \mathrm{V}$.
'''
warning = 'Třída přesnosti se násobí rozsahem, ne naměřenou hodnotou.'

[[question]]
id = 'PIS-17-06'
kind = 'numeric'
topic = 'Úloha 17: ručkové přístroje'
source = 'Protokol, úloha 17'
text = '''
Magnetoelektrický voltmetr (ukazuje střední hodnotu) měří jednocestně usměrněné napětí na rozsahu $U_\mathrm{R} = 12\ \mathrm{V}$ se stupnicí $\alpha_\mathrm{max} = 120$ dílků, výchylka je $\alpha = 116$ dílků. Ze vztahů $U_\text{Měř} = \alpha\,U_\mathrm{R}/\alpha_\mathrm{max}$ a $U_\mathrm{s} = U_\mathrm{M}/\pi$ vypočtěte amplitudu napětí.
'''
value = 36.44
tolerance = 0.2
unit = 'V'
explanation = '''
$$U_\mathrm{s} = U_\text{Měř} = \alpha\,\frac{U_\mathrm{R}}{\alpha_\mathrm{max}} = 116\cdot\frac{12}{120}\ \mathrm{V} = 11{,}60\ \mathrm{V}$$
$$U_\mathrm{M} = \pi\,U_\mathrm{s} = \pi\cdot11{,}60\ \mathrm{V} = 36{,}44\ \mathrm{V}$$
'''

# Úloha 18: termistory a PT100

