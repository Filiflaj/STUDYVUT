  'Podle barvy zdířky, ke které je senzor připojený.',
  'Podle odporu při pokojové teplotě: největší odpor má vždy PT100.',
  'Podle toho, jak rychle se senzor ohřeje na nastavenou teplotu.',
]
answer = 0
explanation = '''
Senzory jsou připojené ke zdířkám TS1 až TS3 a který je který, se určí až z naměřených závislostí $R(t)$. Klesající exponenciála je NTC termistor ($R = R_0\,\mathrm{e}^{B(1/T - 1/T_0)}$), přímka kolem 100 Ω je PT100 ($R = R_0[1 + \alpha_R(T - T_0)]$) a rostoucí, nelineární průběh je PTC termistor.
