[[question]]
id = 'PIS-18-03'
topic = 'Úloha 18: termistory a PT100'
source = 'Protokol, úloha 18'
text = '''
Co udává teplotní součinitel odporu $\alpha_R = \dfrac{1}{R}\dfrac{\mathrm{d}R}{\mathrm{d}T}$?
'''
options = [
  'Poměrnou (relativní) změnu odporu při změně teploty o 1 K, jednotka $\mathrm{K^{-1}}$.',
  'Změnu odporu v ohmech při změně teploty o 1 K, jednotka $\Omega\,\mathrm{K^{-1}}$.',
  'Odpor senzoru při vztažné teplotě $T_0$.',
  'Teplotu, při které odpor prudce vzroste.',
]
answer = 0
explanation = '''
Změna odporu se dělí odporem, $\alpha_R$ je proto relativní změna na kelvin. U PT100 vyšlo $\alpha_R \doteq 3{,}83\cdot10^{-3}\ \mathrm{K^{-1}}$: odpor roste asi o 0,4 % na kelvin. U NTC termistoru je $\alpha_\mathrm{NTC} = -B/T^2$ záporný a v absolutní hodnotě mnohem větší.
'''
notes = [
  '',
  'To je směrnice $\mathrm{d}R/\mathrm{d}T$ (u proložené přímky $a$). $\alpha_R$ je ještě vydělená odporem.',
  'To je $R_0$ (u proložené přímky úsek $b$).',
  'To je mezní teplota PTC termistoru.',
]

[[question]]
id = 'PIS-18-04'
kind = 'numeric'
topic = 'Úloha 18: termistory a PT100'
source = 'Protokol, úloha 18'
text = '''
Body závislosti odporu platinového snímače na $T - T_0$ jste proložili přímkou $R_3 = a(T - T_0) + b$ a vyšlo $a = 0{,}389\ \Omega\,\mathrm{K^{-1}}$, $b = 101{,}48\ \Omega$. Ze vztahu $\alpha_R = a/b$ vypočtěte teplotní součinitel odporu. Odpověď v jednotkách $10^{-3}\ \mathrm{K^{-1}}$.
'''
value = 3.833
tolerance = 0.04
unit = '·10⁻³ K⁻¹'
explanation = '''
Porovnáním přímky se vztahem $R = R_0[1 + \alpha_R(T - T_0)]$ je $b = R_0$ a $a = R_0\alpha_R$, proto
$$\alpha_R = \frac{a}{b} = \frac{0{,}389\ \Omega\,\mathrm{K^{-1}}}{101{,}48\ \Omega} = 3{,}833\cdot10^{-3}\ \mathrm{K^{-1}}$$
Ohmy se vykrátí, zůstane $\mathrm{K^{-1}}$.
'''

[[question]]
id = 'PIS-18-05'
kind = 'numeric'
topic = 'Úloha 18: termistory a PT100'
source = 'Protokol, úloha 18'
text = '''
Z přímky $R_3 = a(T - T_0) + b$ s $a = 0{,}389\ \Omega\,\mathrm{K^{-1}}$, $b = 101{,}48\ \Omega$ a vztažnou teplotou $T_0 = 278{,}15\ \mathrm{K}$ (5 °C) vypočtěte odpor platinového snímače při teplotě $t = 60\ {}^\circ\mathrm{C}$.
'''
value = 122.9
tolerance = 0.3
unit = 'Ω'
explanation = '''
$$T = (60 + 273{,}15)\ \mathrm{K} = 333{,}15\ \mathrm{K} \qquad T - T_0 = (333{,}15 - 278{,}15)\ \mathrm{K} = 55\ \mathrm{K}$$
$$R_3 = a(T - T_0) + b = (0{,}389\cdot55 + 101{,}48)\ \Omega = (21{,}40 + 101{,}48)\ \Omega = 122{,}9\ \Omega$$
Naměřeno bylo $123\ \Omega$. Rozdíl teplot je ve stupních i v kelvinech stejný: $60 - 5 = 55$.
'''
warning = 'Dosazuje se rozdíl od vztažné teploty, ne samotná teplota 60 °C.'

[[question]]
id = 'PIS-18-06'
kind = 'numeric'
topic = 'Úloha 18: termistory a PT100'
source = 'Protokol, úloha 18'
text = '''
NTC termistor má energiovou konstantu $B = 2340\ \mathrm{K}$. Ze vztahu $\alpha_\mathrm{NTC} = -B/T^2$ vypočtěte jeho teplotní součinitel odporu při $t = 5\ {}^\circ\mathrm{C}$. Odpověď v jednotkách $10^{-2}\ \mathrm{K^{-1}}$.
'''
value = -3.02
tolerance = 0.03
unit = '·10⁻² K⁻¹'
sign_hint = 'Teplotní součinitel NTC termistoru je záporný, odpor s teplotou klesá.'
explanation = '''
$$T = (5 + 273{,}15)\ \mathrm{K} = 278{,}15\ \mathrm{K}$$
$$\alpha_\mathrm{NTC} = -\frac{B}{T^2} = -\frac{2340\ \mathrm{K}}{(278{,}15\ \mathrm{K})^2} = -\frac{2340}{77\,367}\ \mathrm{K^{-1}} = -3{,}02\cdot10^{-2}\ \mathrm{K^{-1}}$$
V absolutní hodnotě je asi osmkrát větší než u platiny ($3{,}83\cdot10^{-3}\ \mathrm{K^{-1}}$).
'''
warning = 'Teplotu dosaďte v kelvinech.'

# Úloha 21: elektromagnetická indukce

[[question]]
id = 'PIS-21-01'
topic = 'Úloha 21: elektromagnetická indukce'
source = 'Protokol, úloha 21'
text = '''
Proč je indukované napětí při natočení indukční cívky o $\theta = 90^\circ$ (ideálně) nulové?
'''
options = [
  'Normála závitů je kolmá na pole, magnetický tok $\Phi = BS\cos\theta$ cívkou je nulový a nemění se.',
  'Při 90° se přeruší proud budicí cívkou.',
  'Pole budicí cívky je při 90° nejslabší.',
  'Indukční cívka je při 90° nejdál od budicí.',
]
answer = 0
explanation = '''
Indukované napětí vzniká změnou toku, $u_\mathrm{ind} = -N_\mathrm{i}\,\mathrm{d}\Phi/\mathrm{d}t$. Tok je úměrný $\cos\theta$, proto $U_\mathrm{ind}(\theta) = U_\mathrm{ind}(0)\cos\theta$ a při $90^\circ$ je nulové. V protokolu zbylo asi $8{,}5\ \mathrm{mV}$, nejspíš proto, že poloha $0^\circ$ neodpovídala přesně souhlasným osám cívek a pole nebylo homogenní.
'''
notes = [
  '',
  'Proud budicí cívkou na natočení indukční cívky nezávisí.',
  'Pole budicí cívky se nemění, mění se jen tok závity indukční cívky.',
  'Cívka se natáčí kolem svislé osy, vzdálenost středů zůstává stejná.',
]

[[question]]
id = 'PIS-21-02'
topic = 'Úloha 21: elektromagnetická indukce'
source = 'Protokol, úloha 21'
text = '''
Proč se při natočení $\theta > 90^\circ$ zapisuje indukované napětí se záporným znaménkem?
'''
options = [
  'Tok indukční cívkou má opačný směr a napětí opačnou polaritu. Osciloskop ukazuje jen velikost amplitudy, znaménko se doplní ručně.',
  'Aby body v grafu vyšly na přímce, fyzikální důvod to nemá.',
  'Při $\theta > 90^\circ$ se obrátí směr proudu v budicí cívce.',
  'Napětí je pro $\theta > 90^\circ$ menší než pro $\theta < 90^\circ$.',
]
answer = 0
explanation = '''
Pro $\theta > 90^\circ$ je $\cos\theta < 0$, takže $U_\mathrm{ind}(\theta) = U_\mathrm{ind}(0)\cos\theta$ je záporné. Graf normovaného napětí $y_\theta = U_\mathrm{ind}(\theta)/U_\mathrm{ind}(0)$ proti $x = \cos\theta$ je pak přímka $y_\theta = x$ od $-1$ do $1$.
'''
notes = [
  '',
  'Důvod je fyzikální: $\cos\theta$ je pro $\theta > 90^\circ$ záporný a napětí má opačnou polaritu.',
  'Budicí proud se nemění, obrací se orientace indukční cívky vůči poli.',
  'Pro $\theta$ a $180^\circ - \theta$ je velikost napětí přibližně stejná, mění se znaménko.',
]

[[question]]
id = 'PIS-21-03'
topic = 'Úloha 21: elektromagnetická indukce'
source = 'Protokol, úloha 21'
text = '''
Jak se mění vzájemná indukčnost $M$ a koeficient spřažení $k$, když cívky od sebe vzdalujete?
'''
options = [
  'Obě klesají: při zasunutých cívkách je $k$ řádu desetin, ve vzdálenosti přes 200 mm řádu $10^{-3}$.',
  'Obě rostou, protože pole prochází větší plochou.',
  '$M$ klesá, ale $k$ zůstává stejné, protože je bezrozměrné.',
  'Nemění se, závisí jen na počtu závitů.',
]
answer = 0
explanation = '''
Se vzdáleností klesá tok, kterým pole budicí cívky prochází indukční cívkou, a tedy i $M$. Koeficient $k = M/\sqrt{\tilde L_\mathrm{b}\tilde L_\mathrm{i}}$ je s $M$ úměrný, protože vlastní indukčnosti se nemění. V protokolu: $M \doteq 0{,}9\ \mathrm{mH}$ a $k \doteq 0{,}26$ při $d = 0$, $M \doteq 8{,}5\ \mu\mathrm{H}$ a $k \doteq 2{,}5\cdot10^{-3}$ při $d = 220\ \mathrm{mm}$.
'''
notes = [
  '',
  'Vzdálením cívek tok indukční cívkou klesá.',
  '$k$ je úměrný $M$, vlastní indukčnosti ve jmenovateli se nemění.',
  'Na počtu závitů $M$ závisí, ale i na vzájemné poloze cívek.',
]

[[question]]
id = 'PIS-21-04'
topic = 'Úloha 21: elektromagnetická indukce'
source = 'Protokol, úloha 21'
text = '''
Proč se exponent $n$ v závislosti $U_\mathrm{ind} \sim d^{\,n}$ určuje proložením jen bodů s velkou vzdáleností cívek (v protokolu $d \ge 120\ \mathrm{mm}$)?
'''
options = [
  'Závislost $U_\mathrm{ind} \propto d^{-3}$ plyne z dipólového přiblížení, které platí jen daleko od budicí cívky. Blízko se cívky překrývají a body v logaritmickém grafu na přímce neleží.',
  'Pro malé $d$ je napětí příliš malé a osciloskop ho neodečte.',
  'Blízké body mají větší chybu odečtu vzdálenosti.',
  'Pro malé $d$ nejde spočítat logaritmus.',
]
answer = 0
explanation = '''
Daleko od budicí cívky má její pole na ose tvar pole magnetického dipólu, $B_z \propto 1/d^3$. V grafu $\ln y_d$ proti $\ln d$ je to přímka se směrnicí $n$. Cívky se překrývají, dokud je $d < (\ell_\mathrm{b} + \ell_\mathrm{i})/2 \doteq 102\ \mathrm{mm}$, a tam dipólové přiblížení neplatí.
'''
notes = [
  '',
  'Naopak, pro malé $d$ je napětí největší.',
  'Chyba odečtu vzdálenosti je u všech bodů stejná (1 mm). Důvod je fyzikální.',
  'Logaritmus nejde jen pro $d = 0$. Ostatní blízké body se vyřazují kvůli neplatnosti dipólového přiblížení.',
]

[[question]]
id = 'PIS-21-05'
kind = 'numeric'
topic = 'Úloha 21: elektromagnetická indukce'
source = 'Protokol, úloha 21'
text = '''
Vzájemná indukčnost zasunutých cívek vyšla $M = 0{,}9\ \mathrm{mH}$. Vlastní indukčnosti cívek jsou $\tilde L_\mathrm{b} = 2{,}04\ \mathrm{mH}$ a $\tilde L_\mathrm{i} = 5{,}74\ \mathrm{mH}$. Ze vztahu $k = M/\sqrt{\tilde L_\mathrm{b}\tilde L_\mathrm{i}}$ vypočtěte koeficient spřažení.
'''
value = 0.263
tolerance = 0.003
explanation = '''
$$\sqrt{\tilde L_\mathrm{b}\tilde L_\mathrm{i}} = \sqrt{2{,}04\cdot5{,}74}\ \mathrm{mH} = \sqrt{11{,}710}\ \mathrm{mH} = 3{,}422\ \mathrm{mH}$$
$$k = \frac{M}{\sqrt{\tilde L_\mathrm{b}\tilde L_\mathrm{i}}} = \frac{0{,}9\ \mathrm{mH}}{3{,}422\ \mathrm{mH}} = 0{,}263$$
Koeficient je bezrozměrný a leží mezi 0 a 1.
'''

[[question]]
id = 'PIS-21-06'
kind = 'numeric'
topic = 'Úloha 21: elektromagnetická indukce'
source = 'Protokol, úloha 21'
text = '''
Budicí cívka má odpor vinutí $R = 28{,}9\ \Omega$ a indukčnost $L = 2{,}04\ \mathrm{mH}$. Ze vztahu $f_0 = R/(2\pi L)$ vypočtěte charakteristickou frekvenci, kolem které se fázový posun mezi budicím a indukovaným napětím nejvíc mění.
'''
value = 2255
tolerance = 25
unit = 'Hz'
