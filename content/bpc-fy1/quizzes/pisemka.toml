$$f_0 = \frac{R}{2\pi L} = \frac{28{,}9\ \Omega}{2\pi\cdot2{,}04\cdot10^{-3}\ \mathrm{H}} = \frac{28{,}9}{0{,}012818}\ \mathrm{Hz} = 2255\ \mathrm{Hz}$$
Při $f_0$ je $\omega L = R$ a posun se od $90^\circ$ odchýlí právě o $45^\circ$. V protokolu vyšla odchylka $45^\circ$ asi při $1{,}8\ \mathrm{kHz}$.
'''
warning = 'Indukčnost dosaďte v henry.'

[[question]]
id = 'PIS-21-07'
kind = 'numeric'
topic = 'Úloha 21: elektromagnetická indukce'
source = 'Protokol, úloha 21'
text = '''
Při $f = 5000\ \mathrm{Hz}$ je efektivní napětí na budicí cívce $U_\mathrm{b,ef} = 10{,}26\ \mathrm{V}$ a amplituda proudu $I_\mathrm{b} = 127\ \mathrm{mA}$. Ze vztahů $I_\mathrm{b,ef} = I_\mathrm{b}/\sqrt2$ a $|Z| = U_\mathrm{b,ef}/I_\mathrm{b,ef}$ vypočtěte velikost impedance budicí cívky.
