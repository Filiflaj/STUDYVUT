notes = [
  '',
  'Větší energie znamená větší rychlost a větší poloměr dráhy. K zakřivení je potřeba silnější pole.',
  'Z rovnice pro $e/m$ plyne $B_0 \propto \sqrt{U_\mathrm{A}}$, závisí tedy i na napětí.',
  '$B_0$, a tedy i $I_0$, roste s odmocninou napětí, ne přímo úměrně.',
]

