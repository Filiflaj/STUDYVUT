# Úloha 25: měrný náboj elektronu

[[question]]
id = 'PIS-25-01'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Protokol, úloha 25'
text = '''
Co je kritická magnetická indukce $B_0$ v magnetronu?
'''
options = [
  'Indukce, při které se dráha elektronu anody jen dotkne. Při větší indukci se elektrony k anodě nedostanou a anodový proud klesne.',
  'Indukce, při které elektrony začnou vyletovat z katody.',
  'Největší indukce, kterou cívka vydrží bez přehřátí.',
  'Indukce, při které magnetická síla zrychlí elektrony na největší rychlost.',
]
answer = 0
explanation = '''
Magnetické pole cívky zakřivuje dráhy elektronů letících od katody k anodě. Při $B_0$ se dráha anody právě dotkne. Z kritické indukce se počítá měrný náboj:
$$\frac{e}{m} = \frac{8U_\mathrm{A}R_\mathrm{a}^2}{(R_\mathrm{a}^2 - R_\mathrm{k}^2)^2B_0^2}$$
'''
notes = [
  '',
  'Elektrony vyletují ze žhavené katody i bez magnetického pole.',
  'S tepelným zatížením cívky $B_0$ nesouvisí.',
  'Magnetická síla je kolmá na rychlost, její velikost nemění.',
]

