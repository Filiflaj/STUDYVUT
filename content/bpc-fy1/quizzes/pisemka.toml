id = 'PIS-25-02'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Protokol, úloha 25'
text = '''
Jak se změní kritický proud cívkou $I_0$, když zvýšíte anodové napětí $U_\mathrm{A}$?
