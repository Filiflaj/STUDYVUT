  'Zvětší se: rychlejší elektrony potřebují k zakřivení dráhy silnější pole ($B_0^2$ je úměrné $U_\mathrm{A}$).',
  'Zmenší se, protože elektrony mají větší energii.',
  'Nezmění se, závisí jen na rozměrech elektronky.',
  'Zvětší se přímo úměrně napětí.',
]
answer = 0
explanation = '''
Ze vztahu pro měrný náboj plyne $B_0^2 = \dfrac{8U_\mathrm{A}R_\mathrm{a}^2}{(R_\mathrm{a}^2 - R_\mathrm{k}^2)^2\,(e/m)}$, tedy $B_0 \propto \sqrt{U_\mathrm{A}}$, a $I_0 = B_0/K$ roste s napětím. V protokolu vyšlo $I_0 \doteq 290$, $301$ a $322\ \mathrm{mA}$ pro $8$, $10$ a $12\ \mathrm{V}$.
