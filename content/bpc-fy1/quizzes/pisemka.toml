[[question]]
id = 'PIS-25-04'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Protokol, úloha 25'
text = '''
Konstanta cívky je $K = 15{,}55\ \mathrm{mT\,A^{-1}}$ a kritický proud cívkou při $U_\mathrm{A} = 10\ \mathrm{V}$ vyšel $I_0 = 301\ \mathrm{mA}$. Ze vztahu $B_0 = K I_0$ vypočtěte kritickou magnetickou indukci.
'''
value = 4.681
tolerance = 0.05
unit = 'mT'
explanation = '''
Proud převedeme na ampéry, $I_0 = 301\ \mathrm{mA} = 0{,}301\ \mathrm{A}$:
$$B_0 = K I_0 = 15{,}55\ \mathrm{mT\,A^{-1}}\cdot0{,}301\ \mathrm{A} = 4{,}681\ \mathrm{mT}$$
'''

[[question]]
id = 'PIS-25-05'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Protokol, úloha 25'
text = '''
Ze vztahu $\dfrac{e}{m} = \dfrac{G\,U_\mathrm{A}}{B_0^2}$, kde $G = \dfrac{8R_\mathrm{a}^2}{(R_\mathrm{a}^2 - R_\mathrm{k}^2)^2} = 7{,}8125\cdot10^{5}\ \mathrm{m^{-2}}$ je geometrický činitel elektronky, vypočtěte měrný náboj elektronu pro $U_\mathrm{A} = 10{,}000\ \mathrm{V}$ a $B_0 = 4{,}68\ \mathrm{mT}$. Odpověď v jednotkách $10^{11}\ \mathrm{C\,kg^{-1}}$.
'''
value = 3.567
tolerance = 0.04
unit = '·10¹¹ C/kg'
explanation = '''
Indukci převedeme na tesly, $B_0 = 4{,}68\cdot10^{-3}\ \mathrm{T}$:
$$B_0^2 = (4{,}68\cdot10^{-3}\ \mathrm{T})^2 = 2{,}190\cdot10^{-5}\ \mathrm{T^2}$$
$$\frac{e}{m} = \frac{G\,U_\mathrm{A}}{B_0^2} = \frac{7{,}8125\cdot10^{5}\cdot10{,}000}{2{,}190\cdot10^{-5}}\ \mathrm{C\,kg^{-1}} = 3{,}567\cdot10^{11}\ \mathrm{C\,kg^{-1}}$$
Je to asi dvakrát víc než tabulková hodnota $1{,}76\cdot10^{11}\ \mathrm{C\,kg^{-1}}$. Rozdíl je větší než $3\delta$, jde tedy nejspíš o soustavnou chybu.
'''
warning = 'Indukci dosaďte v teslách, ne v militeslách.'

[[question]]
id = 'PIS-25-06'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Protokol, úloha 25'
text = '''
Relativní chyba kritické indukce je $\delta_\mathrm{r}(B_0) = 1{,}92\ \%$ a relativní chyba měřidla anodového napětí $u_\mathrm{r}(U_\mathrm{A}) = 0{,}01\ \%$. Pro $e/m = G\,U_\mathrm{A}/B_0^2$ platí podle zákona šíření chyb $\delta_\mathrm{r}(e/m) = u_\mathrm{r}(U_\mathrm{A}) + 2\,\delta_\mathrm{r}(B_0)$. Vypočtěte $\delta_\mathrm{r}(e/m)$ (před zaokrouhlením).
'''
value = 3.85
tolerance = 0.04
unit = '%'
explanation = '''
$$\delta_\mathrm{r}(e/m) = u_\mathrm{r}(U_\mathrm{A}) + 2\,\delta_\mathrm{r}(B_0) = 0{,}01\ \% + 2\cdot1{,}92\ \% = 3{,}85\ \%$$
$B_0$ je ve vztahu na druhou, proto se jeho relativní chyba počítá dvakrát. $U_\mathrm{A}$ je v první mocnině. Zaokrouhleno nahoru: $4\ \%$.
'''

# Zpracování měření

[[question]]
id = 'PIS-ZM-01'
topic = 'Zpracování měření'
source = 'Protokoly, zpracování měření'
text = '''
Tíhové zrychlení vyšlo $g = 9{,}8623\ \mathrm{m\,s^{-2}}$ s chybou $\delta(g) = 0{,}0121\ \mathrm{m\,s^{-2}}$ ($P = 95\ \%$). Jak správně zapíšete výsledek?
'''
options = [
  '$g = (9{,}862 \pm 0{,}013)\ \mathrm{m\,s^{-2}}$',
  '$g = (9{,}86 \pm 0{,}02)\ \mathrm{m\,s^{-2}}$',
  '$g = (9{,}8623 \pm 0{,}0121)\ \mathrm{m\,s^{-2}}$',
  '$g = (9{,}862 \pm 0{,}012)\ \mathrm{m\,s^{-2}}$',
]
answer = 0
explanation = '''
Chyba začíná jedničkou, proto se nechají dvě platné číslice a zaokrouhlí se **nahoru**: $0{,}0121 \to 0{,}013$. Výsledek se zaokrouhlí na stejný řád jako chyba (tisíciny): $9{,}8623 \to 9{,}862$. K zápisu patří ještě $n$, $P$ a relativní chyba.
'''
notes = [
  '',
  'Chyba začíná jedničkou, nechávají se dvě číslice. Zaokrouhlením na $0{,}02$ by se skoro zdvojnásobila.',
  'Chyba se zaokrouhluje na jednu (dvě) platné číslice a výsledek na její řád.',
  'Chyba se zaokrouhluje vždy nahoru, ne matematicky.',
]

[[question]]
id = 'PIS-ZM-02'
topic = 'Zpracování měření'
source = 'Protokoly, zpracování měření'
text = '''
Výchylku ručkového voltmetru jste odečetli jen jednou. Jak určíte chybu naměřeného napětí?
'''
options = [
  'Z třídy přesnosti: $\delta = \dfrac{T_\mathrm{p}}{100}\,U_\mathrm{R}$, kde $U_\mathrm{R}$ je zvolený rozsah.',
  'Z třídy přesnosti a naměřené hodnoty: $\delta = \dfrac{T_\mathrm{p}}{100}\,U_\text{Měř}$.',
  'Jako $t_{n,P}\,s_{\bar x}$ se Studentovým koeficientem pro $n = 1$.',
  'Chyba je nulová, protože se hodnota odečetla jen jednou.',
]
answer = 0
explanation = '''
Z jedné hodnoty nejde spočítat rozptyl, chyba se proto určí jen z měřidla. U ručkového přístroje je to mezní chyba z třídy přesnosti, stejná na celém rozsahu. Relativní chyba $\delta_\mathrm{r} = \delta/U_\text{Měř}\cdot100\ \%$ je proto nejmenší, když je ručka v poslední třetině stupnice.
'''
notes = [
  '',
  'Třída přesnosti udává chybu v procentech rozsahu, ne naměřené hodnoty.',
  'Z jedné hodnoty nejde spočítat směrodatnou odchylku.',
  'Každé měření má chybu, u jednoho odečtu ji určuje měřidlo.',
]

[[question]]
id = 'PIS-ZM-03'
kind = 'numeric'
topic = 'Zpracování měření'
source = 'Protokoly, zpracování měření'
text = '''
Postupnou metodou vyšlo pět hodnot doby 50 kmitů: $98{,}561$; $98{,}546$; $98{,}534$; $98{,}521$; $98{,}511\ \mathrm{s}$. Vypočtěte aritmetický průměr $\overline{50T} = \frac1n\sum x_i$.
'''
value = 98.5346
tolerance = 0.001
unit = 's'
explanation = '''
$$\overline{50T} = \frac{98{,}561 + 98{,}546 + 98{,}534 + 98{,}521 + 98{,}511}{5}\ \mathrm{s} = \frac{492{,}673}{5}\ \mathrm{s} = 98{,}5346\ \mathrm{s}$$
Na kolik míst se průměr nakonec zapíše, určí až jeho chyba: s chybou $0{,}03\ \mathrm{s}$ je to $(98{,}53 \pm 0{,}03)\ \mathrm{s}$.
'''

[[question]]
id = 'PIS-ZM-04'
kind = 'numeric'
topic = 'Zpracování měření'
source = 'Protokoly, zpracování měření'
text = '''
Vzdálenost os kyvadla jste změřili desetkrát. Součet čtverců odchylek od průměru je $\sum(\ell_i - \bar\ell)^2 = 0{,}05725\ \mathrm{cm^2}$. Vypočtěte výběrovou směrodatnou odchylku průměru $s_{\bar\ell} = \sqrt{\dfrac{\sum(\ell_i - \bar\ell)^2}{n(n-1)}}$ a z ní chybu $\delta = t_{10;\,0{,}95}\,s_{\bar\ell}$, kde $t_{10;\,0{,}95} = 2{,}320$ (před zaokrouhlením).
'''
value = 0.0585
tolerance = 0.0006
unit = 'cm'
explanation = '''
$$s_{\bar\ell} = \sqrt{\frac{0{,}05725\ \mathrm{cm^2}}{10\cdot9}} = \sqrt{6{,}361\cdot10^{-4}\ \mathrm{cm^2}} = 0{,}02522\ \mathrm{cm}$$
$$\delta(\ell_\mathrm{r}) = t_{10;\,0{,}95}\,s_{\bar\ell} = 2{,}320\cdot0{,}02522\ \mathrm{cm} = 0{,}0585\ \mathrm{cm}$$
Zaokrouhleno nahoru na jednu platnou číslici: $0{,}06\ \mathrm{cm}$, výsledek $\ell_\mathrm{r} = (97{,}01 \pm 0{,}06)\ \mathrm{cm}$, $n = 10$, $P = 95\ \%$.
'''
warning = 'Ve jmenovateli je $n(n-1)$, ne jen $n - 1$: jde o odchylku průměru, ne jednoho měření.'

[[question]]
id = 'PIS-ZM-05'
kind = 'numeric'
topic = 'Zpracování měření'
source = 'Protokoly, zpracování měření'
text = '''
Vzdálenost os $\ell_\mathrm{r} = 97{,}01\ \mathrm{cm}$ jste měřili ocelovým měřítkem s nejmenším dílkem $0{,}5\ \mathrm{mm}$. Chybu měřítka berte jako polovinu nejmenšího dílku. Vypočtěte relativní chybu měřidla $u_\mathrm{r} = u/\ell_\mathrm{r}\cdot100\ \%$ (před zaokrouhlením).
'''
value = 0.0258
tolerance = 0.0003
unit = '%'
explanation = '''
$$u = \frac{0{,}5\ \mathrm{mm}}{2} = 0{,}25\ \mathrm{mm} = 0{,}025\ \mathrm{cm}$$
$$u_\mathrm{r} = \frac{u}{\ell_\mathrm{r}}\cdot100\ \% = \frac{0{,}025\ \mathrm{cm}}{97{,}01\ \mathrm{cm}}\cdot100\ \% = 0{,}0258\ \%$$
Je menší než náhodná chyba $\delta_\mathrm{r} \doteq 0{,}062\ \%$, proto se dál počítá s náhodnou chybou.
'''
warning = 'Chybu měřítka a délku dosaďte ve stejných jednotkách.'
