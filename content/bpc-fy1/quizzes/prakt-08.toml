topic = 'Protokol o měření'
source = 'Úvod do měření, 6.2'
text = '''
Jak má vypadat příklad výpočtu v protokolu?
'''
options = [
  'Každý použitý vztah s dosazenými čísly a hned výsledek, bez dalších mezivýpočtů.',
  'Jen výsledky v tabulce.',
  'Všechny mezivýsledky z kalkulačky na deset míst.',
  'Výpočet pro každý řádek tabulky zvlášť.',
]
answer = 0
explanation = '''
Uvede se **každý použitý vztah s číselným dosazením** (s jednotkami a hodnotami konstant) a hned konečný výsledek. Opakuje-li se výpočet vícekrát, stačí jeden příklad.
'''
notes = [
  '',
  'Bez dosazení nejde zkontrolovat, jak výsledek vznikl.',
  'Mezivýpočty se vynechávají a deset míst je víc, než dovolí přesnost.',
  'U opakovaného výpočtu stačí jeden příklad.',
]

[[question]]
id = 'P08-03'
topic = 'Protokol o měření'
source = 'Úvod do měření, 6.2'
text = '''
Co musí mít každá tabulka v protokolu?
'''
options = [
  'Barevné záhlaví.',
  'Číslo, název a veličiny s jednotkami v záhlaví.',
  'Jednotku u každého čísla v buňce.',
  'Jen čísla, jednotky jsou v textu.',
]
answer = 1
explanation = '''
Tabulka má **číslo a název**, veličiny v záhlaví mají **jednotky** a rastr se rýsuje podle pravítka. U každé měřené veličiny se uvede výpočet nebo odhad chyby.
'''
notes = [
  'Barva není požadavek.',
  '',
  'Jednotka v záhlaví platí pro celý sloupec, k číslům se nepíše.',
  'Bez jednotek v záhlaví je tabulka neúplná.',
]

[[question]]
id = 'P08-04'
topic = 'Protokol o měření'
source = 'Úvod do měření, 5.1'
text = '''
Jak se vede záznam o měření v laboratoři?
'''
options = [
  'Na libovolný papír, doma se přepíše načisto.',
  'Do mobilu, protokol se píše později.',
  'Stačí zapsat výsledky, postup a přístroje se doplní doma.',
  'Rovnou v konečné podobě současně s měřením, záznam podepisuje vyučující.',
]
answer = 3
explanation = '''
Poznámky se píšou **v konečné podobě současně s měřením** do sešitu nebo na předepsaný list a vyučující je podepíše. Přepisování „načisto“ je zbytečné. Záznam musí obsahovat všechno potřebné ke zpracování včetně přístrojů a čísel vzorků.
'''
notes = [
  'Přepisování načisto Úvod označuje za zbytečné a neodpovídající praxi.',
  'Záznam musí být hotový a podepsaný v laboratoři.',
  'Přístroje a vzorky se zapisují hned, doma už je nezjistíte.',
  '',
]

[[question]]
id = 'P08-05'
topic = 'Protokol o měření'
source = 'Úvod do měření, 5.5'
text = '''
Napětí měříte ručkovým voltmetrem jen jednou. Co si kromě hodnoty musíte zapsat, abyste mohli určit chybu?
'''
options = [
  'Třídu přesnosti a použitý rozsah.',
  'Barvu přístroje.',
  'Jen výrobce přístroje.',
  'Nic, jedno měření chybu nemá.',
]
answer = 0
explanation = '''
Chyba se určuje i u jednorázových měření, obvykle jako mezní odhad z **třídy přesnosti** a **rozsahu**: $u = T_\mathrm{p}/100\cdot X_\text{rozsah}$. Bez nich chybu nespočítáte.
'''
notes = [
  '',
  'Barva s přesností nesouvisí.',
  'Výrobce nestačí, potřebná je třída přesnosti a rozsah (a výrobní číslo přístroje).',
  'Každé měření má chybu, u jednoho měření se odhadne z přístroje.',
]

[[question]]
id = 'P08-06'
topic = 'Protokol o měření'
source = 'Úvod do měření, 6.2'
text = '''
Naměřili jste $g = (9{,}72 \pm 0{,}02)\ \mathrm{m\,s^{-2}}$, tabulková hodnota je $9{,}81\ \mathrm{m\,s^{-2}}$. Co napíšete do závěru?
'''
options = [
  'Výsledek souhlasí, rozdíl je jen asi 1 %.',
  'Rozdíl $0{,}09$ je větší než $3\delta = 0{,}06$, měření je pravděpodobně zatížené soustavnou (nebo hrubou) chybou; uvedu možnou příčinu.',
  'Měření je neplatné a je nutné ho zopakovat.',
  'Tabulková hodnota je pro jiné místo, porovnávat se nemá.',
]
answer = 1
explanation = '''
Rozdíl $\lvert 9{,}81 - 9{,}72\rvert = 0{,}09\ \mathrm{m\,s^{-2}}$ je větší než trojnásobek chyby $3\cdot0{,}02 = 0{,}06\ \mathrm{m\,s^{-2}}$. Podle Úvodu je pak měření pravděpodobně zatížené **soustavnou chybou** (nevhodná metoda, zanedbaný vliv) nebo hrubou chybou. V závěru se uvede možná příčina a návrh zlepšení.
'''
notes = [
  'Kritériem není procento, ale trojnásobek chyby měření.',
  '',
  'Nesoulad není důvod měření zahodit, ale příležitost hledat příčinu.',
  'Porovnání s tabulkovou hodnotou do zhodnocení patří.',
]

[[question]]
id = 'P08-07'
topic = 'Protokol o měření'
source = 'Úvod do měření, 5.5'
text = '''
S jakou přesností se obvykle žádají běžná laboratorní měření v praktiku?
'''
options = ['do 0,01 %', 'do 1 %, někdy do 5 %', 'do 10 %', 'do 25 %']
answer = 1
layout = 'grid'
explanation = '''
Normální laboratorní měření se žádají s přesností **do 1 %**, někdy až do 5 %. Stačí na to běžné kvalitní přístroje a vhodná metoda. U orientačních měření se připouští 10 %.
'''
notes = [
  'Tak přesná měření běžné laboratorní přístroje nedovolí.',
  '',
  'To je mez pro orientační měření.',
  'To by bylo i na orientační měření příliš.',
]

