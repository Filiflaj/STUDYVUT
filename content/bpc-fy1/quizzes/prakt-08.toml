answer = 1
explanation = '''
Dosadí se hodnoty **i s jednotkami** (v SI nebo s předponami, které se správně převedou) a výsledek s jednotkou. Rovnice musí být rozměrově homogenní.
'''
notes = [
  'Bez jednotek nejde poznat, že proud byl v miliampérech, a výsledek je o tři řády špatně.',
  '',
  'Chybí dosazení i jednotka.',
  'Volt na miliampér je kiloohm, ne ohm: chyba v převodu jednotek.',
]
