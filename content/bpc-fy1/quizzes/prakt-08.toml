name = 'Praktikum: příprava, záznam a protokol'
description = 'co patří do přípravy, záznamu z měření a protokolu, zhodnocení výsledku'

[[question]]
id = 'P08-01'
topic = 'Protokol o měření'
source = 'Úvod do měření, 6.2'
text = '''
Jak má vypadat popis metody v protokolu?
'''
options = [
  'Doslovně opsané celé pasáže z návodu, aby nic nechybělo.',
  'Jen seznam vzorců bez vysvětlení.',
  'Teorie vlastními slovy, vztahy potřebné ke zpracování a vysvětlení všech symbolů.',
  'Popis metody do protokolu nepatří, stačí výsledky.',
]
answer = 2
explanation = '''
Popis metody uvádí teoretický základ **vlastními slovy** (opisovat celé pasáže návodu se nemá), vztahy potřebné ke zpracování a **vysvětlení symbolů**. Rovnice je vhodné číslovat.
'''
notes = [
  'Úvod výslovně žádá neopisovat doslova pasáže skripta.',
  'Ke každému vzorci patří vysvětlení symbolů.',
  '',
  'Popis metody je povinná část protokolu.',
]

[[question]]
