[[question]]
id = 'P08-10'
topic = 'Protokol o měření'
source = 'Úvod do měření, 5.1'
text = '''
Co je podle Úvodu nejdůležitější částí přípravy na měření?
'''
options = [
  'Opsat si návod do sešitu.',
  'Přesně si ujasnit, jaký problém se má řešit a co je hlavním cílem měření.',
  'Připravit si tabulky s vymyšlenými hodnotami.',
  'Zjistit, kdo bude ve skupině.',
]
answer = 1
explanation = '''
Nejdůležitější je **přesná formulace problému** a hlavního cíle měření. Pak nastudovat teorii tak, abyste věděli, jaký výsledek čekat, vypsat veličiny k měření a odhadnout rozsah a počet bodů.
'''
notes = [
  'Opisování návodu není příprava, je potřeba ho pochopit.',
  '',
  'Tabulky si připravit můžete, ale vymyšlené hodnoty ne.',
  'Se zaměřením přípravy to nesouvisí.',
]

[[question]]
id = 'P08-11'
topic = 'Protokol o měření'
source = 'Úvod do měření, 5.5'
text = '''
Výsledek vám vyšel jinak, než uvádějí tabulky. Jak to chápat?
'''
options = [
  'Měření je nepovedené, výsledek je potřeba upravit, aby souhlasil.',
  'Protokol se neodevzdává.',
  'Nesoulad není nežádoucí: je to příležitost hledat příčinu, rozebrat chyby a v závěru ji zdůvodnit.',
  'Stačí výsledek vynechat a uvést tabulkovou hodnotu.',
]
answer = 2
explanation = '''
Nesoulad naměřené a očekávané hodnoty nemusí být neočekávaný ani nežádoucí. Je to příležitost k hledání zdrojů rozdílu. Výsledek se uvede tak, jak vyšel, porovná se s tabulkovou hodnotou s ohledem na chybu a příčina se rozebere.
'''
notes = [
  'Upravovat výsledky je nepřípustné.',
  'Protokol se odevzdává vždy.',
  '',
  'Výsledek měření je to, co se hodnotí, nesmí chybět.',
]

[[question]]
id = 'P08-12'
topic = 'Protokol o měření'
