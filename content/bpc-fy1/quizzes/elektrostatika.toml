  'jen na povrchu, uvnitř je $E = 0$',
  'soustředí se ve středu',
  'na povrchu, uvnitř je pole maximální',
  'závisí na znaménku náboje',
]
answer = 1
explanation = '''
Ve vodiči se volné náboje pohybují, dokud na ně působí síla. V rovnováze proto musí být uvnitř vodiče $E = 0$. Z Gaussova zákona pak plyne, že uvnitř není žádný náboj a veškerý přebytek sedí **na povrchu**. Proto je pole nabité vodivé koule stejné jako pole slupky (graf c).
'''
notes = [
  'Tak je to u nevodivé (izolační) koule.',
  '',
  'Souhlasné náboje se odpuzují co nejdál od sebe.',
  'Uvnitř vodiče je pole nulové.',
  'Platí pro oba typy náboje.',
]

