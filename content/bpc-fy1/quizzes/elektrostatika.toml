[[question]]
id = 'B6'
topic = 'Coulombův zákon'
source = 'Test B (2015) · B6'
tags = ["old"]
text = '''
Dva náboje $Q_1$ a $Q_2$ odděluje vzdálenost $L$. Pokud se velikosti $Q_1$, $Q_2$ **a** $L$ zdvojnásobí, velikost síly působící mezi oběma náboji:
'''
figure = 'images/naboje-q1-q2.svg'
options = [
