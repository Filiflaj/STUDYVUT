$$Q = C \cdot U = 0{,}1 \cdot 10^{-3} \cdot 1000 = 0{,}1\,\mathrm{C}$$

Na každém je napětí 500 V. Srovnej s B2, kde je zapojení paralelní a na každém je 0,2 C.
