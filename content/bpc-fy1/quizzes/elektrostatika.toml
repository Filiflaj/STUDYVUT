Před dotykem: $F \propto 5 \cdot 1 = 5$. Po dotyku: $F \propto 2 \cdot 2 = 4$. Poměr po/před = **4/5**. Navíc se změní charakter síly: předtím se koule přitahovaly, potom se odpuzují.
