[[question]]
id = 'B8'
topic = 'Tok a Gaussův zákon'
source = 'Test B (2015) · B8'
tags = ["old"]
text = '''
Na obrázku je znázorněno elektrické pole o intenzitě 1000 N/C, které protíná plochu o velikosti $S = 100\,\mathrm{cm^2}$. Vektor plochy $S$ svírá s intenzitou obecně úhel $\alpha$. Jaký bude tok vektoru intenzity touto plochou, pokud úhel $\alpha$ bude 90°?
'''
figure = 'images/plocha-v-homogennim-poli.svg'
options = [
  '0 N·m²/C',
  '10 N·m²/C',
  '100 N·m²/C',
  '1000 N·m²/C',
  '10 000 N·m²/C',
]
answer = 0
explanation = '''
Tok rovinnou plochou:

$$\Phi = E \cdot S \cdot \cos\alpha$$

$\alpha$ je úhel mezi **vektorem plochy** (normálou) a $E$. Pro $\alpha = 90^\circ$ je $\cos \alpha = 0$, takže $\Phi = 0$. Plocha je pak rovnoběžná se siločárami a žádná jí neprochází.
'''
notes = [
  '',
  '10 by vyšlo pro $\alpha = 0^\circ$: 1000 · 0,01 = 10. Pozor, 100 cm² = 0,01 m².',
  'Chybný převod cm² na m².',
  'Vychází z dosazení $S = 1\,\mathrm{m^2}$ a $\alpha = 0$.',
  'Chybný převod cm² na m².',
]
warning = 'Na fotce je zakroužkována d). Správně je a), jak je dopsáno červeně.'

[[question]]
id = 'B10'
topic = 'Gaussův zákon'
source = 'Test B (2015) · B10 (přepsáno na výběr)'
tags = ["old"]
text = '''
Nabitá kovová kulička se nachází v kapalině (petroleji) o relativní permitivitě $\varepsilon_r$. Má povrch o velikosti $S$ a náboj je po něm rozprostřen s hustotou $\sigma$. Jaká je intenzita pole v bodě v kapalině, mimo kuličku, ve vzdálenosti $\ell$ od jejího středu?
'''
figure = 'images/kulicka-v-kapaline.svg'
options = [
  '$\sigma / (\varepsilon_0\varepsilon_r)$',
  '$\sigma S / (4\pi \varepsilon_0 \varepsilon_r \ell^2)$',
  '$\sigma S / (4\pi \varepsilon_0 \ell^2)$',
  '$\sigma / (4\pi \varepsilon_0 \varepsilon_r \ell^2)$',
  '0',
]
answer = 1
explanation = '''
Celkový náboj kuličky je $Q = \sigma \cdot S$. Gaussův zákon pro kouli o poloměru $\ell$ v dielektriku:

$$\oint E \cdot dS = \frac{Q}{\varepsilon_0 \varepsilon_r} \quad\Rightarrow\quad E \cdot 4\pi\ell^2 = \frac{\sigma S}{\varepsilon_0 \varepsilon_r}$$

$$E = \frac{\sigma S}{4\pi \varepsilon_0 \varepsilon_r \ell^2}$$
'''
notes = [
  'Takhle vypadá intenzita těsně u povrchu vodiče, ne ve vzdálenosti $\ell$.',
  '',
  'Chybí $\varepsilon_r$. Dielektrikum pole $\varepsilon_r$-krát zeslabí.',
  '$\sigma$ je plošná hustota, ne náboj. Chybí S a rozměr nesedí.',
  'Nulová intenzita je uvnitř vodivé kuličky, ne vně.',
]

