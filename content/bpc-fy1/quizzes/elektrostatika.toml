explanation = '''
Uvnitř plné nevodivé koule obsahuje Gaussova koule o poloměru $r$ náboj $Q \cdot (r/R)^3$:

$$E \cdot 4\pi r^2 = \frac{Q r^3}{\varepsilon_0 R^3} \quad\Rightarrow\quad E = \frac{Q r}{4\pi \varepsilon_0 R^3} \propto r$$

Uvnitř tedy $E$ roste lineárně, vně klesá jako $1/r^2$. Maximum je na povrchu.
'''
notes = [
  'Uvnitř nemůže klesat od středu, ve středu je $E = 0$.',
  'Uvnitř není konstantní.',
  'Nula uvnitř platí pro vodivou kouli nebo slupku.',
  '',
  'Uvnitř roste lineárně, ne kvadraticky.',
]

[[question]]
id = 'X17'
topic = 'Náboj a vodiče'
source = 'Procvičování'
text = '''
Kde se nachází přebytečný náboj na vodiči v elektrostatické rovnováze?
'''
options = [
