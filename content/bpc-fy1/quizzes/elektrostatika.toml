$$F = k \cdot \frac{Q_1 Q_2}{L^2} \quad\to\quad k \cdot \frac{(2Q_1)(2Q_2)}{(2L)^2} = k \cdot \frac{4Q_1 Q_2}{4L^2} = F$$

Čtyřnásobek v čitateli se vykrátí se čtyřnásobkem ve jmenovateli.
'''
notes = [
  'Zapomíná na druhou mocninu L nebo na jeden z nábojů.',
  '',
  'Takhle by to vyšlo, kdyby se zdvojnásobila jen vzdálenost L.',
  'Neodpovídá žádné kombinaci.',
  'Takhle by to vyšlo, kdyby se zdvojnásobily jen náboje.',
]
