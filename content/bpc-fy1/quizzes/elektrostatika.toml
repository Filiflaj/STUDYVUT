[[question]]
id = 'A9'
topic = 'Intenzita E(r)'
source = 'Test A (2014) · A9'
tags = ["old"]
text = '''
Na kterém z grafů je zobrazena velikost intenzity elektrického pole jako funkce vzdálenosti $r$ od středu nabité duté tenké vodivé kulové vrstvy (slupky) o poloměru $R$?
'''
figure = 'images/grafy-e-r.svg'
options = [
  'graf a)',
  'graf b)',
  'graf c)',
  'graf d)',
  'graf e)',
]
answer = 2
keep_order = true
explanation = '''
**Uvnitř** ($r < R$): Gaussova koule menší než slupka neobsahuje žádný náboj (ten je celý na povrchu), takže $E = 0$.

**Vně** ($r > R$): slupka působí jako bodový náboj ve středu:

$$E = \frac{Q}{4\pi\varepsilon_0 r^2}$$

Na poloměru $R$ je skok z nuly na maximum, pak pokles s $1/r^2$.
'''
notes = [
  'Uvnitř nemůže být pole největší, je tam nulové.',
  'Konstantní nenulové pole uvnitř by vyžadovalo náboj uvnitř.',
  '',
  'Lineární růst uvnitř platí pro rovnoměrně nabitou plnou nevodivou kouli.',
  'Růst uvnitř by vyžadoval náboj uvnitř.',
]

