[[question]]
id = 'E15'
kind = "numeric"
topic = 'Tok a Gaussův zákon'
source = 'E-learning'
tags = ["old"]
text = '''
Jehlan, jehož základnou je čtverec o straně $a$, neobklopuje žádný elektrický náboj. Je vložen do homogenního elektrického pole $E$ kolmého k jeho základně. Siločáry do jehlanu vstupují pláštěm a vystupují základnou. Vypočtěte tok elektrické intenzity **pláštěm** jehlanu $\Phi_{\text{plášť}}$ (na dvě desetinná místa) pro $a = 1{,}7\,\mathrm{m}$ a $E = 57{,}8\,\mathrm{V/m}$.
'''
figure = 'images/jehlan-v-poli.svg'
value = -167.04
tolerance = 0.1
unit = 'V·m'
sign_hint = 'Tok, který do uzavřené plochy vstupuje, je záporný.'
explanation = '''
Jehlan je uzavřená plocha bez náboje, celkový tok je tedy podle Gaussova zákona nulový:

$$\Phi_{\text{plášť}} + \Phi_{\text{základna}} = 0$$

Základnou siločáry vystupují kolmo: $\Phi_{\text{základna}} = +E \cdot a^2 = 57{,}8 \cdot 2{,}89 = 167{,}04\,\mathrm{V \cdot m}$. Pláštěm vstupují, tok je záporný:

$$\Phi_{\text{plášť}} = -E \cdot a^2 = -167{,}04\,\mathrm{V \cdot m}$$

Znaménko: vystupující tok je kladný, vstupující záporný (normála uzavřené plochy míří ven).
'''

