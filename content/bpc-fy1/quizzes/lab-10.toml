name = 'Úloha 10: Tíhové zrychlení'
description = 'vstupní test: fyzické a matematické kyvadlo, redukovaná délka'

[[question]]
id = 'L10-01'
kind = 'numeric'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Návod, Dodatek, úloha 10'
tags = ["lab"]
text = '''
Doba kmitu fyzického kyvadla je $4\pi$ sekund. Jak velká je jeho redukovaná délka? ($g = 9{,}81\ \mathrm{m\,s^{-2}}$)
'''
value = 39.24
tolerance = 0.1
unit = 'm'
explanation = '''
Redukovaná délka je délka matematického kyvadla se stejnou dobou kmitu. Z $T = 2\pi\sqrt{\ell_\mathrm{r}/g}$:
$$\ell_\mathrm{r} = \frac{g\,T^2}{4\pi^2} = \frac{g\cdot16\pi^2}{4\pi^2} = 4g = 39{,}24\ \mathrm{m}$$
'''

[[question]]
id = 'L10-02'
kind = 'numeric'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Návod, Dodatek, úloha 10'
tags = ["lab"]
text = '''
Fyzické kyvadlo má hmotnost $m = 0{,}6\ \mathrm{kg}$, vzdálenost osy od těžiště $d = 0{,}9\ \mathrm{m}$ a dobu kmitu $T = 4\ \mathrm{s}$. Jaký je jeho moment setrvačnosti? ($g = 9{,}81\ \mathrm{m\,s^{-2}}$)
'''
value = 2.147
tolerance = 0.01
unit = 'kg·m²'
explanation = '''
Z $T = 2\pi\sqrt{\dfrac{J}{mgd}}$ vyjádříme $J$:
$$J = \frac{T^2\,m g d}{4\pi^2} = \frac{16\cdot0{,}6\cdot9{,}81\cdot0{,}9}{4\pi^2} = \frac{84{,}76}{39{,}48} \doteq 2{,}15\ \mathrm{kg\,m^2}$$
'''

[[question]]
id = 'L10-03'
kind = 'numeric'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Návod, Dodatek, úloha 10'
tags = ["lab"]
text = '''
Fyzické kyvadlo má moment setrvačnosti $J = 0{,}12\ \mathrm{kg\,m^2}$, hmotnost $m = 0{,}5\ \mathrm{kg}$ a vzdálenost osy od těžiště $d = 0{,}4\ \mathrm{m}$. Jaká je jeho doba kmitu? ($g = 9{,}81\ \mathrm{m\,s^{-2}}$)
'''
value = 1.554
tolerance = 0.01
unit = 's'
explanation = '''
$$T = 2\pi\sqrt{\frac{J}{mgd}} = 2\pi\sqrt{\frac{0{,}12}{0{,}5\cdot9{,}81\cdot0{,}4}} = 2\pi\sqrt{0{,}0612} \doteq 1{,}55\ \mathrm{s}$$
'''

[[question]]
id = 'L10-04'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Návod, Dodatek, úloha 10'
tags = ["lab"]
text = '''
U fyzického kyvadla se změní moment setrvačnosti $J$, hmotnost $m$ nebo vzdálenost osy od těžiště $d$, ale tak, že doba kmitu zůstane stejná. Změní se jeho redukovaná délka?
'''
options = [
  'Nezmění, redukovaná délka je určená jen dobou kmitu.',
  'Ano, změní se úměrně $J$.',
  'Ano, změní se nepřímo úměrně $m$.',
  'Záleží na tom, která z veličin se změnila.',
]
answer = 0
explanation = '''
Redukovaná délka je délka matematického kyvadla se **stejnou dobou kmitu**: $\ell_\mathrm{r} = gT^2/(4\pi^2)$. Zůstane-li $T$ stejná, zůstane stejná i $\ell_\mathrm{r}$.
'''
notes = [
  '',
  '$\ell_\mathrm{r} = J/(md)$, ale když se $T$ nezmění, nezmění se ani tento podíl.',
  'Změny $J$, $m$ a $d$ se při stejné $T$ vzájemně vyrovnají.',
