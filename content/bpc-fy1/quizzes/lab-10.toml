]

[[question]]
id = 'L10-05'
kind = 'numeric'
topic = 'Úloha 10: reverzní kyvadlo'
source = 'Návod, úloha 10'
tags = ["lab"]
text = '''
Reverzní kyvadlo je nastavené tak, že doby kmitu kolem obou os jsou stejné, $T = 2{,}000\ \mathrm{s}$. Vzdálenost břitů je $99{,}4\ \mathrm{cm}$. Jaké vyjde tíhové zrychlení?
'''
value = 9.810
tolerance = 0.005
unit = 'm/s²'
explanation = '''
Vzdálenost břitů je redukovaná délka:
$$g = \frac{4\pi^2\ell_\mathrm{r}}{T^2} = \frac{4\pi^2\cdot0{,}994}{2{,}000^2} = 9{,}810\ \mathrm{m\,s^{-2}}$$
'''
warning = 'Délku dosaďte v metrech.'

