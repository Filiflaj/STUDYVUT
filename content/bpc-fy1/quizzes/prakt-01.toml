[[question]]
id = 'P01-01'
topic = 'Praktikum: hodnocení a zápočet'
source = 'Hodnocení ve Fyzikálním praktiku 1'
tags = ["pred-praktikem"]
text = '''
Kolik nejvýš bodů lze získat za fyzikální praktikum, včetně bonifikace?
'''
options = ['10', '12', '14', '15']
answer = 1
layout = 'grid'
explanation = '''
Průměrná známka 1,00 až 1,10 dává 12 bodů. Bonifikace (nejvýš 2 body) a srážky za neomluvenou neúčast se k tomu přičítají a odečítají, ale výsledek je vždy **mezi 0 a 12 body**.
'''
notes = [
  'Tolik je za průměr 1,51 až 1,90.',
  '',
  'Bonifikace maximum nezvýší, body se zastaví na 12.',
  'Tolik se za praktikum získat nedá.',
]

[[question]]
id = 'P01-02'
topic = 'Praktikum: hodnocení a zápočet'
source = 'Hodnocení ve Fyzikálním praktiku 1'
tags = ["pred-praktikem"]
text = '''
Splnili jste všechny povinnosti v praktiku. Kolik bodů za praktikum potřebujete nejméně, abyste dostali zápočet z praktika?
'''
options = ['0', '1', '6', '2']
answer = 3
layout = 'grid'
explanation = '''
Minimum jsou **2 body**, tedy průměrná známka nejvýš 4,10. S menším počtem bodů se zápočet z praktika neuděluje, i když jsou všechny povinnosti splněné.
'''
notes = [
  'S nulou bodů zápočet z praktika nedostanete.',
  'Jeden bod nestačí, minimum jsou 2 body.',
  'Šest bodů je polovina maxima, minimum je nižší.',
  '',
]

[[question]]
id = 'P01-03'
kind = 'numeric'
topic = 'Praktikum: hodnocení a zápočet'
source = 'Hodnocení ve Fyzikálním praktiku 1'
tags = ["pred-praktikem"]
text = '''
Za semestr máte známky 1, 2, 1, 3, 2, 1, 2. Kolik bodů za praktikum dostanete podle převodní tabulky (bez bonifikace a srážek)?
'''
value = 10
tolerance = 0
unit = 'bodů'
explanation = '''
Průměr na dvě desetinná místa:
$$\frac{1 + 2 + 1 + 3 + 2 + 1 + 2}{7} = \frac{12}{7} = 1{,}714 \doteq 1{,}71$$
Průměr 1,71 leží v pásmu 1,51 až 1,90, tomu odpovídá **10 bodů**.
'''

[[question]]
id = 'P01-04'
kind = 'numeric'
topic = 'Praktikum: hodnocení a zápočet'
source = 'Hodnocení ve Fyzikálním praktiku 1'
tags = ["pred-praktikem"]
text = '''
Průměrná známka vyšla 2,45. Vyučující přidal 1 bod bonifikace a jednou jste neomluveně chyběli (cvičení jste s jeho svolením nahradili). Kolik bodů za praktikum máte?
'''
value = 8
tolerance = 0
unit = 'bodů'
explanation = '''
Průměr 2,45 je v pásmu 2,31 až 2,60, to je 8 bodů. Bonifikace přidá 1 bod, neomluvená neúčast 1 bod ubere:
$$8 + 1 - 1 = 8\ \text{bodů}$$
'''

