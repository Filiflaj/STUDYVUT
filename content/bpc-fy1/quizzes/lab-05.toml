text = '''
Jak velká je normálová síla, kterou působí nakloněná rovina se sklonem $\alpha$ na těleso o hmotnosti $m$ (bez dalších sil)?
'''
options = ['$mg\cos\alpha$', '$mg\sin\alpha$', '$mg$', '$mg\operatorname{tg}\alpha$']
answer = 0
layout = 'grid'
explanation = '''
Kolmo k rovině se těleso nepohybuje, normálová síla tedy vyrovnává kolmou složku tíhy: $N = G_y = mg\cos\alpha$.
'''
notes = [
  '',
  '$mg\sin\alpha$ je složka tíhy podél roviny, ta těleso urychluje.',
  'Celá tíha by to byla jen na vodorovné podložce.',
  'Tangens vystupuje v podmínce rozjezdu, ne v normálové síle.',
]

