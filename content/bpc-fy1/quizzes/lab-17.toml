[[question]]
id = 'L17-15'
topic = 'Úloha 17: ručkové přístroje'
source = 'Návod, úloha 17'
tags = ["lab"]
text = '''
Magnetoelektrickým voltmetrem s usměrňovačem měříte jednocestně usměrněné napětí a odečtete $U_\text{měř} = 12{,}0\ \mathrm{V}$. Jaká je amplituda tohoto napětí?
'''
options = ['$33{,}9\ \mathrm{V}$', '$17{,}0\ \mathrm{V}$', '$37{,}7\ \mathrm{V}$', '$24{,}0\ \mathrm{V}$']
answer = 0
layout = 'grid'
explanation = '''
Stupnice je cejchovaná pro harmonický průběh. Nejdřív se údaj přepočte na skutečnou střední hodnotu, $U_\mathrm{s} = \frac{2\sqrt2}{\pi}U_\text{měř} \doteq 10{,}8\ \mathrm{V}$, a pak podle vztahu pro jednocestné usměrnění:
$$U_\mathrm{M} = \pi U_\mathrm{s} = 2\sqrt2\,U_\text{měř} \doteq 2{,}83\cdot12{,}0 \doteq 33{,}9\ \mathrm{V}$$
'''
notes = [
  '',
  'To je $\sqrt2\,U_\text{měř}$, tedy efektivní hodnota po přepočtu, ne amplituda.',
  'To je $\pi U_\text{měř}$ bez přepočtu činitelem tvaru.',
  'To je $2U_\text{měř}$, vztah $U_\mathrm{ef} = U_\mathrm{M}/2$ platí pro skutečnou efektivní hodnotu, ne pro údaj tohoto voltmetru.',
]
