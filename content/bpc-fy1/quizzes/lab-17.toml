options = ['$60/120$', '$0{,}5$', '$1/2$', '$120/60$']
answer = 0
layout = 'grid'
explanation = '''
Konstanta rozsahu je rozsah / počet dílků a zapisuje se jako **nezkrácený zlomek**, aby šlo zpětně zjistit, jaký byl rozsah a jak vzniklo napětí $U = \alpha k$.
'''
notes = [
