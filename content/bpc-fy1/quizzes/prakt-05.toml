'''
value = 0.255
tolerance = 0.004
unit = 'Ω'
explanation = '''
$$\bar R = \frac{236{,}9}{5} = 47{,}38\ \Omega$$
Odchylky: $-0{,}08$; $0{,}22$; $-0{,}28$; $0{,}12$; $0{,}02$, součet čtverců $0{,}0064 + 0{,}0484 + 0{,}0784 + 0{,}0144 + 0{,}0004 = 0{,}1480\ \Omega^2$.
$$s_{\bar R} = \sqrt{\frac{0{,}1480}{5\cdot4}} = 0{,}0860\ \Omega \qquad \delta = 2{,}968\cdot0{,}0860 = 0{,}255\ \Omega$$
Zapsáno: $R = (47{,}4 \pm 0{,}3)\ \Omega$, $n = 5$, $P = 95\ \%$.
'''

