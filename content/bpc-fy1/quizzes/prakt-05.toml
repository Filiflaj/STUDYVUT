[[question]]
id = 'P05-06'
kind = 'numeric'
topic = 'Chyby měření'
source = 'Úvod do měření, 6'
tags = ["pocty"]
text = '''
Kalkulačka ukázala pro 10 měření výběrovou směrodatnou odchylku $\sigma_{n-1} = 0{,}0632\ \mathrm{mm}$. Jaká je výběrová směrodatná odchylka aritmetického průměru $s_{\bar x}$?
'''
value = 0.0200
tolerance = 0.0003
unit = 'mm'
explanation = '''
$$s_{\bar x} = \frac{\sigma_{n-1}}{\sqrt n} = \frac{0{,}0632}{\sqrt{10}}\ \mathrm{mm} = \frac{0{,}0632}{3{,}162}\ \mathrm{mm} = 0{,}0200\ \mathrm{mm}$$
Chyba výsledku pro $P = 95\ \%$ je pak $\delta = 2{,}320\cdot0{,}0200 = 0{,}046\ \mathrm{mm}$.
'''

