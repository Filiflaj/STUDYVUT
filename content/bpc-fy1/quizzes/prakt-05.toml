  'Osobní chyba, soustavná.',
  'Chyba metody.',
  'Chyba z třídy přesnosti.',
]
answer = 1
explanation = '''
Pozdě spuštěné stopky, odečet zešikma (**paralaktická chyba**) nebo hrubý odhad zlomků dílku jsou **osobní chyby**. Mají soustavný charakter a nejúčinněji je odstraní automatizace měření.
'''
notes = [
  'Paralaxa nezávisí na přístroji, ale na tom, jak se díváte, a posouvá odečty stejným směrem.',
  '',
  'Metoda je v pořádku, chybuje pozorovatel.',
  'Třída přesnosti zahrnuje chyby přístroje, ne chyby odečtu.',
]

