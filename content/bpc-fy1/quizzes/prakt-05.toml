$\Delta t = (13{,}8 \pm 0{,}6)\ ^\circ\mathrm{C}$, relativní chyba asi 4,3 %, mnohem víc než u obou teplot.
'''
warning = 'Chyby se neodečítají, ani když se veličiny odečítají.'

