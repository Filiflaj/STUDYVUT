explanation = '''
Z 2. Newtonova zákona $a = F/m$. Při stejné síle je zrychlení nepřímo úměrné hmotnosti:

$$a_A = \frac{F}{m_A} = 3 \cdot \frac{F}{m_B} = 3 \cdot a_B$$
'''
notes = [
  '',
  'Obrácený poměr. Lehčí těleso A má větší zrychlení, ne menší.',
  'Devítka by vyšla pro závislost 1/m². Zrychlení je úměrné 1/m.',
  'Stejné zrychlení by vyžadovalo stejné hmotnosti.',
  'Devítka by vyšla pro závislost 1/m², navíc obráceně.',
