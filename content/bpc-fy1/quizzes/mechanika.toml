[[question]]
id = 'E4'
topic = 'Práce'
source = 'E-learning'
tags = ["old"]
text = '''
Na tělesa, která se pohybují po vodorovné podlaze (doprava, o dráhu $s$), působí síly stejné velikosti $F$, ale různých směrů. Která síla vykoná **nejmenší** práci?
'''
options = [
  '![](images/prace-sila-a.svg)',
  '![](images/prace-sila-b.svg)',
  '![](images/prace-sila-c.svg)',
  '![](images/prace-sila-d.svg)',
  '![](images/prace-sila-e.svg)',
]
answer = 3
layout = "grid"
explanation = '''
Práce stálé síly je skalár se znaménkem:

$$W = F \cdot s \cdot \cos\varphi$$

kde $\varphi$ je úhel mezi silou a posunutím. a) $\varphi = 0^\circ$: $W = Fs$. b) $\varphi = \alpha$: $W = Fs \cos \alpha$. c) $\varphi = 90^\circ$: $W = 0$. e) $\varphi = 180^\circ - \alpha$: $W = -Fs \cos \alpha$. d) $\varphi = 180^\circ$: $W = -Fs$, to je **nejmenší (nejzápornější)** hodnota.

Pozor na zadání: kdyby se ptali na sílu, která *nekoná žádnou práci*, je to F₃ (kolmá k pohybu).
'''
notes = [
  'Největší práce, $W = Fs$.',
  '$W = Fs \cos \alpha$, kladná.',
  '$W = 0$. Je to nejmenší velikost práce, ale ne nejmenší hodnota, protože d) a e) jsou záporné.',
  '',
  '$W = -Fs \cos \alpha$ je záporná, ale v absolutní hodnotě menší než Fs.',
]
warning = 'Ve screenshotu je vybrána c). Podle ustálené formulace (Halliday) se myslí nejmenší hodnota práce se znaménkem, tedy d). Pokud chceš mít jistotu, zeptej se vyučujícího, jak to myslí.'

