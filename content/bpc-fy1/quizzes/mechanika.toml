[[question]]
id = 'B7'
topic = 'Normálová síla'
source = 'Test B (2015) · B7'
tags = ["old"]
text = '''
Krabice o hmotnosti $m$ leží na podlaze. Na krabici působí síla $F$ tak, jak je to vidět na obrázku. Velikost normálové síly $N$, kterou působí podlaha na krabici, je:
'''
figure = 'images/krabice-tah-sikmo-nahoru.svg'
options = [
  '$N = F \cdot \cos \theta$',
  '$N > mg$',
  '$N = mg$',
  '$N < mg$',
  '$N = F \cdot \sin \theta$',
]
answer = 3
explanation = '''
Síla $F$ míří šikmo nahoru a její svislá složka $F \sin \theta$ krabici nadlehčuje. Ve svislém směru je rovnováha:

$$N + F\sin\theta = mg \quad\Rightarrow\quad N = mg - F\sin\theta < mg$$
'''
notes = [
  'Normálová síla musí obsahovat tíhu mg.',
  'Větší by byla, kdyby F tlačila šikmo dolů.',
  '$N = mg$ platí jen pro vodorovnou sílu.',
  '',
  'Normálová síla musí obsahovat tíhu mg.',
]
warning = 'Na fotce je zakroužkována c) $N = mg$. To je chyba, správně je d).'

[[question]]
id = 'B9'
topic = 'Vrhy'
source = 'Test B (2015) · B9'
tags = ["old"]
text = '''
Která z uvedených křivek nejlépe charakterizuje závislost svislé složky rychlosti $v_y$ na čase $t$ u projektilu, který byl vystřelen vzhůru pod úhlem 45° od vodorovného směru?
'''
figure = 'images/graf-krivek.svg'
options = [
  'AB',
  'AP',
  'AF',
  'DE',
  'OC',
]
answer = 1
explanation = '''
Svislý pohyb je rovnoměrně zpomalený se zrychlením $-g$:

$$v_y = v_0 \sin 45^\circ - g \cdot t$$

To je lineární funkce se zápornou směrnicí. Začíná kladnou hodnotou (bod A), v nejvyšším bodě dráhy protne osu $t$ ($v_y = 0$) a pak je záporná (projektil padá). To je přímka AP.
'''
notes = [
  'Konstantní, takhle se chová vodorovná složka $v_x$.',
  '',
  'Rostoucí, to by vyžadovalo zrychlení nahoru.',
  'Konstantní záporná, to je pád stálou rychlostí.',
  'Začíná nulou a je zakřivená, takhle vypadá spíš výška y(t).',
]
warning = 'Na fotce je zakroužkována e), správně je b) AP (dopsáno červeně).'

