[[question]]
id = 'A7'
topic = 'Energie'
source = 'Test A (2014) · A7'
tags = ["old"]
text = '''
Aby se kostka o hmotnosti $m$ dostala sklouznutím po dokonale hladkém povrchu nahoru na plošinu ve výšce $h$, musí mít počáteční kinetickou energii minimálně:
'''
figure = 'images/kostka-plosina-h.svg'
options = [
  '$gh$',
  '$gh/2$',
  '$mgh/2$',
  '$mgh$',
  '$2mgh$',
]
answer = 3
explanation = '''
Povrch je hladký, takže se mechanická energie zachovává:

$$E_{k0} = mgh + E_k(\text{nahoře})$$

Minimum nastane, když kostka dorazí nahoru s nulovou rychlostí: $E_{k0} = mgh$.
'''
notes = [
  'gh nemá jednotku energie (J), chybí hmotnost. Rozměrová kontrola ji hned vyřadí.',
  'Chybí hmotnost, nejde o energii.',
  'Energie mgh/2 by stačila jen do výšky h/2.',
  '',
  '2mgh stačí, ale není to minimum.',
]

[[question]]
id = 'A10a'
topic = 'Tření a rozklad sil'
source = 'Test A (2014) · A10 (přepsáno na výběr)'
tags = ["old"]
text = '''
Bedna o tíze $G$ je vlečena lanem silou $F$. Lano svírá s vodorovným směrem úhel $\alpha$, koeficient dynamického tření je $f_d$. Jak velká je třecí síla?
'''
figure = 'images/bedna-tah-sikmo-nahoru-g.svg'
options = [
  '$f_d \cdot G$',
  '$f_d \cdot (G - F \sin \alpha)$',
  '$f_d \cdot (G + F \sin \alpha)$',
  '$f_d \cdot F \cos \alpha$',
  '$F \cos \alpha$',
]
answer = 1
explanation = '''
Rozlož sílu lana: $F_x = F \cos \alpha$ (ve směru pohybu), $F_y = F \sin \alpha$ (nahoru, bednu nadlehčuje). Svisle se bedna nepohybuje:

$$N + F\sin\alpha - G = 0 \quad\Rightarrow\quad N = G - F\sin\alpha$$

Třecí síla: $F_t = f_d \cdot N = f_d(G - F \sin \alpha)$.
'''
notes = [
  'Platí jen pro vodorovné lano. Šikmé lano bednu nadlehčuje.',
  '',
  'Plus by platilo, kdyby síla tlačila šikmo dolů.',
  'Tření závisí na normálové síle, ne na vodorovné složce F.',
  '$F \cos \alpha$ je tažná složka. Třecí síle by se rovnala jen při rovnoměrném pohybu.',
]

[[question]]
id = 'A10b'
topic = 'Tření a rozklad sil'
source = 'Test A (2014) · A10 (pokračování)'
tags = ["old"]
text = '''
Stejná bedna (tíha $G$, síla $F$ pod úhlem $\alpha$, koeficient $f_d$). Pohybová rovnice ve směru osy $x$ (směr pohybu) je:
'''
figure = 'images/bedna-tah-sikmo-nahoru-g.svg'
options = [
  '$(G/g) \cdot a = F - f_dG$',
  '$(G/g) \cdot a = F \cos \alpha - f_d(G - F \sin \alpha)$',
  '$(G/g) \cdot a = F \sin \alpha - f_d(G - F \cos \alpha)$',
  '$G \cdot a = F \cos \alpha - f_dG$',
  '$(G/g) \cdot a = F \cos \alpha + f_d(G - F \sin \alpha)$',
]
answer = 1
explanation = '''
Hmotnost bedny je $m = G/g$. Ve směru $x$ táhne $F \cos \alpha$ a proti pohybu brzdí tření:

$$m \cdot a = F\cos\alpha - f_d\,(G - F\sin\alpha)$$

Postup u každé takové úlohy: nakresli síly (G dolů, N kolmo od podložky, F po laně, tření proti pohybu), zvol osy, rozlož F na složky, napiš rovnici pro osu y (z ní N) a pro osu x (z ní a).
'''
notes = [
  'Zapomíná na úhel: tažná je jen složka $F \cos \alpha$ a tření je menší kvůli nadlehčení.',
  '',
  'Prohozené sin a cos. Vodorovná složka je $F \cos \alpha$.',
  'G je tíha (N), ne hmotnost. $m = G/g$. Tření je navíc bez nadlehčení.',
  'Tření působí proti pohybu, musí se odečíst.',
]

