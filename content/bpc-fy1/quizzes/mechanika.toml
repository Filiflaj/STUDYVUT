[[question]]
id = 'E6'
kind = "numeric"
topic = 'Vrhy'
source = 'E-learning'
tags = ["old"]
text = '''
Při sněhové bitvě se dítě chystá hodit sněhovou kouli na další dítě, které je vzdálené $d = 8\,\mathrm{m}$ na vyvýšenině (1 m nad úrovní prvního dítěte). Určete počáteční rychlost sněhové koule při elevačním úhlu $\alpha = 30^\circ$ tak, aby zasáhla druhé dítě. ($g = 9{,}81\,\mathrm{m/s^2}$)
'''
figure = 'images/snehova-koule.svg'
value = 10.8
tolerance = 0.2
unit = 'm/s'
explanation = '''
Rozlož pohyb na vodorovný (rovnoměrný) a svislý (rovnoměrně zrychlený):

$$x = v_0 \cos\alpha \cdot t, \qquad y = v_0 \sin\alpha \cdot t - \tfrac{1}{2} g t^2$$

Z první rovnice $t = d / (v_0 \cos \alpha)$, dosaď do druhé s $y = 1\,\mathrm{m}$:

$$1 = d \cdot \operatorname{tg}\alpha - \frac{g d^2}{2 v_0^2 \cos^2\alpha}$$

$$1 = 4{,}619 - \frac{9{,}81 \cdot 64}{1{,}5 \cdot v_0^2} \quad\Rightarrow\quad v_0^2 = \frac{627{,}8}{5{,}428} = 115{,}7$$

$$v_0 \approx 10{,}8\,\mathrm{m/s}$$
'''

[[question]]
id = 'E7'
topic = 'Pohybová rovnice'
source = 'E-learning'
tags = ["old"]
text = '''
Helikoptéra zvedá na laně astronauta o hmotnosti $m = 80\,\mathrm{kg}$ z hladiny oceánu do výšky 10 m se zrychlením $g/5$. Jaká je tahová síla lana $T$?
'''
figure = 'images/helikoptera.svg'
options = [
  '$T = mg$',
  '$T = m(g + a) = 1{,}2 mg$',
  '$T = m(g - a) = 0{,}8 mg$',
  '$T = ma = 0{,}2 mg$',
  '$T = mg/5$',
]
answer = 1
explanation = '''
Na astronauta působí tah lana $T$ (nahoru) a tíha $mg$ (dolů). Vektorově $m\mathbf{a} = \mathbf{T} + m\mathbf{g}$, ve velikostech (osa nahoru):

$$m \cdot a = T - m \cdot g \quad\Rightarrow\quad T = m(g + a) = 1{,}2 \cdot m \cdot g = 1{,}2 \cdot 80 \cdot 9{,}81 \approx 941{,}8\,\mathrm{N}$$

Lano musí tíhu vyrovnat a navíc astronauta urychlovat.
'''
notes = [
  'Platí jen pro zvedání konstantní rychlostí ($a = 0$).',
  '',
  'Takhle by to vyšlo při zrychlení dolů (spouštění se zrychlením).',
  'Zapomíná na tíhu.',
  'Nesmysl, zrychlení není síla.',
]

