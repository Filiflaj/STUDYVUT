[[question]]
id = 'M21'
topic = 'Pohybová rovnice'
source = 'Procvičování'
text = '''
Člověk o hmotnosti 60 kg stojí ve výtahu na váze. Výtah se rozjíždí **dolů** se zrychlením 2 m/s² ($g = 10\,\mathrm{m/s^2}$). Jakou sílou tlačí na váhu?
'''
options = [
  '600 N',
  '720 N',
  '480 N',
  '120 N',
  '0 N',
]
answer = 2
explanation = '''
Na člověka působí tíha $mg$ dolů a normálová síla váhy $N$ nahoru. Osa dolů (ve směru zrychlení):

$$m a = m g - N \quad\Rightarrow\quad N = m(g - a) = 60 \cdot 8 = 480\,\mathrm{N}$$

Stejný typ jako astronaut na laně, jen se zrychlením opačným směrem.
'''
notes = [
  'Platí jen bez zrychlení.',
  'm(g + a) platí pro zrychlení nahoru.',
  '',
  'Jen ma, chybí tíha.',
  'Nulová by byla jen při volném pádu ($a = g$).',
]
