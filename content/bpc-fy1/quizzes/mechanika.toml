explanation = '''
$$W = F s \cos\varphi$$

Síla kolmá k posunutí ($\varphi = 90^\circ$) nekoná práci, $\cos 90^\circ = 0$. Proto práci nekoná ani normálová síla nebo tíha při vodorovném pohybu.
'''
notes = [
  '$W = Fs$.',
  '$W = Fs \cos \alpha$.',
