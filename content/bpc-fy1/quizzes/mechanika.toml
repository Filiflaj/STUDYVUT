  '90°',
  'závisí na délce závěsu',
]
answer = 1
explanation = '''
Z rozkladu tahu závěsu: $T \sin \theta = F$, $T \cos \theta = G$, takže

$$\operatorname{tg}\theta = \frac{F}{G} = 1 \quad\Rightarrow\quad \theta = 45^\circ$$
'''
notes = [
  '$\operatorname{tg} 30^\circ \approx 0{,}58$.',
  '',
  '$\operatorname{tg} 60^\circ \approx 1{,}73$.',
  'To by vyžadovalo nekonečnou sílu.',
  'Délka se v rovnováze sil neuplatní.',
]

[[question]]
id = 'M18'
topic = 'Tření a rozklad sil'
source = 'Procvičování'
text = '''
Bednu táhneme lanem pod úhlem $\alpha$ nad vodorovnou rovinou a bedna se pohybuje **rovnoměrně** (konstantní rychlostí). Jak velká je třecí síla?
'''
figure = 'images/bedna-tah-sikmo-nahoru-m.svg'
options = [
  '$f \cdot mg$',
  '$F$',
  '$F \cos \alpha$',
  '$F \sin \alpha$',
  '$f \cdot F$',
]
answer = 2
explanation = '''
Rovnoměrný pohyb znamená nulovou výslednici. Ve vodorovném směru se třecí síla rovná vodorovné složce tahu:

$$F_t = F\cos\alpha$$

(Zároveň platí $F_t = f(mg - F \sin \alpha)$.)
'''
notes = [
  'Normálová síla je zmenšená o $F \sin \alpha$.',
  'Celá síla F nemíří vodorovně.',
  '',
  'To je svislá složka.',
  'Tření závisí na N, ne na F.',
]

