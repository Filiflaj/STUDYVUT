[[question]]
id = 'A1'
topic = 'Newtonovy zákony'
source = 'Test A (2014) · A1'
tags = ["old"]
text = '''
Tři kvádry (A, B, C), každý o stejné hmotnosti $M$, jsou spojeny lankem. Kvádr C je tažen doprava silou $T$, která působí tak, že celý systém zrychluje. Zanedbáme-li tření, je **výsledná** síla působící na kvádr B rovna:
'''
figure = 'images/tri-kvadry.svg'
options = [
  'nule',
  '$T/2$',
  '$T/3$',
  '$2T/3$',
  '$T$',
]
answer = 2
explanation = '''
Celý systém má hmotnost $3M$ a všechny kvádry mají stejné zrychlení:

$$a = \frac{T}{3M}$$

Výsledná síla na B je podle 2. Newtonova zákona $M \cdot a = T/3$. Pro kontrolu: lanko B–C táhne B doprava silou $2T/3$ (táhne A i B), lanko A–B ho brzdí silou $T/3$ (táhne jen A). Rozdíl je $T/3$.
'''
notes = [
  'Nula by vyšla jen při rovnoměrném pohybu ($a = 0$). Systém ale zrychluje.',
  'T/2 neodpovídá žádnému rozdělení hmotnosti, tady jsou tři stejné díly.',
  '',
  '2T/3 je síla v lanku mezi B a C (to táhne A+B). Na B ale zároveň působí lanko A–B opačným směrem.',
  'T je výsledná síla na celý systém, ne na jeden kvádr.',
]
warning = 'Na naskenovaném listu je označena možnost e). To je chyba, správně je c) T/3.'

[[question]]
id = 'A3'
topic = 'Normálová síla'
source = 'Test A (2014) · A3'
tags = ["old"]
text = '''
Dřevěný kvádr je tažen silou $F$ po drsné podložce ve dvou různých případech (viz obrázek). Velikost síly je pro oba případy stejná. Normálová síla, kterou působí podložka na kvádr v situaci (b), je ve srovnání se situací (a):
'''
figure = 'images/kvadr-vodorovne-a-na-naklonene-rovine.svg'
options = [
  'stejná.',
  'větší.',
  'menší.',
  'menší pro některé úhly $\alpha$ a větší pro úhly ostatní.',
  'menší nebo větší v závislosti na velikosti síly $F$.',
]
answer = 2
explanation = '''
(a) Síla $F$ je vodorovná, nemá svislou složku, proto $N = mg$.

(b) Na nakloněné rovině vyrovnává normálová síla jen složku tíhy kolmou k podložce. Síla $F$ míří podél podložky, do kolmého směru nepřispívá:

$$N = mg \cdot \cos\alpha < mg$$
'''
notes = [
  'Stejná by byla jen pro $\alpha = 0$ (vodorovná podložka).',
  '$\cos \alpha$ nikdy nepřesáhne 1, normálová síla nemůže být větší.',
  '',
  '$\cos \alpha < 1$ pro všechny úhly 0° až 90°, výsledek na úhlu nezávisí.',
  'F je rovnoběžná s podložkou, normálovou sílu vůbec neovlivní.',
]

[[question]]
id = 'A4'
topic = 'Newtonovy zákony'
source = 'Test A (2014) · A4'
tags = ["old"]
text = '''
Stejné síly $F$ působí na tělesa A a B. Hmotnost B je třikrát větší než hmotnost A. Velikost zrychlení tělesa A je:
'''
figure = 'images/telesa-a-b-stejna-sila.svg'
options = [
