[[question]]
id = 'B5'
topic = 'Rovnováha sil'
source = 'Test B (2015) · B5'
tags = ["old"]
text = '''
Závaží kyvadla, jehož tíha je 1 N, je vodorovnou silou o velikosti $F = 2\,\mathrm{N}$ vychýleno o úhel $\theta$ od vertikály. Síla v newtonech, napínající závěs kyvadla, je:
'''
figure = 'images/kyvadlo-2n-1n.svg'
options = [
  '$l \cos \theta$',
  '$2 l \cos \theta$',
  '$\sqrt{5}$',
  '$l \sin \theta$',
  '1',
]
answer = 2
explanation = '''
Závaží je v klidu, takže tah lanka $T$ musí vyrovnat výslednici tíhy (1 N dolů) a síly $F$ (2 N vodorovně). Tyto dvě síly jsou na sebe kolmé:

$$T = \sqrt{G^2 + F^2} = \sqrt{1^2 + 2^2} = \sqrt{5} \approx 2{,}24\,\mathrm{N}$$

Navíc platí $\operatorname{tg} \theta = F/G = 2$.
'''
notes = [
  'Obsahuje délku l v metrech. Síla v newtonech na délce záviset nemůže (rozměrová kontrola).',
  'Obsahuje délku l, rozměrově špatně.',
  '',
  'Obsahuje délku l, rozměrově špatně.',
  '1 N je jen tíha. Lanko musí vyrovnat i vodorovnou sílu F.',
