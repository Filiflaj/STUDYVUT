answer = 0
explanation = '''
V kovu je volných elektronů hodně už za nízkých teplot a s teplotou jich nepřibývá. Převládne zkracování střední doby mezi srážkami s kmitajícími atomy, a odpor proto roste (přibližně lineárně).
'''
notes = [
  '',
