[[question]]
id = 'L18-09'
topic = 'Úloha 18: termistory a PT100'
source = 'Okruhy k testu, úloha 18'
tags = ["lab"]
text = '''
Do jakého grafu se vynesou hodnoty NTC termistoru, aby vyšla přímka, ze které se určí $B$?
'''
options = [
  '$\ln R$ proti $\left(\frac1T - \frac1{T_0}\right)$, směrnice je $B$',
  '$R$ proti $T$, směrnice je $B$',
  '$\ln R$ proti $T$, směrnice je $-B$',
  '$R$ proti $\frac1T$, směrnice je $\ln B$',
]
answer = 0
explanation = '''
Zlogaritmováním $R = R_0\,\mathrm{e}^{B(1/T - 1/T_0)}$ dostaneme $\ln R = \ln R_0 + B\left(\frac1T - \frac1{T_0}\right)$: přímka se směrnicí $B$ a úsekem $\ln R_0$.
'''
notes = [
  '',
  'Závislost $R(T)$ je exponenciální, přímka nevyjde.',
  'Logaritmus odporu je lineární v $1/T$, ne v $T$.',
  'Bez logaritmu odporu přímka nevyjde.',
]

