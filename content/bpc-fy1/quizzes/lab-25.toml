name = 'Úloha 25: Měrný náboj elektronu'
description = 'vstupní test: náboj v elektrickém a magnetickém poli, cívka, magnetron'

[[question]]
id = 'L25-01'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Dlouhá cívka má 1000 závitů na délce $20\ \mathrm{cm}$ a teče jí proud $0{,}5\ \mathrm{A}$. Jak velká je magnetická indukce uvnitř cívky? Výsledek v mT.
'''
value = 3.14
tolerance = 0.02
unit = 'mT'
explanation = '''
$$B = \mu_0\frac{N}{L}I = 4\pi\cdot10^{-7}\cdot\frac{1000}{0{,}20}\cdot0{,}5 = 3{,}14\cdot10^{-3}\ \mathrm{T}$$
'''

[[question]]
id = 'L25-02'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Vypočítejte měrný náboj elektronu z hodnot $e = 1{,}6\cdot10^{-19}\ \mathrm{C}$ a $m = 9{,}1\cdot10^{-31}\ \mathrm{kg}$. Odpověď v jednotkách $10^{11}\ \mathrm{C\,kg^{-1}}$.
'''
value = 1.758
tolerance = 0.01
unit = '·10¹¹ C/kg'
explanation = '''
$$\frac{e}{m} = \frac{1{,}6\cdot10^{-19}}{9{,}1\cdot10^{-31}} \doteq 1{,}76\cdot10^{11}\ \mathrm{C\,kg^{-1}}$$
S touto hodnotou se porovnává výsledek měření.
'''

[[question]]
id = 'L25-03'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Elektron letí rychlostí $10^{7}\ \mathrm{m\,s^{-1}}$ kolmo k magnetickému poli $B = 5\ \mathrm{mT}$. Jak velká magnetická síla na něj působí? Odpověď v jednotkách $10^{-15}\ \mathrm{N}$.
'''
value = 8.0
tolerance = 0.05
unit = '·10⁻¹⁵ N'
explanation = '''
$$F_m = evB\sin90^\circ = 1{,}6\cdot10^{-19}\cdot10^{7}\cdot5\cdot10^{-3} = 8{,}0\cdot10^{-15}\ \mathrm{N}$$
'''

[[question]]
id = 'L25-04'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Návod, Dodatek, úloha 25'
tags = ["lab"]
text = '''
Elektron ($m = 9{,}1\cdot10^{-31}\ \mathrm{kg}$, $e = 1{,}6\cdot10^{-19}\ \mathrm{C}$) vletí rychlostí $10^{7}\ \mathrm{m\,s^{-1}}$ kolmo do homogenního pole $B = 5\ \mathrm{mT}$. Jaký je poloměr jeho dráhy? Výsledek v mm.
'''
value = 11.4
tolerance = 0.1
unit = 'mm'
explanation = '''
Magnetická síla je dostředivá: $evB = mv^2/r$, takže
$$r = \frac{mv}{eB} = \frac{9{,}1\cdot10^{-31}\cdot10^{7}}{1{,}6\cdot10^{-19}\cdot5\cdot10^{-3}} = 1{,}14\cdot10^{-2}\ \mathrm{m}$$
'''

[[question]]
id = 'L25-05'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Elektron se z klidu urychlí napětím $10\ \mathrm{V}$. Jakou získá rychlost? ($e/m = 1{,}76\cdot10^{11}\ \mathrm{C\,kg^{-1}}$) Odpověď v jednotkách $10^{6}\ \mathrm{m\,s^{-1}}$.
'''
value = 1.875
tolerance = 0.01
unit = '·10⁶ m/s'
explanation = '''
Práce pole se změní v kinetickou energii: $\tfrac12mv^2 = eU$.
$$v = \sqrt{2\frac{e}{m}U} = \sqrt{2\cdot1{,}76\cdot10^{11}\cdot10} \doteq 1{,}88\cdot10^{6}\ \mathrm{m\,s^{-1}}$$
'''

[[question]]
id = 'L25-06'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Elektron obíhá v homogenním magnetickém poli $B = 2\ \mathrm{mT}$ rychlostí $3\cdot10^{6}\ \mathrm{m\,s^{-1}}$ kolmou k poli. Pole vytváří cívka délky $30\ \mathrm{cm}$. Jaká je doba jednoho oběhu? ($m = 9{,}1\cdot10^{-31}\ \mathrm{kg}$, $e = 1{,}6\cdot10^{-19}\ \mathrm{C}$) Výsledek v ns.
'''
value = 17.9
tolerance = 0.1
unit = 'ns'
explanation = '''
$$T = \frac{2\pi r}{v} = \frac{2\pi m}{eB} = \frac{2\pi\cdot9{,}1\cdot10^{-31}}{1{,}6\cdot10^{-19}\cdot2\cdot10^{-3}} \doteq 1{,}79\cdot10^{-8}\ \mathrm{s}$$
Doba oběhu na rychlosti nezávisí. Rychlost ani délka cívky k výpočtu potřeba nejsou.
'''
warning = 'V testu bývají zadané i hodnoty, které k řešení nepotřebujete.'

[[question]]
id = 'L25-07'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Návod, úloha 25'
tags = ["lab"]
text = '''
Která síla v magnetronu vychyluje elektrony z radiálního směru?
'''
options = [
  'magnetická (Lorentzova) síla $e\,\vec v\times\vec B$',
  'elektrická síla radiálního pole $eE$',
  'tíhová síla elektronu',
  'odpudivá síla mezi elektrony',
]
answer = 0
explanation = '''
Elektrické pole mezi souosými válci je radiální a elektron urychluje od katody k anodě. Zakřivení dráhy způsobuje magnetická síla, která je vždy kolmá k rychlosti.
'''
notes = [
  '',
  'Elektrická síla míří radiálně, z radiálního směru elektron nevychýlí.',
  'Tíha elektronu je proti elektrickým silám zcela zanedbatelná.',
  'Vzájemné působení elektronů se v modelu zanedbává.',
]

[[question]]
id = 'L25-08'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Návod, úloha 25'
tags = ["lab"]
text = '''
Proč anodový proud po dosažení kritické indukce $B_0$ neklesne skokem na nulu?
'''
options = [
  'Elektrony vyletují z katody s různými nenulovými rychlostmi (Boltzmannovo rozdělení) a geometrie elektrod není ideální.',
  'Magnetické pole cívky je příliš slabé.',
  'Anodové napětí se se zvětšujícím polem zvyšuje.',
  'Část elektronů má kladný náboj.',
]
answer = 0
explanation = '''
Vztah pro $e/m$ předpokládá nulovou počáteční rychlost a dokonale souosé nekonečné elektrody. Ve skutečnosti mají elektrony různé počáteční rychlosti, takže každý „dosáhne“ své kritické indukce jinde a skok se změní ve spojitý pokles. Podle návodu odpovídá $B_0$ inflexnímu bodu sestupné větve.
'''
notes = [
  '',
  'Síla pole se při měření plynule zvyšuje, o to nejde.',
  'Anodové napětí se při jedné sérii drží konstantní.',
  'Elektrony mají všechny záporný náboj.',
]

[[question]]
id = 'L25-09'
kind = 'numeric'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Magnetron má katodu o poloměru $R_\mathrm{k} = 3\ \mathrm{mm}$ a anodu $R_\mathrm{a} = 5\ \mathrm{mm}$. Při anodovém napětí $10\ \mathrm{V}$ vyšla kritická indukce $B_0 = 6{,}0\ \mathrm{mT}$. Jaký měrný náboj z toho vychází podle $\dfrac{e}{m} = \dfrac{8U_\mathrm{a}R_\mathrm{a}^2}{(R_\mathrm{a}^2 - R_\mathrm{k}^2)^2B_0^2}$? Odpověď v jednotkách $10^{11}\ \mathrm{C\,kg^{-1}}$.
'''
value = 2.17
tolerance = 0.02
unit = '·10¹¹ C/kg'
explanation = '''
$$\frac{e}{m} = \frac{8\cdot10\cdot(5\cdot10^{-3})^2}{\bigl((5\cdot10^{-3})^2 - (3\cdot10^{-3})^2\bigr)^2\cdot(6{,}0\cdot10^{-3})^2} = \frac{2{,}0\cdot10^{-3}}{(1{,}6\cdot10^{-5})^2\cdot3{,}6\cdot10^{-5}} \doteq 2{,}17\cdot10^{11}\ \mathrm{C\,kg^{-1}}$$
'''
warning = 'Poloměry v metrech a indukci v teslách.'

[[question]]
id = 'L25-10'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Jakou práci koná magnetická síla na pohybující se elektron?
'''
options = [
  'Žádnou, síla je kolmá na rychlost a mění jen směr pohybu.',
  'Kladnou, elektron zrychluje.',
  'Zápornou, elektron zpomaluje.',
  'Záleží na velikosti indukce.',
]
answer = 0
explanation = '''
$\vec F_m = q\,\vec v\times\vec B$ je v každém okamžiku kolmá na rychlost, její výkon $\vec F\cdot\vec v = 0$. Velikost rychlosti (a kinetická energie) se nemění, mění se jen směr.
'''
notes = [
  '',
  'Elektron v magnetronu urychluje elektrické pole, ne magnetické.',
  'Magnetická síla rychlost nezmenšuje, jen stáčí.',
  'Kolmost síly na rychlost platí pro libovolné $B$.',
]

[[question]]
id = 'L25-11'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Okruhy k testu, úloha 25'
tags = ["lab"]
text = '''
Jakou dráhu opisuje nabitá částice v homogenním magnetickém poli, když má rychlost kolmou k poli?
'''
options = ['kružnici', 'přímku', 'parabolu', 'šroubovici']
answer = 0
layout = 'grid'
explanation = '''
Magnetická síla má stálou velikost $qvB$ a je stále kolmá na rychlost, působí jako dostředivá síla: pohyb po kružnici o poloměru $r = mv/(qB)$. Šroubovice vznikne, když má rychlost i složku podél pole.
'''
notes = [
  '',
  'Přímka je jen pro rychlost rovnoběžnou s polem (síla je pak nulová).',
  'Parabolu opisuje částice ve stálém elektrickém (nebo tíhovém) poli.',
  'Šroubovice vyžaduje složku rychlosti podél pole.',
]

[[question]]
id = 'L25-12'
topic = 'Úloha 25: měrný náboj elektronu'
source = 'Návod, úloha 25'
tags = ["lab"]
text = '''
Výsledky $e/m$ pro tři anodová napětí se navzájem znatelně liší. Jak je podle návodu uvést?
'''
options = [
  'Neprůměrovat je a uvést, u kterého napětí je přesnost nejvyšší.',
  'Zprůměrovat všechny tři a uvést průměr.',
  'Ponechat jen ten, který je nejblíž tabulkové hodnotě.',
  'Vyřadit krajní napětí a ponechat prostřední.',
]
answer = 0
explanation = '''
Když se výsledky liší víc, než odpovídá jejich chybám, průměr by zakryl soustavný rozdíl. Návod chce výsledky uvést zvlášť, označit nejpřesnější a porovnat s tabulkovou hodnotou.
'''
notes = [
  '',
  'Průměr výsledků, které se liší víc než o chyby, nemá smysl.',
  'Vybírat podle tabulkové hodnoty je zkreslování výsledku.',
  'Volba prostředního napětí nemá oporu v metodě.',
]
