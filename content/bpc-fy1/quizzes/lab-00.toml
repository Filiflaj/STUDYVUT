[[question]]
id = 'L00-01'
kind = 'numeric'
topic = 'Zpracování měření'
source = 'Úvod do měření'
tags = ["lab"]
text = '''
Doba kmitu byla změřena pětkrát: $2{,}31$; $2{,}35$; $2{,}29$; $2{,}33$; $2{,}32$ s. Jaká je chyba výsledku $\delta = t\cdot s_{\bar x}$ pro $P = 95\ \%$ (před zaokrouhlením)?
'''
value = 0.0297
tolerance = 0.0015
unit = 's'
explanation = '''
$$\bar x = \frac{11{,}60}{5} = 2{,}320\ \mathrm{s}$$
Odchylky od průměru: $-0{,}01$; $0{,}03$; $-0{,}03$; $0{,}01$; $0$, součet čtverců $0{,}0020\ \mathrm{s^2}$.
$$s_{\bar x} = \sqrt{\frac{0{,}0020}{5\cdot4}} = 0{,}0100\ \mathrm{s} \qquad \delta = t_{5;\,0{,}95}\cdot s_{\bar x} = 2{,}968\cdot0{,}0100 = 0{,}0297\ \mathrm{s}$$
Zapsáno: $T = (2{,}32 \pm 0{,}03)\ \mathrm{s}$, $n = 5$, $P = 95\ \%$.
'''

