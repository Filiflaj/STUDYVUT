[[question]]
id = 'L00-05'
kind = 'numeric'
topic = 'Zpracování měření'
source = 'Úvod do měření'
tags = ["lab"]
text = '''
Tíhové zrychlení se počítá ze vztahu $g = 4\pi^2\ell/T^2$. Relativní chyba délky je $0{,}06\ \%$, doby kmitu $0{,}04\ \%$. Jaká je relativní chyba $g$ (zjednodušený zákon šíření chyb)?
'''
value = 0.14
tolerance = 0.005
unit = '%'
explanation = '''
Pro součin a podíl mocnin se sčítají relativní chyby vynásobené absolutní hodnotou exponentu:
$$\delta_\mathrm{r}(g) = 1\cdot\delta_\mathrm{r}(\ell) + 2\cdot\delta_\mathrm{r}(T) = 0{,}06 + 2\cdot0{,}04 = 0{,}14\ \%$$
'''

