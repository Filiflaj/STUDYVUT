id = 'L00-07'
topic = 'Zpracování měření'
source = 'Úvod do měření'
tags = ["lab"]
text = '''
Odpor se určuje z $R = U/I$. Napětí $4{,}80\ \mathrm{V}$ změřené voltmetrem třídy $0{,}5$ na rozsahu $6\ \mathrm{V}$, proud $12{,}0\ \mathrm{mA}$ ampérmetrem třídy $1$ na rozsahu $15\ \mathrm{mA}$. Jaká je relativní chyba odporu (po zaokrouhlení)?
'''
options = ['$1{,}9\ \%$', '$1{,}5\ \%$', '$1{,}25\ \%$', '$0{,}63\ \%$']
answer = 0
layout = 'grid'
explanation = '''
Mezní chyby z třídy přesnosti: $\delta(U) = 0{,}005\cdot6 = 0{,}03\ \mathrm{V}$, $\delta(I) = 0{,}01\cdot15 = 0{,}15\ \mathrm{mA}$.
$$\delta_\mathrm{r}(R) = \frac{0{,}03}{4{,}80} + \frac{0{,}15}{12{,}0} = 0{,}63\ \% + 1{,}25\ \% = 1{,}875\ \% \to 1{,}9\ \%$$
Chyba začíná jedničkou, proto dvě platné číslice (zaokrouhleno nahoru). Rozhoduje ampérmetr. $R = 400\ \Omega$, $\delta(R) = 400\cdot0{,}01875 = 7{,}5\ \Omega \to 8\ \Omega$.
'''
notes = [
  '',
  'To je jen součet tříd přesnosti; chyba se vztahuje k rozsahu, ne k naměřené hodnotě.',
  'To je jen příspěvek ampérmetru.',
  'To je jen příspěvek voltmetru.',
]

