source = 'Úvod do měření'
tags = ["lab", "pocty"]
text = '''
Doba průchodu byla změřena patnáctkrát a kalkulačka ukázala $\sigma_{n-1} = 0{,}42\ \mathrm{s}$. Jaká je chyba výsledku $\delta = t\cdot s_{\bar x}$ pro $P = 95\ \%$ (před zaokrouhlením)?
'''
value = 0.233
tolerance = 0.003
unit = 's'
explanation = '''
$\sigma_{n-1}$ je odchylka jednoho měření, nejdřív se vydělí $\sqrt n$:
$$s_{\bar x} = \frac{0{,}42}{\sqrt{15}}\ \mathrm{s} = \frac{0{,}42}{3{,}873}\ \mathrm{s} = 0{,}108\ \mathrm{s} \qquad \delta = t_{15;\,0{,}95}\cdot s_{\bar x} = 2{,}145\cdot0{,}108 = 0{,}233\ \mathrm{s}$$
Zapsáno nahoru na jednu platnou číslici: $\delta = 0{,}3\ \mathrm{s}$.
'''

