[package]
name = "studyvut"
description = "STUDYVUT: study texts and quizzes for every subject"
version = "0.2.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "studyvut"

[lib]
name = "studyvut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studyvut-core = { workspace = true, features = ["store"] }
studyvut-service.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
anyhow.workspace = true
# The content folder, built into the app (src/content.rs).
include_dir = "0.7"
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
thiserror.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber.workspace = true

[lints]
workspace = true
